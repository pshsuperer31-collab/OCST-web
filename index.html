/* 괘별 상황 서술 — GUA[괘번호] = [라벨, 서술].
   ①본괘는 라벨+서술을, ③互 ④綜 ⑤之 ⑥序卦·錯은 라벨만 받는다.
   아직 안 쓴 괘는 비워두고 그 자리는 예전처럼 괘 이름만 나온다. */
const GUA = {"1":["막힘없이 밀어붙이는 판","여섯 자리가 다 강해서 걸릴 것이 없는 판입니다. 밀면 밀리기 때문에, 위험은 바깥이 아니라 과속에서 옵니다. 이 괘에서 국면이 갈리는 것은 오직 얼마나 왔느냐 하나예요 — 잠긴 용에서 끝까지 오른 용까지."],"2":["받아서 이루는 판","내가 시작하는 판이 아니라, 오는 것을 받아 완성하는 판입니다. 버티고 따르는 것이 일이라 앞질러 나서면 어그러집니다. 다만 서리를 밟으면 얼음이 오듯, 조짐은 미리 읽어두어야 해요."],"3":["시작의 진통","무언가 막 시작됐는데 앞이 험한 자리입니다. 밀고 나갈 힘은 아래에서 치미는데 위가 막혀 있어, 나아가려 할수록 엉킵니다. 지금은 뚫을 때가 아니라 자리를 잡고 사람을 얻을 때예요."],"4":["몰라서 멈춰 선 판","앞은 험한데 위가 막혀 있어, 모르니까 발이 안 떨어지는 자리입니다. 무지와 정체가 한 몸이에요. 답을 쥔 쪽이 따로 있어 내가 물어야 풀리는데, 억지로 깨우치려 들면 되레 반발이 옵니다."],"5":["기다려야 하는 판","힘은 충분한데 앞에 험한 것이 놓여 아직 못 건너는 자리입니다. 실력이 모자란 게 아니라 때가 안 된 것이라, 조급하면 진흙에 빠집니다. 먹고 마시며 기다리는 것이 이 괘의 일이에요."],"6":["다투게 되는 판","위는 위대로 아래는 아래대로 등을 돌린 자리입니다. 서로 어긋나 다툼이 생기는데, 이겨도 남는 것이 없습니다. 오래 끌지 않고 일찍 물러나는 쪽이 실속을 챙깁니다."],"7":["사람을 써서 치르는 판","혼자 감당 못 할 일을 사람을 써서 치르는 자리입니다. 땅속에 물이 모이듯 힘은 이미 모여 있고, 문제는 그걸 누구에게 맡기고 무엇으로 묶느냐예요. 명분과 규율이 서지 않으면 이겨도 시체를 싣고 돌아옵니다."],"8":["붙어야 사는 판","혼자 서는 자리가 아니라 어디에 붙느냐로 갈리는 자리입니다. 중심이 분명하면 사람이 모이고, 늦게 붙으면 남는 자리가 없습니다. 다만 아무에게나 붙으면 사람 같지 않은 이를 따르게 돼요."],"9":["밀리는데 딱 하나가 막는 판","아래는 강하게 밀어 올리는데 위에서 부드러운 하나가 가로막습니다. 힘으로 뚫리는 벽이 아니라 스며들어 설득해야 열리는 벽이에요. 크게 쌓을 때가 아니라 작게 모으며 때를 기다릴 자리입니다."],"10":["호랑이 꼬리를 밟고 가는 판","위가 지나치게 강하고 나는 그 아래서 조심스럽게 처신해야 하는 자리입니다. 밟는다는 것은 한 발씩 예를 지켜 딛는 일이라, 기세로 나가면 물리고 조심조심 가면 지나갑니다. 실력보다 태도가 결과를 가릅니다."],"11":["막힘없이 통하는 판","위는 내려오려 하고 아래는 올라가려 해 기운이 서로 사귀는 때입니다. 뜻 맞는 사람이 무리로 따라오니 나아가면 이롭습니다. 다만 평탄하기만 한 것은 없어서, 통할 때 기울 것을 미리 셈해두어야 해요."],"12":["위아래가 등 돌린 판","위는 위대로 올라가고 아래는 아래대로 내려가 서로 만나지 않습니다. 뜻이 통하지 않으니 밀어붙일수록 헛심만 씁니다. 뜻 같은 이와 물러나 지키는 것이 이 판의 일이고, 막힘도 끝까지 가면 기웁니다."],"13":["함께할 사람을 찾는 판","밝게 살펴 뜻 맞는 사람과 함께해야 풀리는 자리입니다. 끼리끼리 좁게 뭉치면 인색해지고, 문 밖으로 넓게 열면 허물이 없습니다. 누구와 함께하느냐가 일의 크기를 정합니다."],"14":["크게 가진 판","아래는 강하고 위는 밝아 가진 것이 많은 때입니다. 문제는 얻는 것이 아니라 그것을 어떻게 지니느냐예요. 드러내 자랑하면 깎이고, 삼가 낮추면 하늘까지 돕는 자리입니다."],"15":["낮출수록 올라가는 판","산이 땅 아래 있는 형국이라, 높은 것을 낮은 데 두는 자리입니다. 64괘에서 여섯 효가 모두 길한 유일한 괘예요. 공이 있어도 내세우지 않으면 사람이 절로 모이고, 겸손이 물러섬은 아니라서 바로잡을 일에는 단호해도 됩니다."],"16":["들뜨기 쉬운 판","아래가 순히 따르고 위에서 움직임이 터져 나와 신이 나는 때입니다. 그만큼 방심이 빠른 자리라, 떠벌리면 흉하고 기미를 보아 절도를 지키면 길합니다. 즐거움 자체가 아니라 거기 잡아먹히느냐가 갈림이에요."],"17":["따라가야 하는 판","아래가 움직이고 위가 기뻐하니 내가 이끌기보다 따라가는 자리입니다. 문제는 무엇을 따르느냐 — 가까운 것에 끌리면 정작 바른 짝을 놓칩니다. 사사로움을 벗고 문을 나가 사귀면 공이 있습니다."],"18":["묵은 폐단을 손봐야 하는 판","오래 방치되어 안에서부터 썩은 것을 떠맡는 자리입니다. 내가 만든 일이 아니어도 지금 내 손에 있으니 고쳐야 해요. 다만 거칠게 밀면 탈이 나고 느슨히 두면 더 곪으니, 강약을 가려 손대는 것이 요령입니다."],"19":["위에서 다가가는 판","아래에서 힘이 자라 위로 다가가는 때입니다. 어떤 태도로 임하느냐가 전부라, 지혜로 임하면 맡길 수 있고 달콤한 말로 임하면 이로울 것이 없습니다. 기세가 좋을 때일수록 임하는 결을 살펴야 해요."],"20":["보고 살펴야 하는 판","아직 손댈 때가 아니라 보는 때입니다. 다만 어린아이처럼 얕게 보거나 문틈으로 엿보면 부끄러움이 남습니다. 남이 나를 어떻게 보는지까지 헤아려야 처신이 서는 자리예요."],"21":["걸린 것을 씹어 없애야 하는 판","입 안에 무언가 걸려 있어 그것을 씹어내야 합쳐지는 자리입니다. 어물쩍 넘기면 계속 걸리니, 밝게 가려 단호히 잘라야 합니다. 작을 때 손대면 가벼운 벌로 끝나고, 미루면 극형에 이릅니다."],"22":["겉을 꾸미는 판","산 아래 불이 비쳐 무늬가 드러나는 자리입니다. 꾸밈이 필요한 때이나 그것이 본바탕을 넘어서면 안 됩니다. 이 괘의 끝이 흰 꾸밈인 것처럼, 가장 좋은 꾸밈은 결국 덜어낸 것이에요."],"23":["아래부터 깎여 나가는 판","자라 오르는 것들이 하나 남은 것을 아래부터 깎아 올라오는 때입니다. 평상 다리에서 시작해 살갗까지 닿으니, 버티는 것 말고 할 수 있는 일이 적습니다. 다만 맨 위 열매 하나는 먹히지 않아 다음 씨앗이 됩니다."],"24":["돌아오는 판","다 깎인 자리에 힘 하나가 되돌아온 때입니다. 아직 작지만 방향이 바뀌었다는 것이 중요해요. 멀리 가기 전에 빨리 돌아오면 크게 길하고, 끝내 못 돌이키면 흉이 깊습니다."],"25":["꾸미지 않아야 하는 판","억지로 도모하지 않고 사심 없이 움직여야 통하는 자리입니다. 미리 재고 계산하면 도리어 어긋나요. 잘못 없이 당하는 뜻밖의 화도 있는데, 그럴 땐 손대지 않는 것이 약입니다."],"26":["눌러두며 쌓는 판","강하게 나가려는 힘을 위에서 크게 막아 쌓는 때입니다. 막힘이 손해가 아니라 축적이라는 것이 이 괘의 뜻이에요. 뿔 나기 전에 막듯 근원에서 다스리면 되고, 다 쌓이면 하늘 길이 열립니다."],"27":["무엇으로 기르느냐의 판","위아래가 가운데를 기르는, 입 모양의 자리입니다. 스스로 족한 것을 버리고 남의 것을 넘보면 흉하고, 아래에 겸손히 구하면 오히려 길합니다. 무엇을 먹고 무엇을 먹이는지가 전부인 판이에요."],"28":["들보가 휘도록 지나친 판","가운데가 무겁고 양 끝이 약해 들보가 휘는 형국입니다. 지나침이 이미 정점이라, 힘을 더 주면 부러지고 눅이면 버팁니다. 무리인 줄 알면서 해야 할 때가 있는데, 그때는 흉해도 탓할 것이 없습니다."],"29":["앞뒤가 다 험한 판","구덩이가 겹쳐 물러나도 험하고 나아가도 험한 자리입니다. 벗어날 방향 자체가 없으니 뚫으려 들면 더 깊이 빠집니다. 지금 할 일은 중심을 잃지 않는 것 하나이고, 형식을 낮춰 진심만 통하게 하면 허물은 면합니다."],"30":["밝게 드러나는 판","불이 겹쳐 사방이 환한 자리입니다. 밝다는 것은 잘 본다는 뜻이자 잘 보인다는 뜻이라, 서두르면 어긋나고 삼가면 허물이 없습니다. 밝음의 쓸모는 태우는 데가 아니라 가려내는 데 있어요."],"31":["서로 느끼는 판","위는 기뻐하고 아래는 멈춰 서서 마음이 오가는 자리입니다. 계산으로 다가가면 몇몇만 모이고, 비우고 있으면 두루 통합니다. 먼저 튀어나가도 어긋나고 아예 안 움직여도 완성이 아닌, 진폭을 재는 판이에요."],"32":["오래 끌고 가야 하는 판","한때가 아니라 지속을 묻는 자리입니다. 처음부터 깊이 파고들면 흉하고, 중심을 잃지 않고 일정하게 가면 통합니다. 오래감은 안 움직이는 것이 아니라 일정한 것이라, 흔들림을 지속으로 착각하면 흉해요."],"33":["물러나야 하는 판","아래에서 밀고 올라오는 것이 있어 강한 쪽이 비켜서는 때입니다. 늦게 빠지면 가장 먼저 잡히고, 멀수록 여유롭습니다. 미련이 없어 떠나는 것이 아니라 미련이 있는데도 끊는 것이 이 괘의 결단이에요."],"34":["힘이 넘쳐 부딪히는 판","아래가 강하고 위가 움직여 기세가 가장 센 때입니다. 그 힘으로 울타리를 받으면 뿔이 걸리고, 수레에 실어 밀면 나아갑니다. 받아버리는 힘을 실어 나르는 힘으로 바꿔야 쓸모가 되는 자리입니다."],"35":["밝은 데로 올라가는 판","해가 땅 위로 솟듯 앞으로 나아가는 때입니다. 다만 속도가 아니라 태도가 문제라, 믿음을 못 얻은 채 서두르면 꺾입니다. 잃고 얻음을 따지지 말고 밝게 비추기만 하면 되는 자리예요."],"36":["밝음을 감춰야 하는 판","밝은 것이 땅 밑으로 들어가 상하는 때입니다. 재주를 드러내면 다치니 날개를 접고 낮춰야 해요. 떠나는 길, 다치고 물러나는 길, 남아서 감추는 길 셋이 있는데 어느 쪽이든 밝음 자체를 꺼뜨려선 안 됩니다."],"37":["안을 먼저 다스려야 하는 판","밖이 아니라 안, 조직으로 치면 내부 규율이 걸린 자리입니다. 처음에 경계를 세우면 뉘우칠 일이 없고, 어질러진 뒤 잡으면 이미 늦습니다. 엄함이 과해도 집은 서지만, 헤헤거리면 끝이 부끄러워져요."],"38":["등을 돌린 판","불은 올라가고 물은 내려가듯 서로 반대로 가는 자리입니다. 맞붙으면 골이 깊어지니 쫓지 말고 기다려야 해요. 어긋난 때에는 정식 짝보다 같은 처지끼리가 더 잘 통하고, 끝에 가서는 의심이 풀립니다."],"39":["가면 절고 돌아오면 이어지는 판","앞에 물이 있고 발밑은 산이라 갈 수가 없는 자리입니다. 여섯 효가 한결같이 돌아오는 쪽을 편듭니다. 돌아오는 것은 후퇴가 아니라 힘을 모으는 일이고, 그러면 벗이 옵니다."],"40":["매듭이 풀리는 판","험에서 막 벗어나 얽힌 것이 풀리는 때입니다. 먼저 할 일은 얽히게 만든 자를 걸러내는 것이고, 사사로운 인연부터 풀어야 제대로 된 사람이 옵니다. 풀렸으면 더 손대지 말고 가만두는 것이 옳아요."],"41":["덜어내야 하는 판","아래를 덜어 위를 보태는 자리입니다. 돕는 것도 제 몸을 비우지 않게 헤아려야 하고, 때로는 나서지 않는 것이 곧 돕는 것이에요. 덜어냄이 끝까지 가면 도리어 보태짐으로 뒤집힙니다."],"42":["보태받는 판","위를 덜어 아래를 보태는 때라 받는 쪽에 서 있습니다. 받은 것을 제 것으로 두면 분수에 넘치니 큰 일에 써야 해요. 베푸는 마음이 있으면 돌아오고, 혼자 받기만 바라면 아무도 주지 않습니다."],"43":["끊어내야 하는 판","여럿이 마지막 하나를 끊어내는 결단의 때입니다. 힘이 있어도 지위 없이 먼저 나서면 허물이 되고, 두려워하며 경계하는 쪽이 삽니다. 끊을 대상과 사사로이 얽혀 있다면 그것부터 정리해야 해요."],"44":["작은 것이 파고드는 판","아래에 작은 하나가 생겨 위로 자라 오르는 때입니다. 지금은 약해 보여도 두면 판 전체를 밀어냅니다. 쳐서 없애는 것이 아니라 지금 묶어두거나 덮어 감싸는 것이 방법이에요."],"45":["사람이 모이는 판","아래가 순히 따르고 위가 기뻐해 사람이 모여드는 때입니다. 붙을 곳이 있으면 머뭇대지 말고 불러야 하고, 모으는 데 명분이 없으면 의심을 삽니다. 모임에서 밀려났다면 우는 것도 돌아오려는 마음이에요."],"46":["한 칸씩 오르는 판","땅속에서 나무가 자라듯 위가 통째로 비어 막는 것이 없는 때입니다. 다만 제 힘보다 믿어주는 이가 있느냐가 먼저고, 순서를 건너뛰는 것이 이 길의 가장 흔한 잘못이에요. 오를 데가 없어지면 방향을 안으로 틀어야 합니다."],"47":["말라붙은 판","못의 물이 아래로 새어 말라버린 자리입니다. 앞뒤가 막혀 쉬는 것조차 곤경이 되고, 말로 설명해도 믿어주지 않습니다. 극에 이르면 바뀌니, 뉘우칠 것을 알면서도 움직이는 것이 묶임을 끊는 길이에요."],"48":["길어 올려야 쓰이는 판","물은 있는데 아직 길어 올려지지 않은 자리입니다. 맑기만 해서는 완성이 아니고 사람이 써야 공이 됩니다. 재능이 있어도 이어줄 사람과 그릇이 없으면 쓰이지 못하니, 마지막엔 덮지 말고 열어두어야 해요."],"49":["갈아엎어야 하는 판","못 속에 불이 있어 둘이 함께 못 견디는 자리입니다. 첫 수는 참는 것이고, 논의가 세 번 돌아 사람들이 믿을 때 움직여야 합니다. 힘이 아니라 공론으로 바꾸는 것이며, 다 바꾼 뒤엔 그칠 줄 알아야 완성돼요."],"50":["새로 익히는 판","낡은 것을 깨뜨린 다음 새것을 익히는 때입니다. 처음엔 솥을 엎어 묵은 것을 버리는 일부터 하고, 속을 채운 뒤엔 누구와 함께 드느냐가 남습니다. 그릇이 안 되는 사람을 쓰면 다리가 부러져 다 엎어집니다."],"51":["벼락이 치는 판","우레가 겹쳐 놀람이 거듭되는 자리입니다. 먼저 두려워할 줄 알아야 뒤에 웃을 수 있어요. 잃은 것은 쫓지 말고 중심만 지키면 돌아오고, 남에게 떨어진 벼락을 보고 미리 삼가면 허물이 없습니다."],"52":["멈춰야 하는 판","산이 겹쳐 서로 등지고 멈춘 자리입니다. 여섯 효에 호응이 하나도 없는 드문 괘예요. 한 마디만 억지로 갈라 멈추면 몸이 찢기고 몸째로 거두면 무리가 없습니다. 멈춤은 입을 막는 것이 아니라 때를 가리는 것입니다."],"53":["순서대로 가야 하는 판","기러기가 물가에서 언덕까지 한 칸씩 올라가는 자리입니다. 건너뛰면 있을 곳이 아닌 데 서게 되어 흉합니다. 느리더라도 순서를 지킨 쪽이 중간의 방해를 결국 이겨요."],"54":["순서를 건너뛴 판","기뻐서 먼저 나서 맺어진, 절차를 건너뛴 관계입니다. 자리가 바른 효가 하나뿐일 만큼 어긋난 자리예요. 낮추고 다 채우지 않으면 그런대로 가고, 형식만 남으면 빈 그릇으로 끝납니다."],"55":["가장 성한, 그래서 기우는 판","밝음 위에 움직임이 얹혀 해가 대낮에 이른 때입니다. 그런데 괘 안이 온통 어둠 이미지인 것이 이 괘의 경고예요. 겉이 클수록 속이 비니, 제 밝음을 내세우지 말고 빛나는 이를 불러들여야 합니다."],"56":["남의 땅에 있는 판","내 집이 아닌 곳에 머무는 자리입니다. 잔일에 매달리면 업신여겨지고, 강함을 드러내면 있던 자리마저 잃습니다. 작은 것을 내주고 예를 차리면 이름을 얻고, 높이 올라가면 둥지를 태워요."],"57":["낮춰 스며드는 판","바람이 겹쳐 틈으로 파고드는 자리입니다. 맞부딪히지 않고 순히 들어가야 통합니다. 다만 순함이 지나치면 주변 없이 엎드리는 것이 되니, 속이 차 있느냐가 같은 자세를 정성과 비굴로 가릅니다."],"58":["기쁨이 오가는 판","못이 겹쳐 서로 적셔주는 자리입니다. 기쁨이 안에서 나오면 길하고 밖에서 만들어지면 흉해요. 내려가 비위를 맞추거나 위에서 끌어당기는 기쁨은 오래가지 못합니다."],"59":["흩어지는 판","물 위에 바람이 불어 흩어지는 때입니다. 과제는 흩는 것이 아니라 흩어진 것을 다시 모으는 것이에요. 작은 무리를 흩어야 큰 무리가 서고, 곳간을 풀어야 사람이 모입니다."],"60":["마디를 지어야 하는 판","못이 담을 수 있는 물은 한정되어 있으니 새는 것을 막는 자리입니다. 같은 머무름이 때에 따라 절제가 되기도 하고 때 놓침이 되기도 해요. 달게 지으면 사람이 따르고, 쓰게 지으면 바르더라도 흉합니다."],"61":["믿음으로 가는 판","가운데가 비고 위아래가 감싼, 알을 품은 모양입니다. 믿음은 보이지 않는 데서도 통하지만, 둘로 나누면 이미 믿음이 아니에요. 속은 못 따르는데 소리만 높으면 곧게 해도 흉합니다."],"62":["작게만 지나쳐야 하는 판","날개 펼친 새 모양이라 나는 것은 되는데 방향이 문제입니다. 지나침은 겸손 쪽으로만 허용돼요. 큰 일은 못 하고 작은 일만 되는 때이니, 올라가려 들면 흉하고 내려앉으면 길합니다."],"63":["다 이룬 뒤의 판","여섯 자리가 모두 제자리를 얻은 유일한 괘입니다. 그런데 더 좋아질 여지가 없어 여섯 효가 한결같이 기울 것을 경계해요. 첫 수는 속도를 늦추는 것이고, 이미 건넌 배에도 물이 새기 시작합니다."],"64":["아직 못 건넌 판","여섯 자리가 하나도 안 맞는데 호응은 다 살아 있는 자리입니다. 그래서 앞으로 나아갈 여지가 남았고, 역이 이 괘로 끝납니다. 서두르면 꼬리를 적시고, 삼가며 기다리면 건너요."]};

/* 효별 궁리노트 — NOTE[괘번호] = [初..上] 6개, 각 [노트, 궁리등급].
   "이 효가 왜 이렇게 읽히는가"를 位·中·應·承乘으로 풀어놓은 글.
   있으면 ②국면 카드의 해설이 되고, 없으면 자리문법 일반론으로 폴백한다.

   궁리등급 = 이 해석이 괘의 구조에서 얼마나 곧바로 나오는가.
   앱이 제 근거의 강도를 스스로 밝히는 자리다 — 온고지신. */
const NOTE = {"1":[["잠룡. 양강하나 맨 아래(初)라 아직 때가 아님 → 감추고 쓰지 않음(潛). 得位(正)이나 부중. 純陽이라 應은 전부 敵應.",3],["不正이나 得中 → 세상에 나와 이로움. 中>正 교과서(자리는 어긋나도 中이라 좋음). 利見大人=길함.",3],["得正이나 過剛不中, 하괘 끝의 위태(厲). 종일 근면·저녁 삼감으로 无咎. 3효 多凶의 전형 — 자리 맞아도 中 없어 위태.",3],["뛸까 못에 있을까 망설임 — 4효(근군)의 의심·근신. 나아갈지 물러날지 재량으로 판단하니 无咎.",3],["中正 + 君位 = 절정. 飛龍在天 — 대인이 뜻을 펴는 최고의 자리. 乾의 主爻·최길효.",3],["극에 오른 용, 넘쳐서 후회(亢=넘침). 上효 극·과잉 = 물극필반. ※用九 見群龍无首吉(乾 전효 변시).",3]],"2":[["서리를 밟으면 곧 굳은 얼음 — 음의 시작에서 조짐을 살펴 경계. 初효 잠재. 純陰이라 應은 전부 無應.",3],["中正 → 坤의 이상적 효. 곧고(直) 방정하고(方) 큰(大) 땅의 덕이 자연스러워 无不利. 二多譽의 자리.",3],["빛남을 안으로 머금음(含章). 왕의 일을 좇아도 공을 내세우지 않고(无成) 끝맺음(有終) — 신하의 겸손. 不正이나 유순히 감춤.",2],["주머니 묶듯 입을 다물고 삼가 감춤 → 허물도 명예도 없다. 4효 근신(多懼)의 전형. 得位한 유순의 신중.",3],["黃(중앙색)裳(아래옷·겸손) → 중용의 덕을 안으로 지킴 → 元吉. 음유가 君位이나 得中+겸손이라 크게 길. 坤 主爻.",3],["음이 극성해 양과 충돌(龍戰) — 물극필반의 흉조. 上효 극. ※用六 利永貞(坤 전효 변시).",2]],"3":[["양강·득위·정응이나 험난 시국의 초입(初+屯) → 함부로 안 나아가고 머물러 바름 지키며(居貞) 사람·기반 세움(建侯). 以貴下賤 大得民. 나아감 아닌 지킴.",3],["中正이나 乘剛(初九 올라탐) + 정응 九五가 멀어 → 머뭇대다 십 년 뒤에야 맺음(十年乃字). 험난+乘剛의 지연.",3],["안내(虞) 없이 사슴 쫓아 숲에 빠짐 — 무모. 不正不中+무응이라 도울 이 없어, 그칠 줄 알아야. 가면 吝.",2],["머뭇대다 정응 初九(양강)에게 혼인 구해 나아가면 길. 屯 六四는 정응을 살려 吉 — 六二(乘剛·지연)와 대조. 承(九五 받듦).",3],["中正 君位이나 屯의 험난 → 은택이 막힘(屯其膏). 작은 일엔 길, 큰일엔 흉. 中正君位라도 괘 맥락(屯)이 발목 잡는 사례.",3],["屯의 극에서 음유가 갈 곳 없어 곤궁의 절정(泣血). 上효 극+乘剛(九五 올라탐)+무응 — 사방이 막힘.",3]],"4":[["몽매를 깨우는 시작 — 벌로 다스려 질곡을 벗김이 이로움. 다만 엄함만으로 방임하면 吝. 承(九二 스승 받듦).",2],["강중한 스승, 뭇 몽매를 감싸 가르침(包蒙) → 吉. 六五(君)와 정응 → 실무 위임받는 재상(子克家). 剛柔接. 不正이나 得中이 구함.",3],["不正+乘剛(九二 올라탐) → 돈 있는 남자(金夫) 보고 절개 못 지킴. 응(上九) 있어도 자기가 부정·탐욕이라 无攸利.",3],["몽매에 갇힘(困蒙) → 吝. 두 양(九二 스승·上九)에서 가장 멀고 정응(初六)도 음이라, 어리석음에 고립. 應 부재의 그늘.",3],["어린아이처럼 순한 배움(童蒙) → 吉. 음유 君位이나 得中 + 아래 九二(강중 스승)에 응해 겸손히 맡김. 유약한 임금의 이상적 배움. 承(上九 받듦).",3],["몽매를 쳐서 깨움(擊蒙). 지나친 폭압(爲寇)은 불리, 해악을 막는 정도(禦寇)면 이롭다. 上효 극 = 엄한 교정, 단 넘치지 말 것.",2]],"5":[["험(坎)에서 먼 들(郊)에서 기다림. 조급 말고 항상됨을 지키면 无咎. 得位한 강건의 절제된 기다림.",3],["험에 다가선 모래밭. 약간 구설 있으나 得中으로 너그러이 대처 → 終吉. 敵應(九五)이라 위 도움은 없음.",2],["험(坎) 바로 앞 진흙. 過剛으로 다가서 스스로 도적을 부름(致寇至). 3효 위태 — 敬慎해야 패하지 않음.",3],["험(坎)에 들어 피를 봄. 그러나 得位+유순히 순응해 구덩이에서 벗어남(出自穴). 乘剛(九三 올라탐)이나 順으로 면함.",2],["中正 君位, 여유롭게 술·음식으로 때를 기다림 → 貞吉. 기다림(需)의 완성 — 조급 없이 바름을 지킴.",3],["험의 극(구덩이). 청하지 않은 세 손님(아래 三陽)이 오니, 공경히 맞으면 終吉. 극에서 순응·공경으로 반전. 乘剛(九五 올라탐).",2]],"6":[["다툼을 오래 끌지 않음 → 약간 구설 있으나 終吉. 음유가 그칠 줄 알아 다툼을 안 키움. 承(九二 받듦).",2],["아래(2)에서 위 임금(九五)과 敵應으로 다투나 못 이김(自下訟上, 患至掇也). 得中이라 물러나 숨어 화 면함(无眚). 敵應=맞섬의 흉.",3],["옛 분수(舊德)를 지켜 다투지 않음. 위태로우나(貞厲) 마침내 吉. 왕의 일 좇아도 이룸 없이(无成) 겸손. 음유가 다툼을 피함. 乘剛(九二).",2],["다툼을 못 이겨(不克訟) 돌이켜 천명에 나아가 마음 고치고(渝) 편안히 바름 지키면 吉. 강하나 부정위 — 다툼 접고 순리로.",2],["中正 君位가 다툼을 공정히 판결 → 元吉. 訟의 이상 — 물러나 다투는 자가 아니라 다툼을 다스리는 최고 자리.",3],["다툼을 끝까지 이겨 관대(鞶帶)를 받아도 하루아침에 세 번 빼앗김. 上효 극 = 쟁송을 극단까지 밀어붙여 얻은 영예의 무상함.",3]],"7":[["군대를 낼 땐 규율(律)이 근본 — 기강이 무너지면(否臧) 흉. 出師의 시작. 承(九二 장수 받듦).",2],["유일한 양효=장수, 군중의 중심(在師中). 得中 + 六五(君) 정응해 신임(王三錫命) → 吉无咎. 조건부 리더십의 핵. 不正이나 得中이 구함.",3],["패전해 시체를 실어옴(輿尸) → 凶. 不正不中+乘剛(九二 장수 올라탐) — 무능이 지휘를 넘봄. 無應이라 도울 이 없음.",3],["군대가 후퇴해 주둔(左次) → 无咎. 得位한 유순이 이길 수 없을 때 물러남의 지혜. 무리한 전진 아님.",2],["침입(田有禽)에 토벌 명분(執言) → 无咎. 맏이(長子=九二)에게 군을 맡기면 되나 소인(弟子)이 지휘하면 흉. 得中 君이 정응 九二(장수)에 위임.",3],["전쟁이 끝나 대군(大君)이 공신을 봉함(開國承家). 단 소인은 쓰지 말 것. 上효 극=논공행상, 소인 경계.",2]],"8":[["믿음으로 따름(有孚比之) → 无咎. 질그릇에 가득 찬 믿음 → 뜻밖의 길(有它吉). 比의 시작 = 진실한 믿음.",2],["안에서 따름(自內), 中正이 정응 九五(中正君)에 응 → 貞吉. 안으로부터 바르게 임금을 따름.",3],["잘못된 대상(匪人)을 따름. 不正不中+무응이라 바른 짝 없이 그릇된 이를 좇음. 象: 不亦傷乎 — 슬픈 자리.",3],["밖으로 임금(九五)을 따름(外比), 承으로 어진 이 좇음 → 貞吉. 無應이나 承이 구원. 上六(乘→凶)과 정반대.",3],["드러난 친함(顯比), 앞 짐승 놓아줌(失前禽=억지로 안 잡음), 백성이 두려워 않음 → 吉. 만민이 따르는 中正君의 관대함 — 끌어모음 아닌 놓아줌.",3],["따름에 머리가 없음(无首), 象: 无所終也 → 凶. 乘剛(九五 임금 올라탐)으로 질서 무너짐. 六四(承→吉)와 정반대.",3]],"9":[["제 길로 돌아옴(復自道) → 길. 得位한 양이 바른 길을 지킴. 정응 六四(저지 주체)에 순히 응.",2],["이끌려 돌아옴(牽復) → 吉. 得中으로 初九와 함께 바른 데로. 敵應(九五)이나 中으로 무난.",2],["바퀴살 벗겨지고(輿說輻) 부부 반목 — 九三 過剛이 위 六四(저지)에 막혀 못 나감. 강함이 유(六四)에 걸려 어긋남. 3효 부중.",3],["유일한 음이 뭇 양을 저지 — 믿음(有孚)으로 피 흘림 면하고 두려움서 벗어남 → 无咎. 承(九五 임금 받듦)으로 신임 얻어 저지를 이룸.",3],["믿음으로 이어짐(攣如), 이웃(六四)과 부를 나눔. 中正君이 저지 주체 六四와 이웃해 믿음으로 함께. 有孚=길함 함의.",2],["비 오고 그침(저지 완성) — 덕이 쌓임. 부인(六四) 바르되 위태(貞厲), 달이 거의 참(月幾望=극), 군자 나아가면 흉. 小畜의 극, 가득 차면 위험.",2]],"10":[["꾸밈없이 본분대로 밟아 감(素履) → 无咎. 得位한 양의 소박함.",2],["밟는 길이 평탄(坦坦), 은자(幽人)가 바르면 吉. 得中으로 홀로 담담히 바른 길을 감.",2],["능력 못 미치는데 무리(眇視·跛履) → 호랑이 꼬리 밟아 물림 → 凶. 不正不中+乘剛(九二 올라탐)의 무모. 履의 유일 흉효.",3],["호랑이 꼬리를 밟되 삼가 두려워함(愬愬) → 終吉. 강하나 부정위 — 근신으로 위험을 넘김. 六三(무모→凶)과 대조.",3],["과감하게 밟음(夬履), 中正君이나 지나치게 결단하면 바르되 위태(貞厲). 강중정도 독단은 위험.",2],["밟아온 자취를 돌아봄(視履考祥), 두루 온전히 돌면(旋) 元吉. 上효인데 극이 흉 아니라 완성 — 履의 마무리는 회고로 大吉.",2]],"11":[["띠풀 뿌리째 무리와 함께 — 뜻 같은 이와 함께. 통하는 때(泰)+양강득위 → 나아가면 吉(征吉). 否 초육(貞吉=지킴)과 정반대.",3],["거친 것 포용(包荒), 과감(馮河), 소외 없음(不遐遺), 사사로운 붕당 없앰(朋亡) → 中行을 숭상. 得中 신하가 六五君과 응해 큰 도량.",2],["평탄함도 기울고 감도 돌아옴(泰의 전환점) — 어려움 속 바름 지키면(艱貞) 无咎. 3효=통함이 기울기 시작하는 자리, 미리 경계.",3],["훨훨 내려옴(翩翩) — 상괘 음들이 아래 양들과 사귀려 내려옴. 부 없이도 이웃과, 경계 없이 믿음으로. 泰의 사귐. 乘剛(九三 올라탐)이나 順.",2],["제을이 누이를 시집보냄 — 존귀한 六五(君)가 아래 九二(현신)에 낮춰 응(下嫁) → 복(祉) → 元吉. 得中+겸손의 결합. 坤 六五(黃裳)와 통하는 유중의 미덕.",3],["성이 무너져 해자로(城復于隍) — 泰의 극에서 통함이 다해 否로 기욺. 군사 쓰지 말고 스스로 다스려도 吝. 上효 극=泰極否來.",3]],"12":[["띠풀 뿌리째 무리와 함께 — 막힌 때(否)엔 뜻 같은 이와 물러나 바름 지키면(貞) 길·형통. 泰 초구(征吉=나아감)와 글자 같은데 처방 반대(貞=지킴).",3],["감싸 받듦(包承) — 소인은 순응해 길, 대인은 막힘 속 절개 지켜 형통(大人否亨). 주효 — 中正이 정응 九五에 응하나 否의 때라 대인은 굽히지 않음.",3],["부끄러움을 품음(包羞) — 不正不中, 막힌 때에 소인이 부끄러운 짓을 안고 있음. 象: 位不當也. 承(九四 받듦).",2],["천명이 있어(有命) 无咎, 무리가 복에 걸림(疇離祉) — 否가 기울기 시작, 九四(대신)가 명받아 막힘을 풀기 시작.",2],["막힘을 그치게 함(休否), 대인이 길. '망할까 망할까'(其亡其亡) 경계하며 뽕나무 뿌리에 매듯 튼튼히(繫于苞桑). 中正君이 否를 돌림.",3],["막힘을 기울여 엎음(傾否) — 먼저는 막혔으나 나중엔 기쁨(先否後喜). 上효 극=否極泰來. 막힘의 극이 반전. (泰 上六 城復于隍와 대칭).",3]],"13":[["문에서 널리 남과 함께함(于門) — 사사로움 없이 → 无咎. 得位, 공평한 사귐의 시작.",2],["종족(宗)끼리만 함께함 → 좁아 吝. 中正에 정응 九五 있으나 편협하게 끼리끼리라 인색. 大同 아닌 小同. 乘剛(初九).",3],["군사 매복해 六二를 두고 九五와 다투려 하나 삼 년 못 일어남(力不及). 過剛이 남의 짝(六二는 九五의 정응)을 넘봄. 3효 부중.",3],["담에 올라 六二를 넘보나 공격 못 함(弗克攻) → 돌이켜 의로 돌아오니 吉. 九三처럼 다투려다 이길 수 없음을 알고 그침.",2],["六二(정응)와의 사이를 九三·九四가 막아, 먼저 울고 뒤에 웃음(先號咷後笑) — 큰 군대로 이겨야 만남(大師克相遇). 中正君과 中正신하의 응이 우여곡절 끝에 성사.",3],["들(郊)에서 남과 함께함 — 극에서 벗어난 곳이라 뜻 같은 이 만나기 어려우나, 사심 없어 无悔. 大同의 뜻 못 이룸이나 후회는 없음.",2]],"14":[["해로운 사귐 없음(无交害), 어렵게 여기면(艱) 无咎. 大有의 시작 — 부에 교만치 않게 삼감.",2],["큰 수레로 실음(大車以載) — 得中의 강건이 무거운 임무를 감당, 나아가도 无咎. 六五(君)에 응해 큰 것을 실어 나름.",3],["공(公)이 천자께 바침(亨于天子) — 大有를 공적으로 바침. 소인은 감당 못 함(弗克). 3효 강정이나 그릇에 따라 갈림.",2],["그 성함을 드러내지 않음(匪其彭) → 无咎. 임금(六五) 곁에서 지나친 성세를 삼감 = 4효 근신.",2],["믿음으로 사귀고(交如) 위엄 있으니(威如) → 吉. 음유가 君位에서 뭇 양을 믿음으로 거느리되, 지나친 유순은 업신여겨지니 위엄도 필요. 大有 주효. 承(上九).",3],["하늘이 도움(自天祐之) → 吉无不利. 上효인데 극이 흉 아니라, 六五(君)를 겸손히 받들어(履信思順) 하늘도 도움. 大有의 완성 — 上효 최길.",3]],"15":[["겸손하고 겸손한 군자(謙謙) → 큰 내 건너도 吉. 낮은 자리에서 지극히 겸손. 謙 六爻皆吉(여섯 효 모두 길한 유일 괘)의 하나.",3],["겸손이 자연히 드러남(鳴謙), 中正이라 貞吉. 안에서 우러난 겸손. 承(九三 받듦). 謙 六爻皆吉.",3],["공로 있어도 겸손(勞謙), 군자 有終 → 吉. 유일 양효=謙의 주효, 공 세우고도 낮춤 → 萬民服. 謙 六爻皆吉의 핵.",3],["이롭지 않음 없이(无不利) 겸손을 발휘(撝謙). 得位한 유순이 아래 勞謙 九三을 받들며 겸손 베풂. 乘剛이나 謙이라 无不利. 六爻皆吉.",2],["부 없이도 이웃과 함께(不富以其鄰), 겸손하되 불복은 마땅히 침(利用侵伐) → 无不利. 겸손한 임금이나 나약함 아님. 六爻皆吉.",2],["겸손이 드러남(鳴謙), 군사로 자기 고을을 바로잡음(征邑國) — 겸손의 극에서도 자기 다스림엔 단호. 뜻 못 편 아쉬움이나 안을 다스림. 六爻皆吉.",2]],"16":[["즐거움을 떠벌림(鳴豫) → 凶. 아래에서 정응 九四(권세)를 믿고 방자히 즐김. 象: 志窮凶也.",3],["절개가 돌처럼 굳어(介于石) 하루도 안 기다려 기미를 앎(不終日) → 貞吉. 中正이 즐거움에 안 빠지고 홀로 절도. 應에 안 기대는 자립.",3],["위(九四)를 쳐다보며 아첨해 즐김(盱豫) → 悔, 늦으면 더 후회(遲有悔). 不正不中이 권세에 아첨. 承(九四).",3],["즐거움이 말미암는 주체(由豫) — 유일 양효, 뭇 음이 따름. 크게 얻고(大有得), 의심 말면 벗이 모임(朋盍簪). 豫의 주효.",3],["바르되 병듦(貞疾), 늘 앓으나 죽지 않음(恒不死). 음유 君位가 아래 九四(권신)에 눌려(乘剛) 실권 없이 병약하나 자리는 유지. 得中이 死를 면케 함.",3],["어두운 즐거움(冥豫=탐닉의 극), 이루어졌어도 고치면(成有渝) 无咎. 上효 극=즐거움의 과잉, 뉘우쳐 고치면 면함.",2]],"17":[["주관이 바뀜(官有渝), 바르면 吉. 문 나가 사귀면 공(出門交有功) — 사사로움 벗고 널리 따름. 得位.",2],["가까운 소자(初九)에 매여 장부(九五=정응)를 잃음. 中正이나 가까운 것(乘剛 初九)에 끌려 바른 짝을 놓침. 둘 다 못 가짐의 경계.",3],["장부(九四=위)에 매여 소자(初九)를 잃음. 구하면 얻으나(隨有求得) 머물러 바름 지킴이 이로움(利居貞). 六二와 반대로 위(承)를 따름.",2],["따름에 인심을 얻음(隨有獲) — 신하가 인망을 얻으면 바르되 흉(貞凶, 임금 의심). 그러나 믿음이 도에 있고 밝으면 허물없음. 4효 근군의 위태(權臣).",3],["아름다움에 믿음을 둠(孚于嘉) → 吉. 中正君이 정응 六二(中正)를 믿음으로 따르게 함. 隨의 이상.",3],["붙잡아 매고 얽어맴(拘係·維之) — 따름의 극, 지극히 굳게 매임. 왕이 서산에 제사(王用亨于西山) — 정성으로 신을 따름. 隨의 극=지성의 결속. 乘剛(九五).",2]],"18":[["아버지의 폐단을 맡아 바로잡음(幹父之蠱), 아들 덕에 아비 허물없음(考无咎). 위태로우나 終吉. 承(九二).",2],["어머니의 일을 바로잡음(幹母之蠱), 지나치게 곧게(貞) 밀면 안 됨 — 유순히. 得中으로 六五(母·君)에 응해 부드럽게 교정.",3],["아비의 일 바로잡음, 過剛으로 약간 후회(小有悔) 있으나 큰 허물 없음(无大咎). 3효 강함이 지나쳐 거칠어도 바로잡음 자체는 옳음.",2],["아비의 일을 느슨히 미룸(裕=관대히 방치) → 가면 인색(往見吝). 유약이 폐단을 방치. 乘剛(九三).",3],["아비의 일 바로잡아 명예를 얻음(用譽). 음유 君位가 아래 九二(강중 현신)에 응해 덕으로 폐단을 고침 → 칭송. 得中. 承(上九).",3],["왕후를 섬기지 않고(不事王侯) 자기 일을 높임(高尚其事) — 蠱의 극, 세상 밖에서 뜻을 높임. 上효=無位의 은자, 폐단 다스림에서 물러나 지조를 지킴.",2]],"19":[["느낌으로 임함(咸臨), 바르면 吉. 得位한 양이 정응 六四에 감응해 다가감. 두 양이 자라 위로 임하는 시작.",2],["느낌으로 임함(咸臨), 得中으로 六五(君)에 응 → 吉无不利. 강중이 임하니 거침이 없음.",3],["달콤하게(아첨) 임함(甘臨) → 无攸利. 이미 근심하면(既憂之) 无咎. 不正不中+乘剛(九二)이 감언으로 임하나 뉘우치면 면함.",3],["지극히 임함(至臨) → 无咎. 得位한 유순이 아래 初九(정응·양강)에 지성으로 임함. 位當也.",2],["지혜로 임함(知臨), 대군의 마땅함(大君之宜) → 吉. 음유 君位가 아래 九二(강중)에 응해 지혜롭게 위임. 得中.",3],["도탑게 임함(敦臨) → 吉无咎. 坤의 극, 유순의 극이 두터운 덕으로 임함. 上효인데 극이 흉 아니라 敦厚.",2]],"20":[["어린아이처럼 얕게 봄(童觀) — 소인은 无咎(당연), 군자는 부끄러움(吝). 맨 아래라 멀어 얕게 봄.",2],["문틈으로 엿봄(闚觀) — 여자의 바름엔 이로우나 대장부엔 부끄러움(醜). 中正이나 안에서 좁게 엿봄.",3],["내 행실을 살펴 거취를 정함(觀我生, 進退). 자기 처신을 성찰해 나아감·물러남 판단. 未失道也.",2],["나라의 빛을 봄(觀國之光=盛德을 우러름), 왕의 손님 됨이 이로움(利用賓于王) — 임금(九五) 가장 가까이서 그 덕 보고 벼슬. 承(九五).",3],["내 다스림을 살핌(觀我生), 군자면 无咎 — 임금이 자기 덕을 성찰해 백성을 봄(觀民). 觀의 주효, 위에서 모범을 보임.",3],["남이 나를 봄을 살핌(觀其生), 군자면 无咎 — 지위 밖에서도 뭇 사람이 우러르니 처신을 삼감. 志未平也.",2]],"21":[["발에 차꼬 채워 발꿈치 상함(屨校滅趾) — 가벼운 형벌로 초범을 경계 → 无咎. 작은 벌로 큰 악을 막음. 上九(극형)와 대조.",2],["부드러운 살을 씹다 코가 빠짐(噬膚滅鼻) — 쉬운 대상이나 깊이 벌함. 中正이나 乘剛(初九)이라 다소 깊이. 无咎.",3],["마른 고기를 씹다 독을 만남(噬腊肉遇毒) — 완악한 것을 다스리다 저항(독). 약간 부끄러우나(小吝) 无咎. 承(九四).",2],["뼈 붙은 마른 고기 씹어 쇠화살 얻음(得金矢=강직) — 강경한 것을 강단으로 다스림. 어렵되 바르면 吉. 噬嗑의 주효, 강한 집행.",3],["마른 고기 씹어 황금 얻음(得黃金=中의 덕) — 得中 君이 형벌을 中으로 집행. 위태롭게 여기면(貞厲) 无咎. 承(上九).",3],["목에 큰 칼을 써 귀를 없앰(何校滅耳) → 凶. 上효 극 = 악이 쌓여 극에 달해 큰 형벌. 初九(작은 벌)와 대조: 안 고쳐 극형. 聰不明也.",3]],"22":[["발을 꾸밈(賁其趾), 수레 버리고 걸음(舍車而徒) — 분수에 안 맞는 것을 마다하고 소박히 걸음. 義弗乘也 = 의로써 꾸밈.",2],["수염을 꾸밈(賁其須) — 수염은 턱(九三)을 따라 움직임, 스스로 못 서고 위(九三)와 함께 흥함(與上興也). 承(九三).",2],["꾸미고 윤택함(賁如濡如), 永貞吉. 두 음(六二·六四) 사이의 양이 문채로 빛나나, 안일에 빠지지 말고 바름 지켜야.",2],["꾸밈이 희고(皤如=소박) 흰 말이 나는 듯 — 정응 初九에게 가려 하나 九三이 막음, 도적 아닌 혼인 상대(匪寇婚媾). 꾸밈이 소박으로 돌아감. 乘剛(九三).",3],["언덕 동산을 꾸밈(賁于丘園=검소한 곳), 묶은 비단 적음(束帛戔戔) → 인색해 보이나(吝) 終吉. 得中 君이 화려함 버리고 검소로 → 有喜. 承(上九).",3],["흰 꾸밈(白賁=꾸밈을 덜어 본바탕으로) → 无咎. 賁의 극에서 문식이 다해 소박(素)으로 돌아감 = 꾸밈의 최고는 꾸밈 없음. 得志也.",3]],"23":[["평상을 다리부터 깎음(剝床以足) — 깎임이 아래서 시작. 바름을 멸함(蔑貞) → 凶. 소인이 아래서부터 정도를 갉음.",3],["평상을 상판 받침까지 깎음(剝床以辨) — 깎임이 올라옴. 바름 멸함 → 凶. 中正이나 홀로 응원 없이 깎임에 휩쓸림.",2],["깎되 허물없음(剝之无咎) — 뭇 음 속에서 홀로 정응 上九(양)를 따라 소인 무리를 떠나 군자에 붙음 → 无咎. 失上下也(무리를 잃음)이나 옳음.",3],["평상을 깎아 살갗에 닿음(剝床以膚) — 깎임이 몸에 닿음, 절박한 위기 → 凶. 재앙이 임박(切近災也).",2],["물고기 꿰듯(貫魚) 뭇 음(궁인)을 거느려 총애 받음(以宮人寵) → 无不利. 뭇 음의 우두머리(六五)가 위 上九(양·군자)에 순종해 이끎. 承(上九). 終无尤也.",3],["큰 열매 하나 안 먹힘(碩果不食=씨앗) — 剝의 극, 유일 양. 군자는 수레 얻어(得輿, 民所載) 재기, 소인은 제 집마저 깎아(剝廬, 終不可用) 자멸. 剝→復(一陽來復)의 씨앗. 물극필반.",3]],"24":[["멀리 안 가서 돌아옴(不遠復) — 잘못을 곧 뉘우쳐 큰 후회에 이르지 않음(无祗悔) → 元吉. 一陽來復의 주효, 회복의 시작. 顏回의 不貳過에 비유.",3],["아름답게 돌아옴(休復) → 吉. 中正이 아래 初九(仁)에 낮춰 따름(以下仁也). 乘剛이나 어진 양(회복의 씨앗)이라 오히려 吉.",3],["자주 잘못했다 돌아옴(頻復) — 여러 번 실수하고 뉘우침. 위태로우나(厲) 뉘우치니 无咎. 不正不中의 잦은 반복.",2],["무리 가운데서 홀로 돌아옴(中行獨復) — 뭇 음 속에서 홀로 정응 初九(陽)를 따라 도로 돌아옴. 도를 따름(以從道也).",3],["도탑게 돌아옴(敦復) → 无悔. 得中 君이 두터운 덕으로 스스로 돌이켜 살핌(中以自考也).",2],["미혹되어 못 돌아옴(迷復) → 凶, 재앙(災眚). 군사 쓰면 대패, 나라 임금까지 흉, 십 년 못 침. 復의 극에서 끝내 돌이키지 못한 극흉. 反君道也.",3]],"25":[["거짓 없이(无妄) 나아가면 吉(往吉). 得位한 양이 진실하게 첫발 → 得志. 震(動)의 주효.",2],["공을 미리 도모하지 않음(不耕獲) — 사심 없이 자연스러움. 그러면 나아감이 이로움. 中正이 무망의 도를 지킴. 乘剛(初九).",3],["잘못 없이 당하는 뜻밖의 화(无妄之災) — 남이 훔친 소로 고을 사람이 억울하게 의심받음. 不正이라 예기치 못한 災. 承(九四).",3],["곧게 지킬 수 있으면(可貞) 无咎. 강건이 부정위이나 굳게 바름 지키면 허물없음. 固有之也.",2],["진실무망한데 생긴 병(无妄之疾)은 억지로 손대지 않아도 자연히 나음(勿藥有喜). 中正君의 자연치유 — 함부로 손대지 말라.",3],["무망의 극에서 더 나아가면 재앙(行有眚), 이로울 바 없다. 극에서 멈춰야 함. 窮之災也.",3]],"26":[["위태로움 있으니(有厲) 그침이 이롭다(利已). 힘이 어릴 땐 나아가지 말고 멈춤. 六四(艮止)에 저지당함 — 무리 말 것.",2],["수레바퀴통을 벗겨 스스로 멈춤(輿說輹) — 자발적 자제. 得中이라 억지 아닌 그침, 허물없음. 中無尤也.",3],["이제 달려도 되나(良馬逐) 어렵되 바름이 이롭고(利艱貞) 날마다 익혀야(閑輿衛). 절제 속의 전진 — 上九와 뜻이 합해 함께 나아감.",2],["소가 어릴 때(뿔 나기 전) 뿔막이를 댐(童牛之牿) — 쉬울 때·근원에서 유순히 저지 → 元吉. 有喜. 得位한 유순의 지혜. 乘剛(九三).",3],["멧돼지를 거세해 어금니를 무력화(豶豕之牙) — 강한 것(九二)을 근원에서 다스림 → 吉. 得中君이 應으로 九二를 제어. 有慶. 承(上九).",3],["하늘의 큰 길(何天之衢) → 亨. 大畜의 극에서 축적이 완성되어 터짐 = 절제된 축적이 큰 형통으로 전환(道大行也). 上효인데 극이 흉 아니라 大通.",3]],"27":[["陽으로 자족(靈龜)의 힘이 있으나 위 六四(정응)를 부러워해 밖을 탐함. 자리는 正이나 자족을 버려 凶.",3],["中正이나 應 없어(六五도 음) 자양의 짝 못 만남. 아래(初)·언덕(上)에 구하려다 정도 어김(拂經). ※顛頤·丘 해석 전통마다 이견 → 주석 갈림.",2],["震動의 극에서 頤의 도를 정면 거스름(拂頤). 부정·부중·동극. 應(上九) 있어도 탐욕·부정이라 못 받음. 최강 부정 — 모범 사례.",3],["정위+정응(初九). 높은 자리이나 못 기르니 아래 유능한 初九에 겸손히 구함(위엄·성의). 六二(凶)와 차이 = 應(정응) 유무 = 應의 위력 교과서.",3],["君位이나 음유해 못 기름(拂經). 得中 + 위 上九(현자)를 承하여 居貞吉. 큰일(涉大川)은 불가. 得中이 흉 면하게 함.",3],["艮止의 극, 양강 현자=만민 기르는 근원(由頤). 六五 君이 기댐. 위태롭게 삼가면(厲) 吉, 大事도 감당. ※不正인데 吉 = '頤엔 상하 양이 주체' 괘상 특례.",2]],"28":[["지나침(大過)의 시작. 음유하나 흰 띠풀 깔듯 지극히 삼가 조심하니 无咎. 정응(九四) 있어 기댈 곳. 承(九二 받듦).",3],["강중(得中). 위 九五와 敵應이라 안 통하고, 아래 初六(음)과 比로 활로 — 마른 버들 새싹처럼 생기. 敵應을 得中+比로 풀어 无不利.",2],["過剛(양3, 강함 지나침)+不中. 大過의 과함이 정점 → 들보가 휨(棟橈) → 凶. 자리는 正이나 지나쳐 무너짐 = 過猶不及. 九四(吉)와 정반대.",3],["양이 음자리(4)라 강함이 누그러져 들보가 버팀(棟隆) → 吉. 단 아래 初六(정응)에 얽매이면(有它) 吝. 九三(凶)과 대조 — 같은 들보인데 剛柔 조절로 갈림.",2],["中正이나 大過의 끝자락. 위 上六(음·늙음)과 比 → 마른 버들 꽃처럼 잠깐 화려하나 열매 없음 → 无咎无譽. 敵應(九二)이라 아래 도움 없음. 九二(생稊)와 대칭.",2],["大過의 극(上효). 음유가 지나침의 끝에서 무리하게 건너다 이마까지 빠짐(過涉滅頂) → 凶. 하지만 의를 위한 무리라 탓할 순 없어 无咎. 乘剛(九五 올라탐).",3]],"29":[["坎이 겹친 괘의 맨 밑. 아래도 험(下坎), 위도 험(上坎)이라 빠져나갈 방향 자체가 없다. 初는 자리가 낮아 힘이 없는데 음유까지 겹쳐 험을 뚫을 기운이 없고, 應인 六四도 같은 음이라 끌어줄 손이 없다(無應). 그래서 험에 빠지는 데서 그치지 않고 窞(구덩이 안의 더 깊은 구멍)까지 들어간다. 力·位·應이 셋 다 없는 자리가 그대로 凶으로 나온 전형.",3],["양강이 下坎의 한가운데. 자리는 不正이지만 得中이라 험 속에서도 중심을 잃지 않는다. 다만 위의 九五도 양이라 敵應 — 밖에서 끌어올려 줄 힘이 없으니 크게는 못 얻고 小得에 그친다. 험 중에 中을 얻으면 살아남기는 하되 벗어나지는 못한다는, 坎괘 특유의 절제된 판단. 판정어를 아예 달지 않은 것도 吉도 凶도 아닌 중간 상태를 그대로 두려는 것.",3],["三은 下坎의 끝이자 上坎의 문턱 — 물러나도 坎, 나아가도 坎이라 來之坎坎. 음유가 부중부정한 데다 아래로 九二 양을 올라타(乘剛) 발밑이 불안하고, 應인 上六도 음이라 기댈 데가 없다. 그래서 길흉을 매기는 대신 아예 勿用이라는 행위 금지로 끝난다 — 판정할 국면이 아니라 움직이면 안 되는 국면이라는 뜻.",3],["험이 한창인 때에 신하가 임금을 섬기는 자리. 음이 음자리라 正하고 바로 위 九五를 承하니 위아래 명분이 맞다. 應이 없어 밖의 도움은 없지만, 예물을 최소로 줄이고(樽酒簋貳·用缶) 정문 아닌 들창으로 들일 만큼 형식을 낮춰 진심만 통하게 한다. 그래서 험 중에도 終无咎. 검소함이 예를 어기는 것이 아니라 때에 맞는 예가 되는 대목인데, 器物 이미지는 象보다 주석 해석에 기대는 편.",2],["中正한 양강이 上坎의 한가운데 — 坎괘에서 험을 다스릴 유일한 자리. 물이 구덩이를 넘칠 만큼 차지 않았다(坎不盈)는 것은 험이 아직 다 지나지 않았다는 뜻이고, 수면이 이미 평평하다(既平)는 것은 中의 힘으로 균형을 잡았다는 뜻. 九二가 敵應이라 함께 험을 건널 신하가 없으니 吉까지는 못 가고 无咎에서 멈춘다 — 中正한 임금인데도 吉이 아닌 이유가 정확히 여기 있다.",3],["험의 끝까지 간 자리. 자리는 正하지만 음유가 험의 극에 있고 九五를 올라타(乘剛) 위아래가 다 어긋나며 應도 없다. 그래서 형틀에 묶여 가시덤불(叢棘, 옛 감옥의 상)에 놓이고 三歲不得. 坎의 물이 갇혀 흐르지 못하는 상이 그대로 형벌 이미지로 번역됐다. 初六의 凶이 '빠짐'이라면 上六의 凶은 '갇힘' — 같은 흉이라도 시작과 끝의 결이 다르다.",3]],"30":[["밝음이 처음 붙는 자리. 양이 양자리라 正하고 기운이 섣부른데, 離는 불이라 시작부터 활활 타기 쉽다. 발밑이 아직 정돈되지 않았는데(履錯然) 서두르면 어긋나므로 敬 한 글자로 눌러야 无咎. 應인 九四도 양이라 敵應 — 밖에서 잡아줄 이가 없으니 스스로 삼가는 수밖에 없다는 데서 敬이 나온다.",2],["64괘 통틀어 元吉이 붙은 드문 자리. 음이 음자리에 있고 得中까지 해 中正인데, 黃은 오행 土의 색이자 中央의 색이라 효위(中)와 색깔(黃)이 정확히 겹친다. 밝음이 中을 얻으면 눈부시지 않고 은은해진다는 것이 黃離의 뜻. 應이 없는데도 元吉인 것은 中正 그 자체가 충분한 근거라는 뜻.",3],["三은 下離의 끝 — 한 불이 다 타고 다음 불로 넘어가는 경계라 日昃(해가 기욺). 자리는 正하나 中을 잃었고 上九와 敵應이라 이어받을 데가 없다. 마치는 때를 노래로 받아들이면 넘어가고, 붙들려 탄식하면 凶. 해가 기우는 象이 그대로 노년을 대하는 태도 문제로 번역된 자리.",3],["下離의 불이 꺼지자마자 上離의 불이 새로 붙는 자리 — 이어짐이 아니라 突如한 침입이다. 양이 음자리라 不正하고 中도 없으며 初九와 敵應이라 근거가 하나도 없는데, 바로 위 六五를 태울 기세로 치받으니 焚·死·棄가 줄줄이 나온다. 판정어를 안 붙이고 네 개의 如만 늘어놓은 것 자체가 판정 이전의 참상 묘사 — 좋고 나쁨을 따질 겨를이 없다는 뜻.",3],["음이 양자리라 不正이고, 아래로는 九四의 사나운 불에 핍박당하고 위로는 上九 강강에 눌린 임금 자리. 그런데도 吉인 이유는 오직 得中 — 제 처지의 위태로움을 알아 울고 탄식할 줄 알기 때문이다. 離는 눈(目)의 상이라 눈물이 나오는 것도 괘상과 맞물린다. 슬퍼할 줄 아는 것이 살길이 되는, 易에서 드문 판정.",3],["밝음이 극에 이른 자리 — 極이면 대개 흉한데 離의 極은 '다 밝게 비춰 분별할 수 있음'이 된다. 그래서 우두머리만 베고 부화뇌동한 무리는 놓아준다(獲匪其醜). 강한 양이 자리는 不正이라 사나움으로 흐를 수 있는데, 칠 대상을 가리는 것으로 그 위험을 상쇄해 无咎에서 멈춘다. 밝음의 쓸모는 태우는 데가 아니라 가려내는 데 있다는 결론.",2]],"31":[["咸은 사람 몸을 아래에서 위로 훑으며 감응의 깊이를 재는 괘. 初는 발끝이라 느낌이 가장 얇다. 九四와 정응이라 감응 자체는 있으나, 음유가 맨 아래에서 자리도 不正하니 마음만 동하고 몸은 아직 못 움직인다. 그래서 길흉을 아예 달지 않았다 — 아직 행동이 아니라 판정할 것이 없다.",3],["中正에 九五와 정응 — 조건은 최상급인데 凶이 먼저 나온다. 장딴지는 제 뜻으로 못 움직이고 발을 따라 들썩이는 부위라, 느낌이 오면 먼저 튀어나가는 성급함의 상이기 때문. 中正한 이가 조건만 믿고 먼저 나서면 凶, 제자리 지키고 五가 오기를 기다리면 吉. 한 효에 凶·吉이 함께 붙어, 자리가 좋아도 때를 어기면 소용없음을 보여준다.",3],["넓적다리는 스스로 방향을 정하지 못하고 아래 두 효(初·二)의 움직임을 따라가는 부위. 九三은 下艮의 끝 — 艮은 그침인데 그치지 못하고 따라나선다. 上六과 정응이라 위에서 끌리는 힘까지 있으니 더 못 참는다. 흉까지는 아니고 제 주장 없이 남 따라간 부끄러움(吝)으로 낮게 매겨진 것이 정확하다.",3],["咸괘의 심장 — 四는 心의 자리다. 양이 음자리라 不正해 본래 悔가 있을 자리인데, 곧게 지키면 그 悔가 사라진다고 조건을 달았다(悔亡은 판정어가 아니라 조건문의 결과). 憧憧往來는 사사로운 계산으로 마음이 오락가락하는 것 — 그러면 감응이 두루 미치지 못하고 뜻 맞는 몇몇(朋)만 모인다. 넓히려 애쓸수록 좁아진다는 역설이 여기서 나온다.",3],["脢는 등의 심장 반대편 살 — 보이지도 않고 스스로도 잘 못 느끼는 부위다. 中正에 六二와 정응까지 갖춘 최상 조건인데 감응은 오히려 가장 무덤덤하다. 임금은 사사로운 느낌으로 흔들려서는 안 되므로 진폭을 죽이는 것이 옳고, 그래서 吉이 아니라 无悔에 그친다. 九四의 憧憧과 짝을 이루는 반대편 극 — 너무 흔들려도, 아예 안 느껴도 咸의 완성은 아니다.",3],["몸을 다 훑고 올라와 마지막이 입 — 말이다. 자리는 正하고 九三과 정응이지만 上兌(입·말)의 끝이라 감응이 실질을 잃고 말로만 남는다. 九五를 올라탄(乘剛) 것도 알맹이 없이 앞서는 모양. 판정어를 달지 않은 것은 初六과 같은 이유가 아니다 — 初六은 아직 아니라서, 上六은 이미 말뿐이라서 따질 알맹이가 없는 것.",3]],"32":[["恒은 오래감의 도인데, 시작하자마자 끝까지 파고들려는(浚) 것이 初六의 잘못. 巽은 들어감이라 성질부터 파고드는데, 음유가 맨 밑에서 자리도 不正하니 그 깊이를 감당할 그릇이 아니다. 九四와 정응이라 믿는 구석이 있어 더 무리하는데, 그 호응만 믿고 처음부터 깊이를 요구하니 곧게 해도 凶. 恒은 처음부터 깊은 것이 아니라 오래해서 깊어지는 것이라는 반증.",3],["양이 음자리라 不正 — 본래 悔가 있어야 할 자리인데 得中 하나로 그것이 지워진다. 게다가 六五와 정응이라 위아래가 통한다. 효사가 두 글자뿐인 것이 오히려 논리를 선명하게 보여준다 — 恒괘에서 오래 갈 수 있게 하는 것은 자리의 옳음이 아니라 中을 잃지 않는 것이다.",3],["자리는 正한데 中이 없고, 아래 巽의 끝에서 위 震(움직임)으로 넘어가려는 참이라 마음이 들뜬다. 上六과 정응이라 위로 끌리는 힘까지 있으니 제자리를 못 지킨다. 恒괘에서 가장 恒하지 못한 자리 — 正하다는 것만으로는 오래가지 못한다는, 九二와 정확히 대칭인 교훈. 論語가 이 구절을 인용한 것도 이 지점이다.",3],["양강이 음자리에 있어 不正하고 中도 없다 — 오래 머물러 있으나 있을 자리가 아니다. 初六과 정응이라 아래로 호응은 있지만 初六 자체가 浚恒으로 무너진 효라 얻을 것이 없다. 잘못된 자리에서는 아무리 오래 버텨도 소득이 없다는 것을, 사냥터에 짐승이 없다는 한 장면으로 끝냈다. 恒이 무조건 미덕은 아니라는 경고.",2],["음유가 임금 자리에 있어 不正하지만 得中했고 九二와 정응이라 하나를 좇아 오래 지킨다. 한 사람을 따라 변치 않는 것은 순종의 도리로는 吉이지만, 만사를 마름질해야 할 자리(五·夫子)에서는 하나만 붙들고 있는 것이 오히려 凶. 같은 恒·같은 貞인데 누가 하느냐에 따라 길흉이 갈리는, 판정이 주체에 따라 나뉘어진 드문 효.",3],["위 震의 끝 — 震은 움직임인데 그 극에 있으니 진동만 남는다. 자리는 正하고 九三과 정응이지만 음유가 恒의 끝과 動의 끝을 겹쳐 잠시도 가만있지 못한다. 恒괘의 마지막이 恒의 정반대인 振으로 끝나는 것은, 오래 감이 '안 움직임'이 아니라 '일정함'이어야 한다는 뜻. 흔들림을 恒으로 착각하면 凶.",3]],"33":[["遯은 물러남의 괘인데 初는 맨 뒤라 달아나는 행렬의 꼬리(尾)가 된다. 물러날 때 가장 늦게 빠지면 가장 먼저 잡힌다. 음유가 자리도 不正하여 물러날 힘도 모자란다. 九四와 정응이라 불러줄 손은 있으나, 이미 늦은 마당에 움직이면 더 드러나므로 勿用有攸往 — 가만히 있는 것이 달아나는 것보다 나은 드문 국면.",3],["中正한 음이 九五와 정응 — 遯괘에서 유일하게 물러나지 않고 붙잡는 자리다. 黃은 土·中의 색이고 소가죽은 질기고 유순한 것이니, 강제로 잡는 게 아니라 中의 힘으로 묶는다는 뜻. 길흉을 달지 않은 것은, 물러남이 옳은 때에 홀로 붙잡는 것이라 뒤에 올 일로 판단이 갈리기 때문이다.",3],["아래 艮의 끝에서 위 乾으로 넘어가는 자리인데, 바로 아래 두 음효(初·二)가 매달려 몸이 묶인다(係遯). 上九와 敵應이라 밖에서 끌어줄 힘도 없다. 얽혀 못 떠나는 것이 병이자 위태로움(有疾厲). 다만 종·첩을 거느리는 정도의 작은 일에는 그 얽힘이 도리어 쓸모가 된다 — 큰 일엔 厲, 작은 일엔 吉이라는 그릇 크기의 문제.",3],["初六과 정응 — 끌리는 정이 분명히 있는데도 떠나는 자리라 好遯(좋아하면서 물러남). 九三의 係遯과 정확히 대조된다 — 둘 다 아래 음과 얽혀 있으나 하나는 못 끊고 하나는 끊는다. 그 차이가 그대로 군자와 소인의 갈림이라, 같은 상황에서 판정을 사람에 따라 나눈 효. 자리가 不正인데도 吉인 것은 끊는 결단이 자리의 허물을 덮기 때문이다.",3],["中正한 양이 六二와 정응 — 물러남의 모범이라 嘉(아름다움)자가 붙었다. 끌려서 못 가는 것도 아니고 미련 없이 가는 것도 아니며, 때를 알아 제발로 물러난다. 다만 그냥 吉이 아니라 貞吉인 것은, 물러남에도 곧음이 있어야 아름답다는 조건 — 도망과 은퇴를 갈라 놓는 한 글자.",3],["遯괘에서는 위로 갈수록 좋아진다 — 아래 음의 기운에서 멀수록 얽힌 것이 적기 때문. 上九는 가장 멀고 九三과 敵應이라 아래와 묶일 줄이 하나도 없으니 肥(살짐·여유로움)이다. 敵應이 오히려 장점으로 뒤집히는 드문 사례.",3]],"34":[["힘이 발끝에 몰린 자리. 양이 양자리라 正하고 기운도 사나운데, 정작 자리는 맨 아래라 가장 낮다 — 힘과 지위가 어긋난다. 九四와 敵應이라 받아줄 곳도 없는데 발부터 나가니 征凶. 有孚는 위로가 아니라 경고다 — 믿는 구석이 있으니 더 쉽게 나서고, 그 믿음이 바로 흉의 원인이 된다.",3],["양이 음자리라 不正인데, 大壯괘에서는 그게 오히려 다행이다 — 사나운 때에 한 급 숙이고 들어가 있는 꼴이 되기 때문. 게다가 得中했고 六五와 정응이라 위에서 받아준다. 효사가 두 글자뿐인 것이 그 자체로 답이다 — 강함을 드러낼 일이 없으니 설명할 장면도 없다. 大壯 여섯 효 중 유일하게 갈등 장면이 안 나오는 자리.",3],["아래 乾의 끝 — 세 양이 쌓인 꼭대기라 힘이 가장 넘치는 자리다. 자리는 正하나 中이 없어 절제가 안 된다. 같은 힘을 소인은 휘둘러 쓰고 군자는 없는 것처럼 둔다는 대비가 이 효의 핵심. 上六과 정응이라 위로 받으려 달려드는데, 그 상대가 음유한 울타리라 뿔만 걸린다. 大壯 전체를 관통하는 숫양 이미지가 여기서 처음 나온다.",3],["네 양이 다 자라 위 음 둘과 맞닿는 경계 — 九三이 뿔을 박았던 울타리가 여기서는 터진다(藩決). 양이 음자리라 不正인 것이 오히려 강함을 눅여, 뿔로 받지 않고 수레를 밀고 나간다. 뿔(角)에서 바퀴통(輹)으로 이미지가 바뀌는 것이 결정적 — 받아버리는 힘에서 실어 나르는 힘으로 바뀌어야 大壯이 쓸모가 된다.",3],["음유가 임금 자리에 있어 不正이고 아래로 네 양을 올라타(乘剛) 버거운 자리다. 그런데 양을 잃었는데도 허물이 없다 — 유순함으로 아래의 강함을 맞받지 않고 물러서줌으로써 다툼을 없앤다는 뜻. 易를 지경(疆場)으로 볼지 쉬운 것(易)으로 볼지는 예로부터 갈리는데, 어느 쪽이든 得中한 음이 힘을 놓아 화를 면하는 구조는 같다.",2],["九三이 뿔을 박았던 울타리가 여기선 자기 몸을 가둔다 — 정응인 둘이 서로를 가두는 구조다. 음유가 강함의 끝에 매달려 물러설 힘도 나아갈 힘도 없다. 그래도 마지막에 吉이 붙는 것은 艱(어려움을 어려움으로 알고 버팀)이라는 조건 때문 — 힘으로 뚫지 못할 때는 버티는 것이 힘이 된다는, 大壯 전체의 결론.",3]],"35":[["晉은 해가 땅 위로 솟아 나아가는 괘. 初는 맨 아래라 오르려 해도 밀리는 자리라 晉如摧如(나아가는 듯 꺾이는 듯). 九四와 정응이나 그 九四가 본래 부정한 효라 믿음을 얻지 못한다(罔孚). 그럴 때 서두르지 않고 너그럽게 두는 것(裕)이 허물을 없앤다. 나아감의 첫 걸음은 속도가 아니라 태도의 문제라는 것.",3],["中正한 음이나 六五와 같은 음이라 無應 — 위에 이끌어 줄 임금이 없으니 나아가면서도 근심한다(愁如). 그럼에도 吉인 것은 中正을 지키기 때문이고, 복이 임금이 아니라 王母(할머니·음의 어른)에게서 온다는 것이 정확하다 — 應으로 못 받을 바에는 같은 음의 계열에서 받는다는 뜻. 無應을 흠으로 두지 않고 다른 경로를 연 드문 효.",3],["음이 양자리라 不正하고 中도 없어 본래 悔가 있을 자리다. 그것을 지우는 것이 眾允 — 아래 坤의 세 음이 함께 올라가는 무리라, 혼자 자격으로는 모자라지만 무리의 뜻을 업고 올라간다. 上九와 정응이고 바로 위 九四를 承하니 위로 통하는 길도 열려 있다. 자격이 모자랄 때 사람들의 신임이 그 빈자리를 메운다는 구조.",3],["양이 음자리라 不正하고 中도 없는데, 아래 세 음이 다 올라오는 길목을 혼자 막고 서 있다. 들쥐는 재주는 많으나 하나도 제대로 하는 것이 없고 낮에 숨어 훔치는 짐승이니, 자리에 걸맞지 않게 올라온 자를 그대로 그려냈다. 初六과 정응이라 아래를 끌고 올라온 것인데, 밝은 離의 밑에 있어 더 잘 드러난다. 곧게 해도 厲인 것은 자리 자체가 불안하기 때문.",3],["晉괘의 주인 자리 — 밝은 離의 한가운데다. 음이 양자리라 不正이고 九四를 올라타(乘剛) 본래 悔가 있을 자리인데, 得中 하나로 지워진다. 핵심은 失得勿恤 — 임금은 이해를 따지지 않고 밝게 비추기만 하면 된다는 것. 자리가 不正이고 應도 없는데 吉인 이유는 오직 中과 밝음이다.",3],["나아감이 끝까지 가 머리 끝의 뿔에 이르렀다 — 더 갈 데가 없다는 뜻. 강한 양이 자리는 不正이라 밖으로 쓸 곳이 없고, 오직 제 집안(邑)을 단속하는 데만 쓰면 위태로울망정 허물은 없다. 한 효에 厲·吉·无咎·吝 네 점사가 다 붙은 드문 자리로, 좁은 범위에서는 간신히 통하나 큰 눈으로 보면 결국 부끄러움(吝)이라는 이중 평가다.",3]],"36":[["明夷는 밝음이 땅 밑으로 들어간 괘 — 晉을 뒤집은 종괘로, 나아감의 정반대다. 初九는 밝음의 맨 아래라 가장 먼저 위험을 알아채고 날아오른다. 다만 날개를 드리운다는 것은 능력을 접고 보잘것없이 보이며 떠난다는 뜻. 사흘 굶으면서도 가는 것이 옳지만, 보는 사람은 이해하지 못해 말을 한다(主人有言). 길흉을 달지 않은 것은 판단을 뒤에 맡긴 것이다.",3],["中正한 음이 밝은 離의 한가운데 — 明夷에서 유일하게 吉이 붙은 자리다. 상처가 넓적다리에 그친다는 것이 핵심 — 걸음은 불편해졌으나 몸통과 머리는 성하다. 그만큼 상해를 받기 전에 물러날 수 있었다는 뜻이고, 그 빠른 대처가 건장한 말(拯馬壯)로 그려졌다. 無應인데도 吉인 것은 中正이 외부 도움보다 강하기 때문.",3],["아래 離의 끝 — 밝음이 가장 강한 양이다. 上六과 정응인데, 그 上六이 바로 밝음을 가로막는 어둠의 괴수다. 남쪽(南)은 밝음의 방위라 밝음을 등지고 가서 우두머리를 얻는다. 다만 마지막에 不可疾貞을 붙인 것이 이 효의 무게 — 오래 쌓인 어두움은 단숨에 걷어낼 수 없고, 급하게 바로잡으려 들면 또 다른 화가 된다.",3],["위 坤(어둠)의 맨 아래 — 어두운 쪽에 발을 들였으나 아직 가장자리다. 음이 음자리라 正하고 初九와 정응이라 밝은 쪽과 줄이 닿아 있다. 안으로 깊이 들어가 어둠의 속을 본 다음 문을 나서는 것이 이 효의 행동 — 망설임 없이 떠나되, 떠나기 전에 상황을 다 파악하고 떠난다. 길흉을 달지 않은 것은 떠난 뒤가 아직 남았기 때문.",2],["보통 五는 임금 자리인데 明夷에서만은 上六이 어둠의 괴수라, 五는 그 바로 아래에서 버티는 종친 신하가 된다. 자리는 不正이지만 得中했기에 미친 체하면서도 속으로는 밝음을 꺼뜨리지 않는다. 初九는 떠나고 六二는 다치고 六五는 남아서 숨기는 세 가지 처신이 한 괘 안에 다 들어 있다. 利貞은 판정어가 아니라 조건이라 별도 판정을 안 달았다.",3],["다른 다섯 효가 밝음을 상해 받는 쪽이라면 上六만은 상하게 하는 쪽 — 이 효만 읽으면 괘 전체의 가해자다. 자리는 正하고 九三과 정응이지만, 어둠의 극에 있어 제 밝음까지 꺼뜨렸다(不明晦). 처음 하늘에 올랐다 땅으로 떨어진다는 것은 높이 올라간 만큼 깊게 추락한다는 뜻. 판정어가 없는 것은 추락 자체가 이미 답이기 때문이다.",3]],"37":[["閑은 문에 가로대를 지르는 것 — 집안 다스림은 처음에 경계를 세우는 데서 시작한다는 뜻. 양이 양자리라 正하고 六四와 정응이라 기반도 갖췄다. 핵심은 순서다 — 어질러진 다음 바로잡으면 이미 悔가 생기고, 처음부터 막으면 悔가 생길 일 자체가 없다. 길흉을 달지 않은 것은 아직 집이 꾸려지기 전의 준비 단계이기 때문.",3],["中正한 음이 九五와 정응 — 家人괘에서 안주인의 자리다. 无攸遂(제 뜻대로 이루는 바 없음)는 무능해서가 아니라 자리가 그러하다는 뜻 — 음은 밖으로 나서지 않고 안을 맡는 것이 본분이다. 中饋의 中은 집안이면서 동시에 得中의 中이라, 효위와 글자가 그대로 겹친다. 나서지 않는 것이 공이 되는 드문 자리.",3],["자리는 正하나 中이 없어 가장의 엄격함이 도를 넘어선다. 그래서 뉘우치고 위태로운데도 결국 吉이다 — 엄함은 과해도 집을 살리지만, 반대로 헤헤거리면 당장은 편해도 끝이 부끄러워진다. 한 효 안에 과함과 모자람을 나란히 놓고 전자를 택한 점이 핵심. 上九와 敵應이라 안에서 제어해 줄 손도 없다.",3],["음이 음자리라 正하고, 바로 위 九五를 承하며 아래 初九와 정응이라 위아래가 다 맞는 드문 자리다. 집안의 재물을 맡는 자리인데, 음유가 제자리에서 지키기만 해도 집이 쌓인다. 효사가 네 글자뿐인데 大吉이 붙은 것은, 조건이 다 맞을 때는 설명이 필요 없다는 뜻.",3],["中正한 양이 中正한 六二와 정응 — 64괘를 통틀어도 드물게 완전한 짝이다. 바깥주인과 안주인이 각자 제자리에서 제 일을 하는 구조. 假는 格(이르다)로 읽어 왕의 다스림이 집 안까지 미친다는 뜻. 근심하지 말라는 것은, 사랑으로 다스리면 억지로 단속하지 않아도 절로 잡힌다는 것 — 九三의 엄함과 대조된다.",3],["집안 다스림의 마지막 자리. 자리는 不正이고 九三과 敵應이라 구조적으로는 불리한데도 終吉인 것은, 오래 다스려 쌓인 믿음(有孚)이 위엄(威如)으로 굳었기 때문이다. 九三의 嗃嗃이 소리로 누르는 엄함이라면, 上九의 威如는 말 없이도 서는 위엄 — 같은 엄격함이라도 쌓인 시간이 다르면 판정이 달라진다.",3]],"38":[["睽는 등지고 어긋남의 괘 — 위는 불로 올라가고 아래는 물로 내려가 서로 등을 돌린다. 初九는 어긋남의 맨 아래라 아직 골이 깊지 않다. 九四와 敵應이어도 같은 양끼리라 끝에는 만난다 — 그래서 잃은 말을 쫓지 말라고 한다. 어긋날 때의 첫 원칙은 맞붙지 않고 기다리는 것이며, 미운 사람까지 만나는 것이 허물을 없앤다.",3],["六五와 정응이니 본래는 떳떳하게 만날 사이다. 그런데 지금은 어긋난 때라 큰길이 막혀 골목(巷)에서 만난다. 허물이 없다고 한 것은 간사하게 뒤로 만난 것이 아니라, 어긋난 상황에서 만날 수 있는 길이 그것뿐이었다는 뜻. 자리가 不正인데도 묘하게 풀리는 것은 得中 덕이다.",3],["음유가 부중부정한 데다 아래로 九二를 올라타고 위로는 九四에게 막혀, 앞뒤로 다 막힌다. 수레는 뒤에서 잡아당기고 소는 옆에서 끌리며 사람은 형벌까지 받는 — 睽 전체에서 가장 참혹한 장면이다. 그런데 上九와 정응이라 无初有終(처음은 없으나 끝은 있음)으로 마무리된다. 길흉을 달지 않은 것은 과정과 결과가 정반대라 한 글자로 묶을 수 없어서다.",3],["자리는 不正이고 初九와 敵應인 데다 위도 아래도 음이라 기댈 데가 없다 — 그것이 睽孤(어긋나 외로움)다. 그런데 바로 그 敵應인 初九를 元夫(큰 사내)라 부르며 만난다 — 應으로 연결되지 않았기에 오히려 같은 처지끼리 믿음을 교환한다. 어긋날 때는 정응이 아니라 같은 외로움이 연결의 근거가 된다는 것이 睽의 논리다.",3],["음이 양자리라 不正이고 九四를 올라타 본래 悔가 있을 자리인데, 得中했고 九二와 정응이라 지워진다. 厥宗은 그 무리 — 여기서는 九二를 가리킨다. 살을 깨물듯 한다는 것은 부드러운 것을 깨무는 일처럼 쉽게 통한다는 뜻. 어긋난 때에도 임금이 中을 잡고 아래와 통하면 갈라졌던 것이 다시 붙는다.",3],["어긋남의 극 — 의심이 극에 달해 없는 것까지 보이는 자리다. 六三과 정응이니 본래 제 짝인데, 의심에 눈이 멀어 돼지로도 보이고 귀신 수레로도 보여 활을 당긴다. 그러다 끝에 활을 내려놓는 것이 이 효의 전환점 — 보인 것이 아니라 보는 눈이 문제였다. 비(雨)는 음양이 화합해야 내리니, 어긋남이 풀리는 상이 그대로 吉이 된다.",3]],"39":[["蹇은 절뚝발이로 걷는 상 — 앞에 물(坎)이 있고 발밑은 산(艮)이라 갈 수가 없다. 그래서 여섯 효 중 넷이 往(감)과 來(옴)을 맞세우며 한결같이 來를 편든다. 初六은 맨 아래라 힘도 없고 六四와 같은 음이라 無應인데, 바로 그래서 멈추는 분별이 생긴다. 나아감을 멈춘 것 자체가 기림(譽)이 되는 드문 자리.",3],["中正한 음이 中正한 九五와 정응 — 蹇괘에서 유일하게 來를 말하지 않고 나아가는 자리다. 임금이 큰 어려움에 빠졌으니 신하로서 물러설 수가 없기 때문. 절고 또 절면서도 가는 것을 둘러 길흉을 달지 않은 것이 이 효의 무게 — 결과로 따질 일이 아니라 본분으로 할 일이라는 뜻이다.",3],["아래 艮의 끝이자 위 坎과 맞닿는 문턱 — 한 발짝만 더 가면 물이다. 아래 두 음효가 유일하게 기대는 양이라, 三이 올라가 버리면 아래가 무너진다. 上六과 정응이지만 그 上六도 음유라 끌어줄 힘이 없다. 그래서 돌아오는 것이 제자리로 돌아가는 것(反)이 된다 — 아래 사람들이 기뻐하는 귀환이다.",3],["이미 위 坎(험난)에 발을 들여놓은 자리다. 음유가 혼자서는 험을 건널 힘이 없고 初六과도 같은 음이라 無應인데다, 아래로 九三을 올라타(乘剛) 발밑도 불안하다. 그래서 돌아와 三과 이어진다(連). 蹇에서 돌아옴은 후퇴가 아니라 힘을 모으는 일임을 보여주는 효.",3],["中正한 양이 험의 한가운데 — 임금이기에 어려움도 가장 크다(大蹇). 다른 다섯 효가 往·來를 따지는 데 비해 이 효만은 오가는 말이 없다 — 임금은 피할 자리가 아니기 때문이다. 대신 벗이 온다고만 했으니, 六二의 王臣蹇蹇이 바로 그 오는 벗이다. 길흉을 안 달은 것은 아직 험을 벗어난 것이 아니라 사람이 모였을 뿐이기 때문.",3],["험의 맨 끝 — 더 갈 데가 없으니 돌아오는 것만이 살 길이다. 九三과 정응이라 돌아오면 받아줄 손이 있고, 바로 아래에 中正한 九五가 있으니 그가 곧 大人이다. 蹇괘에서 유일하게 吉이 붙은 자리인데, 그 吉이 나아감이 아니라 돌아옴에서 나온다는 점이 괘 전체의 결론이다.",3]],"40":[["解는 蹇을 뒤집은 종괘 — 매듭지었던 것이 풀리는 때다. 효사가 无咎 두 글자뿐인 것이 그 자체로 답이다 — 풀린 뒤에는 더 할 말이 없고, 매듭을 막 벗어난 처음엔 가만히 있는 것이 옳기 때문. 음유가 맨 아래라 힘은 없으나 九四와 정응이고 바로 위 九二를 承하니 위아래가 다 맞는다. 조건이 맞을 때 가만히 있으면 허물이 없다는 것.",3],["六五와 정응하는 유일한 양효로, 푸는 일을 실제로 맡는 자리다. 세 여우는 初六·六三·上六 세 음효 — 임금 곁의 간사한 소인을 뜻한다. 푸는 때 먼저 할 일이 얽힌 것을 만든 자를 걸러내는 것임을 보여준다. 黃矢의 黃은 中의 색이고 矢는 곧음이니, 자리가 不正인 것을 得中과 곧음으로 메운다는 뜻이 두 글자에 다 들어 있다.",3],["짐을 지는 것은 아랫사람의 일이고 수레에 타는 것은 윗사람의 일인데, 그 둘을 동시에 하니 제 그릇을 넘어선 모양이다. 음유가 不正부중한 데다 아래로 九二를 올라타(乘剛) 있으니 乘이라는 글자가 효사와 구조에 동시에 들어간다. 上六과도 같은 음이라 받쳐줄 데가 없으니 도적을 불러들이는 것이 제 탓이다. 繫辭傳이 이 효를 끌어 자리와 그릇의 문제를 논한다.",3],["엄지발가락(拇)은 맨 아래에 붙어 있는 것 — 여기서는 정응인 初六을 가리킨다. 정응이라 끊기 어려운데도 풀라고 한 것이 이 효의 핵심 — 解의 때에는 개인적 인연을 먼저 풀어야 제대로 된 벗이 온다. 자리가 不正이라 본래 사사로운 줄에 얽히기 쉬운 자리임을 전제한 경고다. 길흉을 안 달고 조건만 달았다.",2],["음이 양자리라 不正이고 九四를 올라타고 있지만, 得中했고 九二와 정응이라 푸는 일을 주장하는 자리다. 핵심은 마지막 구절 — 군자가 소인을 풀어낸 것이 진짜인지는 소인 쪽이 물러가는지로 확인된다는 것. 푸는 일의 성공 여부를 내 마음이 아니라 상대의 변화로 재는, 검증 기준을 밖에 둔 드문 효다.",3],["푸는 일의 마지막 자리 — 말로 풀리지 않는 매듭은 결국 끊어야 한다는 것을 보여준다. 송골매(隼)는 높은 데 앉아 있는 해로운 새이니 六三을 가리킨다. 無應인데도 잡는다고 한 것은, 호응이 아니라 바로잡을 대상이기 때문. 繫辭傳이 이 효를 끌어 기다렸다가 움직인다는 뜻을 말하니, 解괘의 마무리는 시기의 문제다.",3]],"41":[["損은 아래를 덜어 위를 보태는 괘 — 아래 兌의 양이 위 艮으로 올라간다. 初九는 덜어내는 쪽의 맨 앞자리로, 六四와 정응이니 보탬 대상이 분명하다. 두 가지 조건이 붙는데, 하나는 제 일을 마치고 가라는 것이고 다른 하나는 헤아려 덜라는 것(酌)이다. 돕는 일에도 제 몸을 비우지 않는 헤아림이 있어야 하므로 无咎에서 멈춘다.",3],["六五와 정응이라 바치고 싶은 마음이 간절한데, 그렇다고 나서면 凶이라 했다. 得中했기에 제자리를 지키는 것이 곧 공이기 때문 — 신하가 자기를 깎아가며 달려가면 임금을 보태는 게 아니라 구조를 무너뜨린다. 弗損益之(덜지 않는 것이 보태는 것)는 上九와 같은 구절을 쓰는데, 이쪽은 不正을 中으로 막는 맥락이다.",3],["損괘가 만들어진 내력을 효사가 그대로 설명한다 — 泰괘의 아래 세 양 중 하나(三)를 덜어 위로 올린 것이 損이다. 그래서 셋이면 하나를 덜고, 하나가 되어야 짝(上九)을 얻는다. 應은 반드시 하나여야 성립한다는 역의 짝 원리를 가장 선명하게 보여주는 효로, 길흉 대신 원리만 적어 둔 것이 그 증거다.",3],["덜어서 보태지는 쪽의 첫 자리. 음이 음자리라 正하고 初九와 정응이니 받을 통로가 분명하다. 특이한 것은 받는 것이 재물이 아니라 병을 덜어내는 일이라는 점 — 음유가 본래 지닌 허약함을 아랫사람의 도움으로 깎아낸다는 뜻. 初九의 遄(빨리)와 여기의 遄가 맞받는 것이 정응의 구조를 글자로 드러낸다.",3],["음이 양자리라 不正인데도 元吉이 붙은 드문 자리다. 근거는 得中과 九二와의 정응 — 임금이 자기를 비우고 아래에게 맡기니 온 천하가 보태준다. 열 붕짜리 거북은 당시 최고의 보물이자 점을 치는 도구라, 사람만 아니라 천의까지 거스를 수 없다(弗克違)는 뜻. 더는 괘의 끝에서 가장 큰 얻음이 나오는 역설.",3],["더는 일이 극에 이르면 더 덜 것이 없고 도리어 보태는 데로 뒤집힌다 — 損이 益으로 넘어가는 문턱이다. 九二와 같은 弗損益之 구절을 쓰지만 의미가 반대다 — 저쪽은 막는 말이고 이쪽은 베푸는 말이다. 得臣无家는 따르는 이가 한 집에 그치지 않고 천하에 미친다는 뜻으로, 덜어냄을 끝까지 감당한 자에게 돌아오는 보상이다.",3]],"42":[["益은 損을 뒤집은 종괘 — 위를 덜어 아래를 보태는 때다. 初九는 보태짐을 받는 맨 아랫자리로, 六四와 정응이라 위에서 내려주는 힘을 받는다. 아랫사람이 받은 힘을 제 것으로 두면 분수에 넘치므로 큰 일(大作)에 써야 하고, 그만큼 크게 길한 성과가 나야만 비로소 허물이 없다. 元吉과 无咎가 병렬이 아니라 조건으로 연결된 드문 구조.",3],["損 六五와 거의 같은 구절을 쓰는데 자리가 바뀌었다 — 저쪽은 받는 임금이고 이쪽은 받는 신하다. 中正한 음이 中正한 九五와 정응이니 받을 자격이 충분하다. 다만 損에서는 元吉이더니 여기선 永貞吉이라 조건을 달았으니, 신하가 큰 것을 받을 때는 오래도록 곧아야 한다는 뜻이다.",3],["음유가 부중부정하여 본래 보태짐을 받을 자격이 모자란 자리다. 그럼에도 허물이 없다고 한 것은 받은 것을 흉한 일 — 재해나 상사 같은 급한 구제에 썼기 때문이다. 사사로이 누리지 않았음을 보이려면 믿음과 증표(圭)가 필요하다. 中行은 효위상 中이 아니라 처신으로서의 가운데라, 구조보다 서술에 기대는 편.",2],["음이 음자리라 正하고 바로 위 九五를 承하며 아래 初九와 정응이니, 위의 뜻을 아래로 내리는 통로 그 자체다. 益괘에서 실제로 덜어지는 쪽이면서도 불만이 없는 이유가 여기 있다. 나라를 옮긴다는 것은 큰 일을 아랫사람들의 뜻을 업고 치르는 일이니, 아래를 보태는 괘의 성격과 정확히 맞아떨어진다.",3],["中正한 양이 中正한 六二와 정응 — 보태는 일의 주인 자리다. 勿問(묻지 말라)은 점을 치지 않아도 결과가 뚜렷하다는 뜻으로, 역에서 점치기 자체를 불필요하다고 말한 보기 드문 대목이다. 뒤 구절이 핵심 — 내가 베푸는 마음이 있으면 사람들도 믿음으로 내 덕을 은혜롭게 여긴다는, 주고받음이 맞물리는 구조다.",3],["보태는 괘의 끝인데 혼자 보태짐만 바라는 자리다. 자리가 不正이고 괘의 극에 있어 베푸는 쪽에서 받는 쪽으로 돌아선 것 — 그러자 아무도 주지 않고 도리어 친다. 六三과 정응이어도 소용이 없는 것은 마음이 한결같지 않기(立心勿恆) 때문이다. 損의 끝이 보태짐으로 뒤집힌 것과 정반대로, 益의 끝은 凶으로 떨어진다.",3]],"43":[["夬는 다섯 양이 맨 위 한 음을 끊어내는 괘 — 결단의 때다. 初九는 맨 아래라 힘은 있으나 지위가 없는데 발부터 앞서 나간다. 大壯 初九의 壯于趾와 거의 같은 구절인데 前(앞)자가 더 붙어 성급함이 더 진하다. 九四와 敵應이라 받아줄 곳도 없으니, 결단의 때에도 이길 힘 없이 먼저 나서면 그 자체가 허물이 된다.",3],["결단의 때에 유일하게 得中한 양이다. 두려워하며 경계하는 것(惕號)이 본분이니, 밤중에 적이 와도 놀라지 않는다. 자리는 不正이지만 그것이 오히려 낮추어 삼가는 맥락이 된다. 길흉을 달지 않은 것은 경계 자체가 결과가 아니라 상태이기 때문 — 군사가 온다는 말도 사실이 아니라 대비의 가정이다.",3],["다섯 양 중 유일하게 上六과 정응인 효라, 끊어야 할 상대와 사사로이 연결된 자리다. 광대뼈에 기색이 드러난다는 것은 속생각이 얼굴에 나온다는 뜻이니 그것만으로 흉하다. 그럼에도 무리와 떨어져 혼자 가서 사사로운 정을 끊으면, 비에 젖은 듯 오해를 사고 노여움을 받아도 끝내 허물은 없다. 凶과 无咎가 한 효에 공존하는 이유다.",3],["양이 음자리라 不正하고 中도 없으며 初九와 敵應이니, 가장 근거가 없는 자리다. 볼기 살이 벗겨졌다는 것은 앉아도 서도 불편해 나아가지도 머물지도 못하는 상태다. 양을 끌듯 하라는 것은 앞장서지 말고 뒤에서 몰아가라는 충고인데, 정작 자신은 그 말을 들어도 믿지 않는다. 처방은 있으나 복약하지 않는 효라 길흉을 달 수 없다.",3],["中正한 양이 끊어낼 上六 바로 아래에 붙어 있다 — 가장 가까이 있기에 가장 정이 들기 쉽다. 莧陸(비름)은 뿌리가 질기고 물이 많아 끊어도 다시 돋는 풀이니, 쉬워 보이나 질긴 상대를 가리킨다. 吉이 아니라 无咎에서 멈춘 것은, 임금이 가까운 자를 치는 일은 잘해야 본전일 뿐이기 때문이다.",3],["다섯 양이 끊어내려는 바로 그 한 음이다. 자리는 正하고 九三과 정응이지만 아래로 다섯 양을 다 올라타고 있으니, 버틸 수가 없다. 九二는 惕號(두려워하며 외침)로 살았는데 上六은 无號(외칠 곳이 없음) — 같은 號 자를 쓰면서 생사가 갈리는 짝 배치다. 終有凶은 지금 당장이 아니라 끝내 그렇다는 뜻이다.",3]],"44":[["姤는 夬를 뒤집은 종괘 — 다섯 양 아래에 한 음이 생겨난 때다. 初六이 바로 그 한 음으로, 여섯 효 중 유일한 음이자 괘의 주인이다. 지금은 맨 아래라 약해 보이지만 그대로 두면 자라 다섯 양을 다 밀어낸다. 그래서 수레를 멈추는 쇠 굄목(金柅)으로 지금 묶어두면 吉, 가도록 두면 凶이다. 한 효에 吉·凶이 붙은 것은 처치에 따라 갈리기 때문.",3],["물고기(魚)는 음물이니 初六을 가리킨다. 九二는 初六 바로 위에 있어 그 음을 품에 감싸고 있는 자리다. 得中했기에 감싸는 것이 허물이 아니라 단속이 된다 — 가까이 있는 자가 막아야 말썽이 잠잠해진다는 뜻. 손님에게 이롭지 않다는 것은 밖의 九四에게는 돌아갈 것이 없다는 말로, 바로 다음 효의 包无魚와 짝을 이룬다.",3],["夬 九四와 거의 같은 구절을 쓴다 — 夬와 姤가 종괘 관계임을 글자로 드러낸 대목이다. 初六을 탐하나 바로 아래 九二가 이미 감싸고 있어 닿지 못하고, 上九와도 敵應이라 위로도 갈 데가 없다. 그래서 앉지도 서지도 못하는 臀无膚가 된다. 厲인데도 큰 허물은 없다고 한 것은, 자리가 正하여 마음은 있어도 실제로 얽히지는 않았기 때문이다.",3],["初六과 정응이니 명분상 그 음은 九四의 짝이다. 그런데 이미 九二가 가까이서 감싸버렸으니 손에 넣을 것이 없다(包无魚). 먼 정응보다 가까운 이웃이 이긴다는, 應과 比(인접)가 충돌하는 드문 사례다. 자리가 不正인데 잃은 것을 되찾겠다고 일어나면 凶 — 이유는 멀어졌기 때문이 아니라 멀어진 사이에 자기가 한 일이 없어서다.",3],["中正한 양이 괘의 임금 자리다. 참외(瓜)는 땅에 닿아 자라는 음물이니 初六을 가리키고, 구기자나무(杞)는 큰 나무라 임금 자신이다. 아래에서 올라오는 음을 치지 않고 덮어 감싸는 것이 임금의 방법이며, 그 덕을 드러내지 않고 머금어 둔다(含章). 그러면 복은 사람이 아니라 하늘이 준다는 것이 마지막 구절이다. 길흉을 안 달고 상만 둔 것이 이 효의 계산된 여백이다.",3],["만남의 괘인데 가장 멀리 있어 머리 끝의 뿔에서나 만난다 — 만남이 아니라 스치는 것이다. 자리가 不正이고 九三과도 敵應이라 아래와 이어질 줄이 하나도 없다. 그래서 부끄러움(吝)이지만, 바로 그 때문에 아래의 음과 얽힐 일도 없어 허물은 없다. 遯 上九의 肥遯과 구조는 같은데, 저쪽은 여유롭고 이쪽은 멋쩍은 것이 괘의 주제 차이다.",3]],"45":[["萃는 모임의 괘 — 위의 두 양(四·五)을 중심으로 아래 네 음이 모여든다. 初六은 九四와 정응이니 붙을 곳이 분명한데, 바로 옆에 같은 음인 六二·六三이 있어 눈이 흔들린다. 그래서 믿음이 끝까지 가지 못하고 어지러워진다. 해답은 부르는 것 — 한번 소리를 내면 금세 통하여 웃음이 된다. 모일 때 머뭇거리지 말고 불러야 한다는 것.",3],["中正한 음이 中正한 九五와 정응 — 萃괘에서 가장 바른 모임의 짝이다. 引(끌어줌)은 자기가 달려가는 것이 아니라 위가 끌어주길 기다린다는 뜻 — 음은 먼저 나서지 않는 것이 본분이기 때문이다. 禴은 제물을 가장 간략하게 차리는 봄제사니, 믿음만 있으면 형식은 적어도 된다는 뜻이 坎 六四의 用缶와 통한다.",3],["음유가 부중부정한 데다 上六과도 같은 음이라 無應 — 모임의 때에 붙을 데가 없는 유일한 자리다. 그래서 모이려 하다 탄식한다(萃如嗟如). 다만 바로 위 九四를 承하고 있으니, 정응은 아니더라도 가까이 붙으면 허물은 없다. 다만 제 짝이 아닌 데 붙은 것이라 조금 부끄러울(小吝) 뿐이다.",3],["아래 네 음이 다 이쪽으로 모여드는 자리라 사람은 가장 많이 얻는다. 그러나 양이 음자리라 不正이고 中도 없으며 임금도 아니니, 사람을 모으는 것 자체가 의심받을 자리다. 그래서 크게 길한 결과가 나야만 비로소 허물이 없다 — 益 初九와 같은 조건문 구조로, 大吉과 无咎가 병렬이 아니다.",3],["中正한 양이 임금 자리에서 사람을 모은다 — 九四가 자리 없이 모으는 것과 달리 명분이 있다(有位). 그런데도 吉이 아니라 无咎에 멈춘 것은, 바로 아래 九四가 이미 인심을 거두고 있어 모두가 임금을 믿는 것은 아니기 때문(匪孚)이다. 해답은 밖으로 치는 것이 아니라 자기를 크고 오래고 곧게 가져가는 것(元永貞)이다.",3],["모임의 맨 끝에서 혼자 떨어져 있는 자리다. 자리는 正하나 六三과 같은 음이라 無應이고, 아래로 九五를 올라타(乘剛) 붙을 데가 없다. 그래서 모임에서 밀려난 설움으로 울며 탄식한다. 그럼에도 无咎인 것이 이 효의 핵심 — 울 줄 아는 것이 이미 돌아오려는 마음이라, 離 六五의 눈물과 같은 이치다.",3]],"46":[["升은 땅 속에서 나무가 자라 오르는 상 — 萃(모임)를 뒤집은 종괘로, 모인 다음 올라가는 때다. 初六은 음유가 맨 아래에 있어 혼자는 오를 힘이 없고 六四와도 같은 음이라 無應이다. 그럼에도 大吉인 것은, 바로 위 九二·九三 두 양을 承하여 그들의 믿음을 얻고(允) 함께 오르기 때문이다. 오를 때는 제 힘보다 믿어주는 이가 있느냐가 먼저라는 뜻.",3],["萃 六二와 거의 같은 구절을 쓰는데 음양이 바뀌었다 — 저쪽은 음이 모이는 자리이고 이쪽은 양이 오르는 자리다. 양이 음자리라 不正이지만 得中했고 六五와 정응이니, 강한 자가 부드러운 임금을 섬기는 구조다. 그럴 때 가장 위험한 것이 치장함이므로, 제물을 가장 간략하게 차리는 봄제사로 속만 보이라 한다.",3],["아래 巽의 끝에서 위 坤으로 올라가는 자리다. 위가 통째로 음이라 막는 것이 하나도 없고, 上六과 정응까지 되니 거칠 것이 없다 — 그것을 빈 고을에 들어가는 것으로 그렸다. 길흉을 달지 않은 것이 묘한데, 거칠 것이 없다는 것은 쉬운 것이자 동시에 얻을 것도 없다는 뜻이라, 좋다 나쁘다를 매길 수 없기 때문이다.",3],["아래 巽(나무)에서 위 坤(땅)으로 넘어온 첫 자리다. 음이 음자리라 正하고 바로 위 六五를 섬기니, 오르는 사람들을 임금에게 이어주는 통로가 된다. 기산은 주나라가 일어난 터라, 낮은 데서 착실히 올라 천하를 얻은 본보기로 끌어온 것이다. 역사적 일화에 기대는 편이라 구조 정합도는 중간이다.",2],["음이 양자리라 不正이지만 得中했고 九二와 정응이다. 섬돌(階)을 밟고 오른다는 것이 핵심 — 임금이 혼자 뛰어오르는 것이 아니라, 아래의 현인(九二)을 딛돌 삼아 한 칸씩 올라간다는 뜻이다. 貞吉이라 조건을 단 것은, 오르는 길에서 가장 쉽게 저지르는 잘못이 순서를 건너뛰는 일이기 때문이다.",3],["오름이 극에 이르러 더 오를 데가 없는데도 어둠 속에서 계속 오르려 한다(冥升). 그칠 줄 모르는 상승은 본래 흉한데, 이 효는 흉을 달지 않고 방향을 틀어 버렸다 — 지위를 올리는 데 쓰지 말고 쉬지 않는 곧음(不息之貞), 곧 끝없는 수양에 쓰라는 것. 極을 흉으로 막지 않고 전환으로 푸는 드문 마무리다.",3]],"47":[["困은 곤궁한 때 — 위의 못물이 아래로 새어 말라버린 상이다. 初六은 그 맨 밑이라 곤경이 가장 깊다. 九四와 정응이나 사이에 두 효가 가로놓여 닿지 못하고, 음유가 부정한 데다 험(坎)의 밑이라 벗어날 힘도 없다. 그루터기는 앉아 쉬려 해도 편치 않은 자리니, 쉬는 것조차 곤경이 되는 자리다. 길흉을 달지 않은 것은 이것이 판정이 아니라 상황 묘사이기 때문이다.",3],["곤경의 원인이 모자람이 아니라 술과 음식이라는 것이 이 효의 묘미다 — 받는 것은 있으나 제 뜻을 펼 길이 없어 답답한 곤경이다. 得中한 양이라 속은 가득차 있는데, 九五와 敵應이라 부름을 받아도 서로 뜻이 맞지 않는다. 그래서 나서면 凶이고, 정성을 올리는 제사처럼 속을 지키면 허물이 없다.",3],["음유가 부중부정한 데다 위로는 九四의 돌에 막히고 아래로는 九二를 올라타 가시덩굴 위에 앉은 꼴이다. 上六과도 같은 음이라 無應이니 돌아갈 집도 비어 있다. 앞·뒤·안 세 곳이 모두 막힌 자리라 困괘에서 가장 흉하다. 繫辭傳이 이 효를 끌어 곤궁할 자리가 아닌 데서 곤궁하면 이름이 반드시 욕된다고 한다.",3],["初六과 정응이라 내려가 도와야 할 자리인데, 양이 음자리라 不正하고 중간에 九二의 쇠수레가 가로막고 있어 걸음이 느리다. 짝이 기다리는데 닿지 못하니 부끄러울(吝) 뿐이다. 다만 정응은 언젠가 이루어지므로 有終(끝은 있음)을 붙였다 — 困에서는 느린 것이 흠이지 못 가는 것은 아니다.",3],["中正한 양이 임금 자리에 있는데도 형벌 이미지가 붙은 것은, 위로 上六에게 눌리고 아래로 六三에게 받쳐지지 못해 위아래가 다 깎이는 상이기 때문이다. 九二와도 敵應이라 쓸 사람이 없다. 그래도 中正을 잃지 않으니 느리나마 풀린다(乃徐有說). 九二가 享祀, 이쪽이 祭祀를 쓰는 것은 둘 다 정성으로 막힌 때를 건너는 짝 배치다.",3],["곤경이 극에 이른 자리다. 칡덩굴은 얽히면 풀리기 어려운 덩굴이고, 자리도 불안하게 흔들거린다. 그런데 마지막에 征吉이 붙는다 — 극에 이르면 바뀌기 때문이고, 움직이면 뉘우친다는 것을 알면서도 움직이는 것이 묶임을 끊는 유일한 길이기 때문이다. 悔를 감수해야 吉이 나오는 구조다.",3]],"48":[["井은 困을 뒤집은 종괘 — 물이 말라버린 다음에 물을 길어 올리는 때다. 여섯 효를 우물 밑바닥에서 두레박까지 아래에서 위로 올라가며 읽는 것이 이 괘의 틀이다. 初六은 우물 맨 밑의 진흙이라 먹을 수 없고, 六四와도 같은 음이라 無應이니 길어 올려줄 손도 없다. 사람이 버린 우물은 짐승조차 찾지 않는다는 말로 방치의 끝을 보인다.",3],["양강이라 샘물은 있으나 九五와 敵應이라 위로 끌어올려 줄 손이 없다. 그래서 물이 위로 가지 못하고 옆으로 새어 아래 붕어나 적셔준다. 독이 깨졌다는 것은 길어 올릴 그릇조차 사용불능이라는 뜻. 재능이 있어도 이어줄 사람과 그릇이 없으면 쓰이지 못한다는 것을, 길흉 없이 장면만으로 보여준다.",3],["양이 양자리라 正하고 上六과 정응까지 되니, 우물로 치면 이미 쳐서 맑은 물이다. 그런데도 아무도 마시지 않는다 — 아래 巽에 속해 아직 올라오지 못한 자리이기 때문이다. 그래서 이 효에만 為我心惻이라는 감정 표현이 들어간다. 쓰일 준비는 끝났고 임금의 밝음만 남았으니, 길흉을 달 수 없는 대기 상태다.",3],["음이 음자리라 正하나 음유라 물을 길어 남을 먹일 힘은 없다. 그래서 하는 일이 우물 벽을 벽돌로 쌓는 보수이다 — 직접 보태지는 않으나 물이 흐려지지 않게 하는 일. 吉이 아니라 无咎에서 멈춘 것은, 자기를 다스렸을 뿐 남에게 미친 것은 없기 때문이다. 井괘에서 수리와 쓰임을 갈라 놓는 자리다.",3],["中正한 양이 우물의 한가운데에서 가장 맑고 차가운 샘물이 된다 — 井괘에서 물이 비로소 먹을 만해진 자리다. 다만 길흉을 달지 않은 것이 중요하다 — 우물은 맑기만 해서는 완성이 아니고 두레박까지 길어 올려 사람들이 써야 비로소 공이 되므로, 판정은 上六으로 미뤄둔 것이다.",3],["64괘에서 上효가 가장 좋은 드문 사례다. 다른 괘에서는 극에 이르면 무너지지만, 우물은 두레박에 이르러야 비로소 쓰임이 완성되기 때문이다. 九三과 정응이라 아래의 맑은 물과 이어져 있고, 덮지 말라(勿幕)는 누구나 퍼 쓰게 열어두라는 뜻이다. 자리를 올리는 대신 넘기면 元吉이 된다 — 升 上六이 수양으로 틀었던 것과 같은 방식의 마무리다.",3]],"49":[["革은 바꿈의 괘 — 못 속에 불이 있어 서로 못 견디는 상이다. 初九는 바꿈의 맨 아래라 뜻은 있으나 지위가 없고, 九四와 敵應이라 밖에서 받아줄 손도 없다. 그래서 고치는 대신 묶어 둔다. 遯 六二와 같은 黃牛之革 구절을 쓰는데, 저쪽은 물러나지 않게 묶는 것이고 이쪽은 섣부르게 고치지 않게 묶는 것이다. 바꿈의 첫 수는 참는 것이라는 뜻.",3],["中正한 음이 中正한 九五와 정응 — 革괘에서 바꿀 자격이 가장 바른 자리다. 그런데도 바로 바꾸지 않고 때가 차기를 기다린다(巳日) — 바꿈은 그 자체로는 사람을 쉬이 믿게 하지 못하므로, 명분이 쌓일 때까지 기다리는 것이 순서기 때문이다. 기다린 뒤에는 나아가는 것이 吉이자 无咎이다.",3],["아래 離(불)의 끝이라 바꾸려는 기운이 가장 세다. 자리는 正하나 中이 없어 절제가 안 되므로, 밀어붙이면 凶이고 곧게 해도 위태롭다. 해답이 革言三就 — 고치자는 논의가 세 번 돌고 나면 비로소 사람들이 믿는다는 것. 힘이 아니라 공론으로 바꾸라는, 革괘에서 가장 실무적인 대목이다.",3],["아래 離에서 위 兌로 넘어온 자리 — 바꿈이 실제로 일어나는 문턱이다. 양이 음자리라 不正이고 初九와도 敵應이라 본래 悔가 있을 자리인데, 믿음이 그것을 지운다. 改命(명을 고침)은 역에서 가장 무거운 말 중 하나인데, 그 조건으로 자리나 힘이 아니라 믿음(有孚)만을 달았다는 점이 핵심이다.",3],["中正한 양이 바꿈을 주재하는 자리다. 범의 무늬는 크고 선명하니, 바뀌었다는 사실이 누가 보아도 뚜렷하다는 뜻. 未占有孚은 점을 쳐볼 것도 없이 이미 사람들이 믿는다는 말로, 益 九五의 勿問과 함께 역에서 점치기 자체를 불필요하다고 한 드문 대목이다. 길흉을 달지 않은 것도 더 이를 말이 없어서다.",3],["바꿈이 끝난 뒤의 자리다. 범(九五)보다 무늬가 잔 표범으로 바꿈의 크기가 한 단계 줄어든다 — 근본은 이미 바뀌었으니 남은 것은 마무리를 다듬는 일이기 때문이다. 소인은 속까지 바뀌지 못하고 얼굴만 고치는데, 그것을 강요하여 더 밀어붙이면 凶이다. 멈추고 곧게 지키는 것이 吉 — 바꿈은 그칠 줄 아는 데서 완성된다.",3]],"50":[["鼎은 革을 뒤집은 종괘 — 낡은 것을 깨뜨린 다음 새 것을 익히는 때다. 여섯 효를 솥의 발·몸·귀·손잡이로 아래에서 위로 읽는 것이 이 괘의 틀이다. 初六은 발이라 솥을 엎어놓는 장면인데, 본래 흠인 그 일이 오히려 묵은 것을 버리는 데 쓰인다. 九四와 정응이라 위로 이어지니, 낮고 바르지 못한 자리도 비우는 데 쓰이면 허물이 없다.",3],["양강이 得中했으니 솥으로 치면 속에 알맹이가 가득 차 있는 자리다. 仇(짝)는 바로 아래의 初六을 가리키는데, 바로 붙어 있어 끌어당기기 쉬운 상대다. 그런데 저쪽에 병이 있어 다가오지 못하니, 내 속이 온전하게 지켜져 吉이다. 사사로이 끌리지 않는 것이 내용을 지키는 길임을 보여준다.",3],["솥의 귀는 六五인데, 九三은 上九와 敵應이고 六五와도 호응이 없어 손잡이를 꿰줄 사람이 없다. 그래서 속에 꿩 기름 같은 좋은 것을 담고도 옮기지 못해 먹히지 못한다 — 井 九三의 井渫不食과 같은 구조다. 다만 자리가 正하므로 때가 오면 음양이 어울려 비가 내리듯 풀려 終吉이 된다.",3],["임금 바로 아래에서 큰 일을 맡은 자리인데, 양이 음자리라 不正하고 中도 없다. 게다가 정응이라 하여 맨 아래 음유한 初六을 끌어쓰니, 그것이 바로 부러지는 다리다. 그릇이 안 되는 사람을 쓴 탓으로 임금의 음식을 엎고 제 모양까지 망가진다. 繫辭傳이 이 효를 끌어 덕은 얇은데 직위가 높으면 화가 미친다고 한다.",3],["음이 양자리라 不正이지만 得中했고 九二와 정응이다. 귀는 솥을 옮기려면 반드시 거쳐야 하는 자리이니, 六五는 남의 힘을 받아들이는 통로다. 黃은 中의 색이라 得中과 가지런히 겹치고, 쇠 손잡이는 바로 위 上九의 강함을 承하여 받는 것이다. 길흉 대신 利貞만 둔 것은 손잡이를 갖춰도 아직 들어 옮기기 전이기 때문이다.",3],["井 上六과 함께 64괘에서 上효가 가장 좋은 두 사례 중 하나다. 솥은 손잡이에 이르러야 비로소 들어 쓸 수 있기 때문에, 극이 무너짐이 아니라 완성이 된다. 六五의 쇠 손잡이보다 한 단계 올라간 옥 손잡이는 강하되 온화하다는 뜻으로, 자리가 不正인데도 大吉인 근거가 거기 있다.",3]],"51":[["震은 우레가 겹친 괘 — 놀란 속에서 어떻게 처신하느냐를 묻는다. 初九는 아래 震의 주효로 우레가 시작되는 자리다. 양이 양자리라 正하고, 무엇보다 먼저 두려워할 줄 알기에 뒤에 웃을 수 있다. 괘사와 거의 같은 구절을 쓰는 유일한 효로, 震괘 전체의 모범이다. 두려움이 먼저 오고 웃음이 나중에 오는 순서가 핵심이다.",3],["中正한 음이나 바로 아래 初九의 우레를 올라타고(乘剛) 있어 직격탄을 정면으로 맞는 자리다. 六五와도 같은 음이라 無應이니 기대거나 도망칠 상대도 없다. 해답은 재물을 버리고 높은 데로 피하되 잃은 것을 쫓지 않는 것 — 中을 지키면 일곱 날 뒤에 저절로 돌아온다. 일곱은 역에서 한 바퀴 돌아 제자리로 오는 수이다.",3],["음유가 부중부정한 데다 아래 震의 끝이자 위 震의 문턱이라, 앞뒤로 우레를 맞아 정신이 아득하다(蘇蘇). 上六과도 같은 음이라 無應이니 기댈 데가 없다. 그럼에도 재앙이 없다고 한 것은, 우레에 놀라 움직이는 것 자체가 제자리에 멈춰 있지 않는 일이기 때문이다.",3],["위 震의 주효로 두 번째 우레가 시작되는 자리다. 그러나 양이 음자리라 不正하고 中도 없으며, 위아래로 음효 넷에 둘러싸여 기운이 뻗지 못한다. 初九와도 敵應이라 밖에서 받아줄 손도 없다. 그래서 같은 주효인데도 初九는 吉이고 이쪽은 진흙에 빠진다 — 자리가 바르냐가 같은 힘을 갈라 놓는 표본이다.",3],["음이 양자리라 不正이고 아래로 九四를 올라타며 六二와도 같은 음이라 無應이다. 게다가 위 震의 한가운데라 오는 우레도 가는 우레도 다 맞는다(往來厲). 그럼에도 六二가 재물을 잃은 것과 달리 이쪽은 잃지 않는다 — 임금으로서 得中하여 중심을 지키기 때문이다. 잃지 않으면 할 일이 남는다는 것이 이 효의 마무리다.",3],["우레가 극에 이른 자리라 두려움이 가장 심하다. 음유가 끝에 있고 六三과도 같은 음이라 無應이니, 나서면 凶이다. 핵심은 뒤 구절 — 우레가 아직 내 몸이 아니라 이웃에 떨어졌을 때 미리 삼가면 허물이 없다는 것. 남의 재난을 보고 자기를 경계하라는 뜻이며, 그러면 가까운 이들의 말은 듣게 된다.",3]],"52":[["艮은 그침의 괘로 震을 뒤집은 종괘다. 여섯 효를 발가락·장딴지·허리·몸·광대뼈로 아래에서 위로 읽는 것이 틀이며, 咸괘와 같은 신체 배열을 쓰되 저쪽은 느낌이고 이쪽은 멈춤이다. 또 여섯 효가 모두 無應·敵應으로 호응이 하나도 없는 드문 괘인데, 서로 등지고 멈춰 있는 산의 성격이 그대로 드러난 것이다. 初六은 발가락이라 움직이기 전에 멈춘 자리라 허물이 없다.",3],["中正한 음이나 六五와 같은 음이라 無應이다. 장딴지는 제 뜻으로 못 움직이고 허리(九三)가 가는 대로 따라가는 부위다. 그런데 바로 위 九三이 허리를 갈라 버린 탓이라, 따르고 싶어도 건져 올릴 수가 없다. 그래서 中正한 자리인데도 길흉 대신 마음이 편치 않다는 말만 남는다. 咸 六二가 먼저 뛰어나가 凶이었던 것과 정반대 짝이다.",3],["허리는 상체와 하체가 맞물리는 곳이니, 아래 艮과 위 艮이 맞붙는 이 자리와 정확히 겹친다. 그 마디를 억지로 갈라 멈추니 등살이 찢어지는 것이다. 자리는 正하나 中이 없고 上九와도 敵應이라 유연함이 없다. 멈춤도 자리를 잘못 고르면 몸을 찢고 속을 태운다는, 艮괘에서 가장 아픈 효다.",3],["음이 음자리라 正하고, 발이나 허리 같은 한 부위가 아니라 몸 전체를 멈춘다. 九三처럼 한 마디를 억지로 갈라 멈추는 것이 아니라 몸을 통째로 거두는 것이라 무리가 없다. 다만 吉이 아니라 无咎에 멈춘 것은, 음유라 제 몸을 단속했을 뿐 남까지 멈추게 하지는 못했기 때문이다.",3],["음이 양자리라 不正이고 六二와도 같은 음이라 無應이지만, 得中했기에 悔가 지워진다. 멈추는 곳이 입 — 몸이 아니라 말을 멈추는 자리다. 그런데 아예 입을 닫는 것이 아니라 말에 순서를 두는 것(言有序)이 답이다 — 咸 上六이 말뿐이라 알맹이가 없었던 것과 짝을 이룬다. 멈춤은 입을 막는 것이 아니라 때를 가리는 것이다.",3],["다른 괘에서는 극에 이르면 무너지는데, 멈춤의 괘에서만은 끝까지 멈추는 것이 곧 완성이다. 그래서 자리가 不正이고 九三과 敵應인데도 吉이 붙는다. 敦(두터움)은 멈춤이 억지로 버티는 것이 아니라 넉넉히 쌓인 것이라는 뜻 — 九三의 찢기는 멈춤과 정반대다. 井·鼎과 함께 上효가 좋게 끝나는 괘에 든다.",3]],"53":[["漸은 차례대로 나아감의 괘다. 여섯 효가 모두 기러기(鴻)가 물가→바위→뭍→나무→언덕으로 한 칸씩 올라가는 그림으로 된 드문 괘인데, 기러기는 줄을 지어 순서를 지키고 짝을 바꾸지 않는 새라 이 괘의 주제와 딱 맞는다. 初六은 물가라 아직 물을 벗어나지 못한 자리다. 六四와도 같은 음이라 無應이니 어린아이처럼 위태롭고 말을 듣지만, 순서를 어기지 않았으니 허물은 없다.",3],["中正한 음이 中正한 九五와 정응 — 漸괘에서 가장 편안한 자리다. 물가에서 한 칸 올라 너럭바위에 이르렀으니 발밑이 단단하고, 위에 임금과 통하니 먹고 마시는 데 화기가 있다. 다만 배불리 먹는 것이 아니라 순서를 밟아 얻은 자리라 吉이라는 것이 이 괘의 뜻이다.",3],["뭍은 물새인 기러기가 머무를 곳이 아니다 — 자리를 잘못 고른 것이다. 자리는 正하나 中이 없고 上九와 敵應이라, 제 짝을 두고 바로 옆의 六四와 사사로이 붙어버린다. 그것을 남편이 돌아오지 않고 아내가 기르지 못하는 장면으로 그렸다. 순서를 건너뛰면 凶이고, 그 강함은 밖의 도적을 막는 데나 써야 한다.",3],["기러기는 발가락이 붙어 있어 나뭇가지를 움켜잡지 못하는 새다. 그러니 나무는 본래 있을 자리가 아니다. 다만 평평한 가지(桷)를 얻으면 걸칠 수 있어 허물이 없다. 음이 음자리라 正한 데다 유순하여 무리하게 버티지 않기 때문이다. 初六과 無應이고 아래로 九三을 올라타 불안한 자리인데, 그럴수록 발붙일 곳을 골라야 한다는 뜻이다.",3],["中正한 양이 中正한 六二와 정응이니 본래 완전한 짝이다. 그런데 사이에 九三·六四가 가로놓여 서로 막혀 있으니, 그것을 세 해도록 임신하지 못하는 장면으로 그렸다. 그래도 吉인 것은, 순서대로 가는 짝은 중간의 방해가 결국 이길 수 없기(終莫之勝) 때문이다. 느리더라도 바른 것이 이긴다는, 漸괘의 핵심 명제다.",3],["나아감이 끝까지 이른 자리다. 원문의 陸은 九三과 같은 글자라 예로부터 逵(큰 하늘길)의 오기로 보는 설이 유력한데, 한 칸씩 올라가는 괘 구조상 언덕 위는 하늘이어야 맞는다. 자리가 不正이고 敵應인데도 吉인 것은, 높이 떠난 기러기가 줄을 지어 나는 모양이 그 자체로 사람들이 본받는 본보기(儀)가 되기 때문이다.",2]],"54":[["歸妹는 漸을 뒤집은 종괘 — 저쪽이 순서를 지켜 시집가는 정혼이라면, 이쪽은 순서를 건너뛴 혼인이다. 그래서 여섯 효 중 자리가 바른 것이 初九 하나뿐이고, 판정어가 없는 효가 절반이다. 初九는 맨 아래라 정처가 아니라 딸려가는 자리인데, 자리가 正하고 분수를 알기에 절뚝발이라도 걸어갈 수 있다.",3],["得中한 양이 六五와 정응이니 짝은 제대로 만난 셈이다. 다만 그 짝이 不正한 음이라 온전히 기대기 어려우니, 애꾸눈으로나 보는 꼴이다. 初九의 절뚝발과 짝을 이루는 장애 이미지로, 둘 다 온전하지 않은 관계를 가리킨다. 해답은 숨어 사는 이처럼 조용히 곧음을 지키는 것 — 길흉 대신 처신만 둔 이유다.",3],["음유가 부중부정한 데다 아래로 九二를 올라타고 上六과도 같은 음이라 無應이다. 아래 兌(기쁨)의 끝에서 먼저 기뻐하며 나서는 꼴이라 제대로 맞아주는 이가 없다. 그래서 기다리다가 결국 돌아와 딸려가는 자리로 낮춰진다. 길흉을 달지 않은 것은, 이미 낮춰졌다는 사실 자체가 판정을 대신하기 때문이다.",3],["양이 음자리라 不正하고 初九와도 敵應이라 짝이 없는 자리다. 그래서 혼기를 놓친다. 다만 이 효는 그것을 흠으로 보지 않고 기다림으로 바꿔 읽는다 — 강한 양이 아무에게나 가지 않고 제 짝을 기다리는 것이라면, 늦음은 흠이 아니라 고른 결과이기 때문이다. 歸妹괘에서 드물게 깔끔한 자리라 길흉을 달지 않았다.",3],["음이 양자리라 不正이고 九四를 올라타고 있지만, 得中했고 九二와 정응이라 歸妹괘에서 가장 좋은 자리다. 핵심은 본처의 소매가 딸려간 이보다 못하다는 대목 — 지체 높은 이가 꾸밈을 낮추고 속을 택했다는 뜻이다. 달이 거의 보름이라는 것도 꽉 차지 않은 데서 멈춘다는 뜻이니, 낮추고 다 채우지 않는 것이 吉의 조건이다.",3],["혼인의 마지막 자리인데 정작 알맹이가 없다. 광주리와 양은 종묘 제사에 바치는 것인데, 둘 다 빈 꼴이니 혼례가 형식만 남고 실질이 없다는 뜻이다. 자리는 正하나 六三과 같은 음이라 無應이고 괘의 끝에 있어 받아줄 상대가 없다. 순서를 건너뛰어 맺은 관계가 결국 빈 그릇으로 끝난다는, 歸妹괘 전체의 결론이다.",3]],"55":[["豐은 성대함의 괘 — 아래에 밝음(離)이 있고 위에 움직임(震)이 있어 해가 대낮에 이른 상이다. 그런데 괘 안은 온통 어두움 이미지로 차 있으니, 극성하면 기운다는 경계가 괘 전체를 관통한다. 初九는 九四와 敵應인데도 그를 配主(짝이 되는 주인)라 부른다 — 밝음과 움직임은 같은 양이라도 서로 있어야 성대해지기 때문이다. 敵應이 협력으로 뒤집히는 드문 사례다.",3],["中正한 음이나 六五와 같은 음이라 無應이다. 밝은 離의 한가운데에 있으면서도 위에서 받아줄 임금이 없으니, 차양이 드리워 한낮에 별을 보는 꼴이다. 나서면 의심만 산다. 해답은 밖으로 보이려 하지 말고 믿음으로 속에서 움직이는 것(有孚發若)이다 — 성대한 때에 가려진 이가 살아남는 법이다.",3],["아래 離의 끝이라 밝음은 가장 강한데, 정응인 上六이 음유한 데다 괘의 끝에서 이미 무너진 효라 받아줄 힘이 없다. 六二의 차양보다 더 짙은 휘장이 드리워 별도 더 작게 보인다. 오른팔이 부러졌다는 것은 쓸 수단을 잃었다는 뜻 — 그럼에도 허물이 없다는 것은 못 쓰게 된 것이 제 탓이 아니기 때문이다.",3],["六二와 같은 차양 구절을 쓴다 — 자리가 不正하고 中도 없어 위 震의 맨 아래에서 어둠에 가려져 있기 때문이다. 그러나 初九와 만나면 吉이 된다 — 夷主(동등한 주인)는 初九를 가리키며, 저쪽이 配主라 불렀던 것과 맞장구다. 밝음과 움직임이 만나야 성대해진다는 구조를 두 효가 나눠 지니고 있다.",3],["음이 양자리라 不正이고 九四를 올라타며 六二와도 같은 음이라 無應이다. 조건은 별로인데 豐괘에서 유일하게 어두움 이미지가 없는 효다. 근거는 來章 — 제 밝음을 내세우는 대신 빛나는 이들(六二·九三)을 오게 하기 때문이다. 임금이 음유한 것이 오히려 남을 불러들이는 근거가 되는, 豐괘의 해답이다.",3],["성대함이 극에 이른 자리다. 집을 크게 짓고 덮기까지 했으나 정작 안에는 사람이 없다 — 겉은 크고 속은 빈 성대함이다. 자리는 正하고 九三과 정응이지만 음유가 괘의 끝에서 스스로 높이 올라가 사람을 끊은 탓이다. 困 初六의 三歲不覿과 같은 구절을 쓰는데, 저쪽은 빠져서이고 이쪽은 스스로 가렸기 때문이다.",3]],"56":[["旅는 나그네의 괘 — 산(艮) 위에 불(離)이 있어 한곳에 머무르지 못하고 옮겨다니는 상이다. 내 집이 아니니 모두 조심스럽게 처신해야 하는데, 初六은 맨 아래라 처지가 가장 낮고 음유가 부정하여 좀스러워진다. 나그네가 잔일에 매달리면 업신여기기 쉽고 재앙을 자초한다. 九四와 정응이지만 제 처신이 그러하니 도움이 닿지 않는다.",3],["中正한 음이라 나그네 중 가장 안정된 자리다. 숙소를 얻고 노잣돈을 간직하고 부리는 사람까지 얻었으니 세 가지가 다 갖춰졌다. 六五와 같은 음이라 無應인데도 이런 것은, 나그네에게는 큰 호응보다 제 처신이 중요하기 때문이다. 길흉을 달지 않은 것은 안정 자체가 이미 충분한 답이기 때문이다.",3],["자리는 正하나 中이 없고 아래 艮의 끝에서 위 離(불)와 맞닿아, 나그네의 몸으로 강함을 드러낸다. 그래서 머물던 숙소가 타고 부리던 사람까지 잃는다 — 六二가 얻은 세 가지를 정확히 거꾸로 뒤집은 짝이다. 上九와도 敵應이라 의지할 데가 없으니 곧게 해도 위태롭다.",3],["양이 음자리라 不正하고 中도 없으나, 初六과 정응이고 유순한 자리에 있어 머물 곳과 밑천을 얻는다. 다만 六二처럼 숙소(次)가 아니라 그저 머물 곳(處)일 뿐이고, 얻은 것에 도끼가 끼어 있어 언제든 몸을 지켜야 하는 처지다. 그래서 얻고도 마음이 편치 않다 — 길흉 대신 심상만 둔 이유다.",3],["음이 양자리라 不正이고 九四를 올라타며 六二와도 같은 음이라 無應이지만, 得中했고 밝은 離의 한가운데라 旅괘에서 가장 좋게 끝난다. 꿩을 쏘면서 화살 하나를 잃는다는 것은 작은 것을 내주고 큰 것을 얻는다는 뜻 — 나그네가 재물을 아끼지 않고 예를 차리니 그 때문에 이름과 벼슬을 얻는다.",3],["나그네의 맨 끝에서 가장 높은 데까지 올라간 자리다. 남의 땅에서 높이 올라가면 기댈 곳을 잃으니, 새가 제 둥지를 태우는 꼴이다. 자리가 不正이고 九三과도 敵應이라 의지할 데가 없다. 먼저 웃다 나중에 울부짖는 것은 同人 九五와 정반대 순서이며, 大壯 六五가 양을 잃고도 무탈했던 것과 달리 여기선 소를 잃고 凶이다.",3]],"57":[["巽은 바람이 겹친 괘로 들어감(入)과 순함을 뜻한다. 그런데 순함이 지나치면 주변 없이 엎드리는 것이 되므로, 여섯 효가 대체로 지나친 순함을 경계한다. 初六은 두 바람의 맨 아래 음효로 본질적으로 유약한 자리라, 나아갈지 물러날지 정하지 못한다. 그래서 오히려 무인처럼 단호한 곧음이 이롭다고 한다 — 모자란 것을 반대 성질로 돕는 드문 처방이다.",3],["양이 음자리라 不正이고 九五와도 敵應인데, 得中한 덕으로 吉을 얻는다. 평상 아래까지 엎드린다는 것은 지나친 순함이라 본래 흠인데, 사관과 무당처럼 정성으로 드러내면 허물이 사라진다. 지나친 자세를 속이 비었는지 찼는지로 가른 자리로, 같은 구절을 쓰는 上九가 凶인 것과 정확히 갈린다.",3],["양이 양자리라 正하나 中이 없고, 아래 巽의 끝이자 위 巽의 문턱이라 바람을 앞뒤로 맞는다. 강한 양이 수그리지 못하고 순종하려 하니, 본성과 어긋나 엎드렸다 일어섰다 한다. 復 六三의 頻復과 같은 頻 자를 쓰는데, 둘 다 되풀이가 부끄러움(吝)으로 매겨진 짝이다.",3],["음이 음자리라 正하고 바로 위 九五를 섬기니, 순함이 제자리를 얻은 유일한 음효다. 아래로 九三을 올라타고 初六과도 같은 음이라 無應이니 본래 悔가 있을 자리인데, 바른 처신으로 그것을 지운다. 세 가지 사냥감은 제사·손님접대·부업에 쓰는 세 등급을 말하니, 순하되 엎드리지 않으면 공이 두루 미친다는 뜻이다.",3],["中正한 양이 巽괘의 주재자다. 九二와 敵應이라 받쳐줄 신하가 없으니 처음은 없고(无初), 순함으로 끌고 가니 끝이 있다(有終). 경일 전후 사흘은 蠱 괘사의 先甲三日과 짝을 이루는 구절로, 庚은 고치는 때를 뜻하니 바꾸기 전에 사흘을 살피고 바꾼 뒤에 사흘을 살피라는 뜻이다. 순함은 서두르지 않는 데서 힘을 얻는다.",3],["순함이 극에 이른 자리다. 九二와 같은 巽在床下 구절을 쓰는데 결과는 정반대다 — 저쪽은 得中하여 속이 찼다면, 이쪽은 不正한 데다 극에 있어 엎드리는 것만 남았기 때문이다. 노잣돈과 도끼를 잃는다는 것은 살 밑천과 지킬 수단을 다 잃었다는 뜻 — 旅 九四가 그 둘을 얻었던 것과 정확히 뒤집힌 짝이다.",3]],"58":[["兌는 기쁨이 겹친 괘로 巽을 뒤집은 종괘다. 여섯 효가 모두 어떤 기쁨인가를 한 글자로 붙여 구분한다 — 和·孚·來·商·剝·引이 그것이다. 初九는 맨 아래라 아직 기뻐할 상대가 없고 九四와도 敵應이라 얽힌 데가 없다. 자리가 正하고 사사로이 붙을 곳이 없으니 순수한 화합의 기쁨이라 吉이다. 기쁨은 대상이 없을 때 가장 깨끗하다는 역설이다.",3],["양이 음자리라 不正이고 바로 위에 六三이라는 사사로운 기쁨이 붙어 있으니 본래 悔가 있을 자리다. 그것을 지우는 것이 孚(믿음) — 得中하여 속이 차 있으면 곁의 유혹에 끌려가지 않는다. 기쁨이 밖에서 오는 것이 아니라 안에서 나와야 길하다는 것이, 兌괘의 기준선이다.",3],["음유가 부중부정한 데다 아래로 九二를 올라타고 上六과도 같은 음이라 無應이다. 제 짝이 없으니 아래로 내려와 사람을 기쁘게 하려 한다(來兌) — 기쁨이 안에서 나오는 것이 아니라 밖으로 만들어진 것이다. 어느 괘에서나 아래로 내려가는 것은 모양이 상하는데, 거기다 아랫사람을 기쁘게 하려 하니 凶이다. 兌괘에서 유일하게 凶이 붙은 자리다.",3],["임금 바로 아래에 있으면서 아래로는 六三이라는 사사로운 기쁨이 붙어 있다. 양이 음자리라 不正이고 初九와도 敵應이라, 어느 쪽 기쁨을 택할지 저울질하며 편치 못하다(商兌未寧). 해답은 경계를 그어 병든 쪽을 끊는 것 — 兌괘에서 유일하게 갈등을 정면으로 다룬 효로, 길흉 대신 조건만 둔 이유다.",3],["中正한 양이 임금 자리인데도 厲가 붙은 것은, 바로 위 上六이 양을 깎아내는 음(剝)이기 때문이다. 九二와도 敵應이라 아래에 당길 사람이 없으니, 가까운 음에게 기쁨을 얻으려 한다. 자리가 아무리 바르더라도 믿는 대상을 잘못 고르면 위태롭다는, 兌괘에서 가장 날카로운 경고다.",3],["기쁨이 극에 이른 자리다. 六三과 같은 음이라 無應이고 아래로 九五를 올라타고 있으니, 제 짝 없이 아래의 양을 끌어당겨 기뻐하게 한다. 六三이 아래로 내려가 만들었다면 이쪽은 위에서 끌어올리는 것이다. 두 글자뿐인 데다 길흉을 달지 않은 것이 묘미인데, 끌려가는 쪽(九五)이 이미 厲를 받았으니 그로써 판정이 끝난 것이다.",3]],"59":[["渙은 흩어짐의 괘 — 물(坎) 위에 바람(巽)이 불어 흩어지는 상이다. 흩어진 것을 다시 모으는 것이 이 괘의 과제다. 初六은 흩어짐의 맨 처음이라 아직 상태가 얇은데, 음유라 혼자는 힘이 없고 六四와도 같은 음이라 無應이다. 그럼에도 吉인 것은 바로 위 九二를 承하여 그 건장한 힘을 빌리기 때문이다. 明夷 六二와 같은 拯馬壯 구절을 쓰는데, 둘 다 번지기 전에 빨리 손쓰는 것이 핵심이다.",3],["양이 음자리라 不正이고 九五와도 敵應이라 본래 悔가 있을 자리다. 게다가 험(坎)의 한가운데라 흩어지기 쉬운데, 得中했기에 기대어 잡힐 것을 찾아 달려간다. 机(기대는 데)는 바로 아래 初六을 가리키니, 흩어질 때는 먼 호응보다 가까이 붙은 자리가 버팀목이 된다는 뜻이다.",3],["음유가 부중부정하고 아래로 九二를 올라타 자리가 불안하다. 그러나 上九와 정응이라 밖으로 부르는 손이 있다. 渙괘에서 흩트리는 대상이 매번 달라지는데, 이 효만은 제 몸을 흩트린다 — 사사로운 자기를 흩어 밖을 따른다는 뜻이다. 그래서 조건은 나쁜데 无悔가 된다.",3],["음이 음자리라 正하고 바로 위 九五를 承하니, 임금을 도와 흩어진 것을 다시 묶는 자리다. 흩트리는 대상이 무리(群)라는 것이 핵심 — 패를 지어 모인 작은 무리를 흩어야 더 큰 무리(丘, 언덕)가 이뤄진다는 뜻이다. 無應인데도 元吉인 근거가 여기 있고, 보통 생각으로는 닿지 않는다고 붙인 것도 그 역설 때문이다.",3],["中正한 양이 흩어진 것을 다시 모으는 주재자다. 땀은 한번 나오면 다시 들어가지 않으니, 큰 호령을 땀처럼 내려 되돌리지 않는다는 뜻이다. 둘째는 왕이 쌓아둔 것을 흩는 것 — 임금이 제 곳간을 풀어 나누어야 사람이 모인다는 뜻이다. 九二와 敵應이라 吉까지는 못 가고 无咎에서 멈춘다.",3],["흩어짐의 마지막 자리다. 피(血)는 상함을 뜻하니, 흩트리는 대상이 상처다 — 다칠 위험을 멀리 치워 벗어난다는 뜻이다. 자리는 不正이지만 六三과 정응이라 그를 험(坎)에서 끌어낸다. 小畜 上九·需 上六과 같은 血 자를 쓰는데, 여기선 벗어남으로 끝난다. 흩어지는 괘의 마무리가 상처를 흩는 것이라는 점이 구조적으로 정확하다.",3]],"60":[["節은 마디를 짓는 괘 — 못(兌)이 담을 수 있는 물(坎)은 한정되어 있으니 새는 것을 막아야 한다는 뜻이다. 初九와 九二가 거의 같은 구절로 无咎와 凶으로 갈리는 것이 이 괘의 백미다. 初九는 맨 아래라 아직 나설 때가 아니고, 九二와 六三에 가로막혀 길도 막혀 있다. 그럴 때 문 안에 머무는 것은 절제이지 겁내는 것이 아니므로 허물이 없다.",3],["初九와 거의 같은 구절인데 판정이 정반대다. 初九는 맨 아래라 머무는 것이 옳지만, 九二는 得中하여 이미 나설 때를 얻은 자리다. 바로 위 六三이 음유하여 길이 열려 있는데도 대문을 안 나가니, 절제가 아니라 때를 놓치는 것이라 凶이다. 같은 행동이 때에 따라 절제가 되기도 하고 겁내기가 되기도 한다는, 節괘의 핵심 대목이다.",3],["음유가 부중부정한 데다 아래로 九二를 올라타고 上六과도 같은 음이라 無應이다. 게다가 아래 兌(기쁨)의 끝이라 기뻐하기만 하고 마디를 짓지 못한다. 그러면 뒤에 탄식하게 된다. 허물이 없다고 한 것은 면죄부가 아니라 남 탓할 곳이 없다는 뜻 — 제가 불러들인 일이므로 원망할 대상이 없다는 말이다.",3],["음이 음자리라 正하고 바로 위 九五를 承하며 아래 初九와 정응이니, 위아래가 다 맞는 자리다. 그래서 억지로 참는 것이 아니라 편안하게 마디를 짓는다(安節). 上六의 쓴 절제(苦節)와 정확히 대조되는 짝이다. 판정어 대신 亨만 둔 것은, 절제가 무리 없을 때는 그저 통할 뿐 따로 큰 공이 있는 것은 아니기 때문이다.",3],["中正한 양이 節괘의 주재자다. 九二와 敵應이라 도울 손은 없지만, 得中했기에 절제가 지나치지도 모자라지도 않아 달다(甘). 자기에게 먼저 적용하기에 남도 따르므로 가면 상찬이 있다. 上六의 쓴 절제와 한 쌍을 이루며, 달다·쓰다는 맛으로 절제의 성패를 갈라 둔 것이 이 괘의 모티프다.",3],["절제가 극에 이른 자리다. 자리는 正하나 六三과 같은 음이라 無應이고 아래로 九五를 올라타 무리하게 버틴다. 그래서 九五의 단 절제와 달리 쓴 절제(苦節)가 되고, 곧게 해도 凶이다. 다만 悔亡을 붙인 것이 묘미인데 — 지나친 절제는 흠이지만 방향은 바른 것이라 뒤따르는 뉘우침은 없기 때문이다.",3]],"61":[["中孚는 속이 믿음으로 차 있는 괘로, 가운데 두 효가 비고 위아래가 양으로 둘러싼 모양이 알을 품은 상이다. 初九는 믿음의 첫 자리라 누구를 믿을지 정하는 단계다. 자리가 正하고 六四와 정응이니 대상은 정해져 있는데, 미리 헤아려 정해야(虞) 길하다. 한번 정한 뒤에 따로 다른 마음을 두면 편치 못하니, 믿음은 둘로 나누면 이미 믿음이 아니다.",3],["得中한 양이라 속이 차 있는 자리다. 학이 그늘진 곳에서 울어도 새끼가 답한다는 것은, 믿음은 보이지 않는 데서도 통한다는 뜻이다. 九五와 敵應인데도 서로 통하는 것이 이 효의 핵심 — 中孚에서는 應의 형식보다 속의 진실이 앞서기 때문이다. 繫辭傳이 이 효를 끌어 말과 행동이 군자의 추기라고 한다.",3],["가운데 빈 두 음 중 아래쪽으로, 음유가 부중부정한 데다 아래로 九二를 올라타 자리가 불안하다. 上九와 정응이라 짝은 있으나, 그 짝에게 마음을 모두 맡겨버려 제 중심이 없다. 그래서 북을 치다 그치다, 울다 노래하다 한다. 믿음이 안에서 나오지 않고 밖에 매달리면 이런다는 것을, 길흉 없이 네 가지 모습으로만 보인다.",3],["가운데 빈 두 음 중 위쪽으로, 음이 음자리라 正하고 바로 위 九五를 承한다. 달이 거의 보름이라는 것은 꽉 차지 않은 데서 멈춰 임금을 넘보지 않는다는 뜻이다. 말의 짝이 없어진다는 것은 정응인 初九와의 줄을 끊고 오직 위만 바라본다는 뜻 — 믿음은 둘로 나누면 안 된다는 初九의 말이 여기서 행동으로 나타난다.",3],["中正한 양이 中孚의 주재자다. 攣(어울려 매임)은 임금의 믿음이 온 나라를 한 줄로 엮어매듯 묶는다는 뜻이다. 다만 吉이 아니라 无咎에 멈춘 것은, 九二와 敵應이라 받쳐줄 신하가 없어 혼자 묶고 있기 때문이다. 믿음은 임금 혼자의 힘으로는 완성되지 않는다는 절제된 판단이다.",3],["믿음이 극에 이른 자리다. 翰音은 닭 울음으로, 닭은 몸은 땅에 있고 소리만 하늘로 올라가는 새다. 속은 따르지 못하는데 말만 높이 올라간다는 뜻이다. 자리가 不正이고 극에 있으니 곧게 해도 凶이다. 九二의 학이 그늘진 데서 울어도 통했던 것과 정확히 반대로, 소리만 높은 믿음은 믿음이 아니라는 결론이다.",3]],"62":[["小過는 작게 지나침의 괘로, 가운데 두 양을 음 넷이 감싸 날개 펼친 새의 모양이다. 괘사가 새는 내려야 길하고 올라가면 흉하다고 했으니, 지나침은 겸손 쪽으로만 허용된다. 初六은 맨 아래라 머물러야 할 자리인데, 九四와 정응이라고 그것만 믿고 날아올라간다. 지나침이 허용되는 방향을 거꾸로 가니 단 네 글자로 凶이 난다.",3],["中正한 음이나 六五와 같은 음이라 無應이다. 위로 올라가려 해도 임금에게는 닿지 못하고, 대신 같은 음인 할머니와 신하를 만난다 — 양(祖·君)을 지나쳐 음(妣·臣)에게 머무는 것이다. 그것이 바로 小過가 허용하는 지나침이니 허물이 없다. 無應이 흠이 아니라 순리가 되는, 이 괘 특유의 역설이다.",3],["음이 많은 때에 양이 자리를 正하게 얻은 두 효 중 아래쪽이다. 자리가 바르다는 것을 믿고 경계를 지나치게 하지 않는 것이 함정이다 — 小過에서는 지나치게 조심하는 것이 맞는 때이기 때문이다. 上六과 정응이라 거기에 마음을 놓는데, 그 上六은 날아가다 재앙을 만나는 효라 믿었다가 도리어 해를 입는다.",3],["양이 음자리라 不正인데, 小過에서는 그것이 오히려 다행이다 — 음이 주인인 때에 강함을 한 급 낮추고 있는 꼴이기 때문이다. 그래서 효사가 无咎로 시작한다. 지나치지 않고 알맞게 만난다는 것은 初六과의 정응을 과하게 밀어붙이지 않는다는 뜻. 가면 위태롭고, 오래 고집하지 말라는 것이 마지막 단서다.",3],["음이 임금 자리에 있어 不正이고 六二와도 같은 음이라 無應이다. 음이 넘치는데 양이 맞받아 주지 않으니 구름만 빽빽하고 비는 오지 않는다 — 小畜 괘사와 같은 구절을 쓴다. 그래서 멀리 잡지 못하고 굴 안의 가까운 것(六二)을 주살로 잡는다. 큰 일은 못 하고 작은 일만 하는 것이 小過의 임금이라, 길흉을 달지 않았다.",3],["지나침이 극에 이른 자리다. 자리는 正하고 九三과 정응이지만, 음유가 괘의 맨 끝에서 내려오지 않고 더 높이 날아오른다. 初六이 올라가다 凶했던 것을 끝에서 한번 더 반복하는데, 여기선 그물에까지 걸린다. 밖에서 온 화가 아니라 제가 불러들인 것이므로 재앙(災眚)이라 부른다.",3]],"63":[["既濟는 이미 건넌 괘로, 64괘 중 유일하게 여섯 효가 모두 正위를 얻고 세 쌍이 모두 정응인 완전한 구조다. 그런데 바로 그러기에 더 좋아질 여지가 없어, 여섯 효가 한결같이 기울어짐을 경계한다. 初九는 막 건너기 시작한 자리라 바퀴를 끌고 꼬리를 적신다 — 스스로 속도를 늦추어 나아가지 않는 것이다. 이미 이뤄진 때의 첫 수는 멈추는 것임을 보여준다.",3],["中正한 음이 中正한 九五와 정응 — 조건은 나무랄 데 없는데도 잃는 장면이 나온다. 이미 다 이뤄진 때에는 얻는 일보다 잃는 일이 먼저기 때문이다. 가리개를 잃었다는 것은 나설 수단을 잃었다는 뜻이다. 해답은 쫓지 않는 것 — 中正을 지키면 일곱 날 뒤에 저절로 돌아온다. 震 六二와 같은 勿逐七日得 구절이다.",3],["아래 離의 끝이자 위 坎(험)으로 넘어가는 문턱이라, 이미 건넌 뒤에도 밖을 치는 일이 남은 자리다. 자리는 正하나 中이 없어 무리하기 쉬운데, 세 해나 걸려서야 이긴다는 것이 그 무게를 말해준다. 既濟 뒤의 정벌은 이기더라도 소모가 크다는 뜻이며, 그럴수록 사람을 가려 써야 한다는 단서로 끝난다.",3],["위 坎(물)에 발을 들여놓은 첫 자리다. 음이 음자리라 正하고 初九와 정응이지만, 이미 건넌 배에도 물이 새기 시작하는 때다. 그래서 미리 헌 옷을 준비해 두고 하루 종일 경계한다. 길흉을 달지 않은 것이 핵심인데, 경계는 결과가 아니라 상태이기 때문이다. 既濟에서 가장 실무적인 처방이다.",3],["中正한 양이 임금 자리인데 길흉이 없다. 동쪽 이웃은 이미 성한 쪽(九五)이고 서쪽 이웃은 아직 미흡한 쪽(六二)이다. 소를 잡는 큰 제사가 간략한 봄제사만 못하다는 것은, 이미 다 이룬 쪽은 형식이 커도 속이 식고 아직 모자란 쪽은 정성이 살아 있기 때문이다. 既濟의 임금이 가장 받기 어려운 경고다.",3],["다 건너고 난 끝자리다. 初九는 꼬리를 적셔도 허물이 없었는데, 여기선 머리를 적신다 — 꼬리는 뒤에 남은 것이지만 머리는 이미 다 건너고도 다시 물에 빠지는 것이다. 자리는 正하고 九三과 정응이지만 음유가 괘의 끝에서 위험에 다시 머리를 들이므로 厲다. 완성된 구조가 결국 기울어진다는 증거로 괘가 마무리된다.",3]],"64":[["未濟는 아직 건너지 못한 괘로, 64괘의 마지막이다. 既濟와 정반대로 여섯 효가 모두 不正이면서도 세 쌍은 모두 정응이다 — 자리는 하나도 맞지 않는데 호응은 다 살아 있는 것이다. 그래서 오히려 앞으로 나아갈 여지가 남아 역이 이 괘로 끝난다. 初六은 맨 아래에서 제 분수를 모르고 건너려다 꼬리를 적신다. 既濟 初九는 스스로 늦춰 꼬리를 적셔 无咎였는데, 이쪽은 몰라서 적신 것이라 부끄러움이 된다.",3],["양이 음자리라 不正이지만 得中했고 六五와 정응이다. 既濟 初九와 같은 曳其輪 구절을 쓰는데 위치가 다르다 — 저쪽은 다 건너고 늦추는 것이고 이쪽은 아직 못 건넌 채 자제하는 것이다. 험(坎)의 한가운데에서 바퀴를 끌어 서두르지 않으니 吉이다. 아직 이루지 못한 때에는 삼가면서 기다리는 것이 법임을 보여준다.",3],["음유가 부중부정한 데다 아래로 九二를 올라타고 있으니, 제 힘으로 나서면 凶이다. 그런데 바로 뒤에 큰 내를 건너는 것이 이롭다고 붙어 앞뒤가 어긋나 보이는데, 上九와 정응이라 그에게 기대면 건널 수 있기 때문이다. 아래 坎의 끝에서 막 물을 벗어나려는 자리라, 혼자 가면 凶이고 붙어서 가면 건넌다는 조건문이다.",3],["아래 坎(험)을 벗어나 위 離(밝음)로 올라선 첫 자리다. 양이 음자리라 不正이라 본래 悔가 있을 자리인데, 곧게 하면 지워진다. 既濟 九三과 같은 伐鬼方 구절을 쓰는데 결말이 다르다 — 저쪽은 이기고도 소인을 경계하는 데 그치고, 이쪽은 상을 받는다. 이미 이룬 때의 정벌은 소모일 뿐이지만, 아직 이루지 못한 때의 정벌은 공이 된다.",3],["음이 양자리라 不正이지만 得中했고 九二와 정응이며 밝은 離의 한가운데다. 그래서 未濟에서 가장 좋은 자리이며, 吉이 두 번 나오는 유일한 효다. 자리가 다 어긋난 괘에서도 中과 밝음과 믿음이 있으면 군자의 빛이 난다는 뜻 — 既濟의 완전한 中正한 임금(九五)이 길흉 없이 경고만 받았던 것과 정확히 대조된다.",3],["64괘 384효의 마지막 자리다. 아직 건너지 못했으니 끝까지 기다리며 믿음으로 술을 마신다 — 느긋하게 때를 기다리는 것이라 허물이 없다. 그러나 지나쳐 머리까지 적신다면 믿음이 있어도 옳음을 잃는다. 既濟 上六의 濡其首가 이미 건넌 뒤의 추락이라면, 이쪽은 아직 끝나지 않은 채로 다시 시작으로 열려 있다 — 역이 완성이 아니라 미완으로 끝나는 이유다.",3]]};
/* 궁리노트에 쓰인 술어 풀이.
   호버 툴팁은 모바일에서 죽으므로, 그 노트에 실제로 나온 말만 골라
   노트 아래에 붙인다. 원문은 그대로 두고 문턱만 낮추는 방식. */
const TERMS = [
  ['中正','가운데 자리이면서 효의 음양도 자리와 맞음 — 가장 단단한 조건'],
  ['得中','상·하괘의 가운데(二·五)에 자리함 — 치우치지 않음'],
  ['得位','효의 음양이 자리의 음양과 맞음'],
  ['得正','효의 음양이 자리의 음양과 맞음'],
  ['位正','효의 음양이 자리의 음양과 맞음'],
  ['不正','효의 음양이 자리와 어긋남 (初·三·五는 양자리, 二·四·上은 음자리)'],
  ['不中','가운데 자리(二·五)가 아님'],
  ['부중','가운데 자리(二·五)가 아님'],
  ['正應','짝하는 효(初四·二五·三上)와 음양이 맞물려 서로 응함'],
  ['정응','짝하는 효(初四·二五·三上)와 음양이 맞물려 서로 응함'],
  ['敵應','짝이 둘 다 양이라 응하지 못하고 맞섬'],
  ['無應','짝이 둘 다 음이라 응할 상대가 없음'],
  ['무응','짝이 둘 다 음이라 응할 상대가 없음'],
  ['乘剛','음효가 양효 위에 올라탐 — 순서를 거스르는 자리'],
  ['承','음효가 바로 위 양효를 아래에서 받듦'],
  ['君位','다섯째 효 — 판을 실제로 움직이는 자리'],
  ['主爻','그 괘의 뜻을 대표하는 효'],
  ['過剛','굳셈이 지나침'],
  ['음유','음효의 부드럽고 약한 성질'],
  ['양강','양효의 굳세고 강한 성질'],
  ['물극필반','끝까지 가면 반드시 되돌아옴']
];
/* 노트에 등장한 술어만, 나온 순서대로. 같은 풀이는 한 번만. */
function termsIn(text){
  var seen={}, out=[];
  TERMS.forEach(function(t){
    var at=text.indexOf(t[0]);
    if(at<0 || seen[t[1]]) return;
    seen[t[1]]=1;
    out.push({w:t[0], d:t[1], at:at});
  });
  out.sort(function(a,b){ return a.at-b.at; });
  return out.slice(0,5);
}

/* 받침 유무에 따른 조사 — 괘 이름이 문장에 박히므로 필요 */
function batchim(w){
  var c=w.charCodeAt(w.length-1)-0xAC00;
  return (c>=0 && c<11172) ? (c%28) : 0;
}

var ans=[null,null,null,null,null,null], stage=null, cardKey=null;

/* 1단계 — 상황 카드. 목록은 하나다.
   상황을 적으면 겹치는 카드를 맨 위 그룹으로 끌어올리고, 아래 원래 그룹에서는 뺀다.
   같은 카드가 두 군데 보이지 않게. */
function cardBtn(c, withGroup){
  return '<button data-k="'+c.k+'"'+(c.k===cardKey?' class="on"':'')+'>'+
    '<b>'+c.name+'</b><span>'+(withGroup?c.g+' · ':'')+c.desc+'</span></button>';
}
function renderCards(hits){
  hits = hits || [];
  var up = hits.map(function(c){ return c.k; }), html='';
  if(hits.length){
    html += '<div class="cardgrp match">적어주신 말과 가까운 것</div><div class="qset-grid">'+
            hits.map(function(c){ return cardBtn(c, true); }).join('')+'</div>';
  }
  var g=null;
  QSETS.cards.forEach(function(c){
    if(up.indexOf(c.k)>=0) return;
    if(c.g!==g){ if(g!==null) html+='</div>'; html+='<div class="cardgrp">'+c.g+'</div><div class="qset-grid">'; g=c.g; }
    html += cardBtn(c, false);
  });
  if(g!==null) html+='</div>';
  document.getElementById('qSet').innerHTML = html;
}
renderCards();

function pickCard(k){
  cardKey=k;
  document.querySelectorAll('#qSet button').forEach(function(b){
    b.classList.toggle('on', b.dataset.k===k); });
  document.getElementById('next').disabled=false;
}
document.getElementById('qSet').addEventListener('click',function(e){
  var btn=e.target.closest('button'); if(btn) pickCard(btn.dataset.k);
});

/* 상황 한 줄에서 카드를 추천한다.
   여섯 축 답을 추론하는 게 아니라 카드만 고르는 일이라, 틀려도 아래 목록에서 다시 고르면 그만이다. */
function suggest(text){
  var t=(text||'').replace(/\s/g,'');
  if(t.length<2) return [];
  return QSETS.cards.map(function(c){
      return {c:c, n:(c.kw||[]).filter(function(k){return t.indexOf(k)>=0}).length};
    }).filter(function(x){return x.n>0})
    .sort(function(a,b){return b.n-a.n}).slice(0,3).map(function(x){return x.c});
}
document.getElementById('title').addEventListener('input',function(){
  renderCards(suggest(this.value));
});

document.getElementById('next').onclick = function(){ toStep2(); };
document.getElementById('back').onclick = function(){
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step1').classList.remove('hidden');
  scrollTo(0,0);
};

/* 2단계 — 고른 세트의 문장으로 여섯 효를 깐다. 축(初~上)은 세트와 무관하게 고정. */
function renderQ(host,list,off){
  host.innerHTML = list.map(function(q,k){
    return '<div class="q"><div class="yao">'+q.y+'</div><div class="txt">'+q.t+'</div>'+
     '<div class="opts" data-i="'+(off+k)+'">'+
     '<button data-v="1">'+q.a+'</button><button data-v="0">'+q.b+'</button></div>'+
     '<div class="hint">'+q.h+'</div></div>';
  }).join('');
  host.querySelectorAll('.opts').forEach(function(box){
    box.addEventListener('click',function(e){
      var btn=e.target.closest('button'); if(!btn) return;
      box.querySelectorAll('button').forEach(function(b){b.classList.remove('on')});
      btn.classList.add('on'); ans[+box.dataset.i]=+btn.dataset.v; check();
    });
  });
}
function toStep2(){
  var s=QS(), c=CARD();
  ans=[null,null,null,null,null,null]; stage=null;
  document.getElementById('askLabel').textContent=c.g;
  document.getElementById('askTitle').textContent=c.name;
  renderQ(document.getElementById('qLower'),s.L,0);
  renderQ(document.getElementById('qUpper'),s.U,3);
  document.querySelectorAll('#qStage button').forEach(function(b){b.classList.remove('on')});
  check();
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
  scrollTo(0,0);
}

document.getElementById('qStage').innerHTML = STAGES.map(function(s,k){
  return '<button data-s="'+k+'"><b>'+s.s+'</b>'+s.n+'</button>';
}).join('');
document.getElementById('qStage').addEventListener('click',function(e){
  var btn=e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#qStage button').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on'); stage=+btn.dataset.s; check();
});
function check(){
  document.getElementById('go').disabled =
    ans.some(function(v){return v===null}) || stage===null;
}
document.getElementById('go').onclick = function(){ run(); };

function run(){
  var y=ans.slice(), b=bin(y), h=BYBIN[b], i=stage;
  var up=upper3(b), lo=lower3(b);
  var J=judge(y,i);
  var jb=jiGua(y,i), zb=jongGua(y), cb=chakGua(y), hb=hoGua(y);
  var nx=BYNUM[h.n===64?1:h.n+1];
  var yao   = YAO[h.n] ? YAO[h.n][i] : null;          // [효사원문, 직역, 판정어]
  var vKey  = yao ? verdictFromYao(yao[2]) : null;    // 효사에 점사어가 있으면 그쪽이 우선
  var V     = vKey ? VERDICT[vKey] : {n:J.label, c:J.cls};
  var G     = guaOf(b);                                // 본괘 상황 서술 [라벨, 서술]
  var nRow  = NOTE[h.n] ? NOTE[h.n][i] : null;         // [궁리노트, 궁리등급]
  var note  = nRow ? nRow[0] : null;
  var gr    = nRow ? GRADE[nRow[1]] : null;
  var title = document.getElementById('title').value.trim() || '이름 없는 상황';

  var R=document.getElementById('result');
  R.innerHTML =
  '<div class="card hero">'+
    '<div class="sec-label">① 지 금  판</div>'+
    '<div class="guarow">'+guaSVG(y,i)+
      '<div><div class="num">제 '+h.n+' 괘</div>'+
        '<h2 class="name">'+h.ko+' <span style="font-size:15px;color:var(--gold)">'+h.hj+'</span></h2>'+
        (G?'<div class="gtag">'+G[0]+'</div>':'')+
        '<div class="struct">위 '+TRI[up].sym+' '+TRI[up].ko+'('+TRI[up].im+') · 아래 '+TRI[lo].sym+' '+TRI[lo].ko+'('+TRI[lo].im+')</div>'+
      '</div></div>'+
    (G?'<p class="gdesc">'+G[1]+'</p>':'')+
    '<div class="grid2" style="margin-top:16px">'+
      '<div class="mini" style="background:#fff"><h4>바깥 판 — '+UPPER[up].t+'</h4><p class="why" style="margin:0">'+UPPER[up].d+'</p></div>'+
      '<div class="mini" style="background:#fff"><h4>내 기반 — '+LOWER[lo].t+'</h4><p class="why" style="margin:0">'+LOWER[lo].d+'</p></div>'+
    '</div></div>'+

  '<div class="card">'+
    '<div class="sec-label">② 국 면 &nbsp;·&nbsp; '+POSGRAM[i].n+'爻 · '+STAGES[i].n+'</div>'+
    '<span class="verdict '+V.c+'">'+V.n+'</span>'+
    (yao && yao[2] ? '<span class="pansa">'+yao[2].split(' ').join(' · ')+'</span>' : '')+
    '<span class="tag" style="margin-left:8px">'+J.reason+'</span>'+
    (yao ? '<div class="yaotext">'+yao[0]+'<span class="tr">'+yao[1]+'</span></div>' : '')+
    '<div class="evi">'+
      (vKey
        ? '이 효에 <b>점사어가 명시</b>되어 판정은 효사에서 왔습니다. 참고로 같은 자리 조건 16효는 — '
        : '이 효에는 점사어가 없어 <b>같은 자리 조건 16효</b>의 분포로 읽습니다 — ')+
      '吉 '+J.cell.g+' · 无咎 '+J.cell.o+' · 悔吝厲 '+J.cell.c+' · 凶 '+J.cell.b+
      (J.cell.n?' <span style="opacity:.6">(점사어 없음 '+J.cell.n+')</span>':'')+'</div>'+
    (vKey==='split'
      ? '<p style="margin:10px 0 0;font-size:14px"><b>조건에 따라 갈리는 자리입니다.</b> '+
        '효사가 길과 흉을 함께 말합니다 — 무엇을 어떻게 하느냐가 결과를 가릅니다.</p>' : '')+
    (note
      ? '<div class="gungli"><span class="ghead">왜 이렇게 읽나'+
          (gr?'<b class="grade g'+nRow[1]+'" title="'+gr.d+'">'+gr.s+' '+gr.n+'</b>':'')+
        '</span>'+note+
        (gr?'<span class="gnote">'+gr.d+'</span>':'')+
        (function(){
          var ts=termsIn(note);
          return ts.length
            ? '<span class="terms">'+ts.map(function(t){
                return '<b>'+t.w+'</b> '+t.d; }).join('<i>·</i>')+'</span>'
            : '';
        })()+'</div>'+
        '<p class="posline">'+POSGRAM[i].n+'爻 — '+POSGRAM[i].g+'</p>'
      : '<p style="margin:10px 0 0;font-size:14px">'+POSGRAM[i].g+'</p>'+
        '<p style="margin:6px 0 0;font-size:14px;color:var(--mute)">'+
          (J.jung?'이 자리는 <b>가운데</b>를 얻어 치우치지 않습니다. ':'')+
          (J.eung?'짝하는 효와 <b>응(應)</b>이 서 있어 밖에서 받쳐주는 손이 있습니다.'
                 :'짝하는 효와 <b>응이 없어</b> 혼자 감당해야 하는 국면입니다.')+
          (J.jeong?'':' 자리와 성질이 어긋나(不正) 무리가 따릅니다.')+
        '</p>')+
    '</div>'+

  '<div class="card">'+
    '<div class="sec-label">③ 속 사 정 &nbsp;·&nbsp; 互卦</div>'+
    '<div class="guarow">'+guaSVG(toY(hb),-1)+'<div>'+
      '<h3 style="margin:0;font-size:18px;color:var(--navy)">'+labelFull(hb)+'</h3>'+
      '<p class="why" style="margin:4px 0 0">겉으로 드러난 판 아래에서 실제로 굴러가는 동력입니다. '+
      '본괘와 다르게 읽힌다면, 지금 보이는 문제가 진짜 문제가 아닙니다.</p></div></div></div>'+

  '<div class="card">'+
    '<div class="sec-label">④ 상 대 의  판 &nbsp;·&nbsp; 綜卦(도전)</div>'+
    '<div class="guarow">'+guaSVG(toY(zb),-1)+'<div>'+
      '<h3 style="margin:0;font-size:18px;color:var(--navy)">'+labelFull(zb)+'</h3>'+
      '<p class="why" style="margin:4px 0 0">같은 상황을 통째로 뒤집어 저쪽에서 본 그림입니다. '+
      '나에게 <b>'+h.ko+'</b>인 판이, 상대에게는 <b>'+BYBIN[zb].ko+'</b>'+
      (batchim(BYBIN[zb].ko)?'으로':'로')+' 보입니다.'+
      (zb===nx.b?' 이 괘는 序卦가 놓은 다음 마디와 같습니다 — 판이 저쪽으로 넘어가면서 국면이 바뀌는 자리예요.':'')+
      '</p></div></div></div>'+

  '<div class="card" style="border:1.5px solid var(--gold)">'+
    '<div class="sec-label">⑤ 이 렇 게  하 면 &nbsp;·&nbsp; 之卦</div>'+
    '<div class="guarow">'+guaSVG(toY(jb),i)+'<div>'+
      '<div class="num">'+POSGRAM[i].n+'爻 한 획을 바꾸면</div>'+
      '<h3 style="margin:2px 0 0;font-size:20px;color:var(--navy)">'+labelFull(jb)+'</h3></div></div>'+
    '<ul class="acts">'+
      '<li><b>손댈 지점:</b> '+QS().lever[i]+'</li>'+
      '<li><b>바뀌는 방향:</b> '+(y[i]?'양(陽)에서 음(陰)으로 — 밀던 것을 놓습니다.'
                                    :'음(陰)에서 양(陽)으로 — 놓았던 것을 잡습니다.')+'</li>'+
      '<li><b>도달점:</b> '+BYBIN[jb].ko+' — '+UPPER[upper3(jb)].t+' / '+LOWER[lower3(jb)].t+'</li>'+
    '</ul></div>'+

  '<div class="grid2">'+
    '<div class="card"><div class="sec-label">⑥ 다 음  국 면 · 序卦</div>'+
      '<h3 style="margin:0;font-size:17px;color:var(--navy)">'+labelFull(nx.b)+'</h3>'+
      '<p class="why">序卦傳이 놓은 다음 마디입니다.</p></div>'+
    '<div class="card"><div class="sec-label">뒤 집 힌  판 · 錯卦</div>'+
      '<h3 style="margin:0;font-size:17px;color:var(--navy)">'+labelFull(cb)+'</h3>'+
      '<p class="why">모든 조건이 정반대였을 때. 리스크 점검용입니다.</p></div></div>'+

  '<div class="card"><div class="sec-label">궤 적</div><div class="hist" id="hist"></div></div>'+

  '<div class="note">이 도구는 앞일을 맞히지 않습니다. 지금 답하신 여섯 가지가 만드는 <b>구조</b>와, '+
   '그 구조가 통상 어디로 풀리는지를 읽습니다. 조건이 바뀌면 다시 스캔해서 괘가 어디로 옮겨갔는지 보세요.</div>'+

  '<p style="text-align:center;margin-top:20px"><button class="backbtn" onclick="location.reload()">← 다시 스캔</button></p>';

  saveTrace(title,h,i);
  document.getElementById('step2').classList.add('hidden');
  R.classList.remove('hidden');
  scrollTo(0,0);
}

function saveTrace(title,h,i){
  var k='ocst_trace';
  var all=JSON.parse(localStorage.getItem(k)||'{}');
  var arr=all[title]||[];
  arr.push({n:h.n,ko:h.ko,i:i,d:new Date().toISOString().slice(0,10)});
  all[title]=arr; localStorage.setItem(k,JSON.stringify(all));
  document.getElementById('hist').innerHTML = arr.length<2
    ? '<b>'+title+'</b> — 첫 스캔입니다. 상황이 움직인 뒤 다시 스캔하면 괘의 이동 경로가 여기 쌓입니다.'
    : '<b>'+title+'</b><br>'+arr.map(function(r){
        return r.d+' · '+r.ko+'('+STAGES[r.i].n+')'; }).join(' &nbsp;→&nbsp; ');
}
</script>
</body>
</html>
