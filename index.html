<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCST · 변화도(變化圖)</title>
<style>
:root{
  --navy:#002D62; --gold:#B8912F; --gold-lite:#FFD700;
  --ink:#1a1f2e; --mute:#6b7280; --line:#e5e7eb;
  --bg:#f8f9fa; --card:#fff;
  --yang:#002D62; --yin:#9aa4b2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px}
h1,h2,h3,.serif{font-family:"Noto Serif KR",serif;font-weight:700}
header.top{text-align:center;padding:34px 0 24px;border-bottom:1px solid var(--line);margin-bottom:26px}
/* 로고는 viewBox 비율(348:110)로 폭에 맞춰 커진다. 사파리 대비 width/height 둘 다 명시 */
header.top .logo{display:block;margin:0 auto 20px;width:min(330px,78vw);height:auto;
  aspect-ratio:348/110}
header.top .lead{margin:0 0 8px;color:var(--navy);font-size:18px;font-weight:700;line-height:1.5;
  letter-spacing:-.01em}
header.top .sub{margin:0;color:var(--mute);font-size:13px}
@media(max-width:420px){
  header.top{padding:26px 0 20px}
  header.top .lead{font-size:16px}
  header.top .sub{font-size:12px}
}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.card.hero{background:linear-gradient(135deg,#FFFCE5,#F5EFFF,#E5F0FF);border:none}
.sec-label{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin-bottom:10px}
.q{padding:14px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:none}
.q .yao{font-size:11px;color:var(--mute);letter-spacing:.1em}
.q .txt{font-size:15px;font-weight:600;margin:2px 0 10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--mute);margin-top:8px;padding-left:2px}
.opts button{flex:1;min-width:180px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);
  background:#fff;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s}
.opts button:hover{border-color:var(--navy)}
.opts button.on[data-v="1"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.opts button.on[data-v="0"]{background:#4b5563;color:#fff;border-color:#4b5563}
.stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stage-grid button{padding:12px 6px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  cursor:pointer;font-family:inherit;font-size:13px;line-height:1.4}
.stage-grid button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stage-grid button b{display:block;font-size:11px;opacity:.7;font-weight:600}

input.title{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
  font-family:inherit;font-size:15px}
.go{width:100%;padding:15px;border:none;border-radius:14px;background:var(--navy);color:#fff;
  font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:6px}
.go:disabled{background:#c7ccd4;cursor:not-allowed}

.gua{display:flex;flex-direction:column-reverse;gap:5px;width:104px;flex:none}
.gua .ln{height:11px;display:flex;gap:7px}
.gua .ln i{flex:1;border-radius:2px;background:var(--yang);display:block}
.gua .ln.yin i{background:var(--yin)}
.gua .ln.yin i:first-child{flex:.42}
.gua .ln.yin i:last-child{flex:.42}
.gua .ln.mark{outline:2px solid var(--gold-lite);outline-offset:3px;border-radius:3px}
.guarow{display:flex;gap:20px;align-items:center}

.name{font-size:24px;color:var(--navy);margin:0}
/* 괘의 상황 라벨 — ①은 큼직하게, 나머지 카드는 이름 옆에 작게 */
.gtag{margin-top:5px;font-size:15px;font-weight:700;color:var(--gold)}
.glabel{display:block;margin-top:3px;font-size:12.5px;color:var(--gold);font-weight:700}
.gdesc{margin:16px 0 0;font-size:14.5px;line-height:1.75;color:var(--ink);
  background:rgba(255,255,255,.62);border-radius:14px;padding:14px 16px}
.num{font-size:12px;color:var(--mute);letter-spacing:.1em}
.struct{font-size:14px;color:var(--mute);margin-top:6px}
.verdict{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700}
.v-ji{background:#e8f3ec;color:#1e6b40}
.v-mu{background:#eef1f6;color:#3f4a5f}
.v-ryeo{background:#fdf1e3;color:#9a5b13}
.v-hyung{background:#fbeaec;color:#9c2c3c}
.v-split{background:#efeaf7;color:#5a3f8c}
.pansa{display:inline-block;margin-left:8px;padding:3px 10px;border-radius:999px;
  border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:700}
.yaotext{font-family:"Noto Serif KR",serif;font-size:16px;color:var(--navy);
  background:#fbfaf5;border-left:3px solid var(--gold);padding:12px 16px;border-radius:0 10px 10px 0;margin:12px 0}
.yaotext .tr{display:block;margin-top:6px;font-size:14px;color:var(--mute);
  font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;line-height:1.65}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.mini{border:1px solid var(--line);border-radius:14px;padding:14px}
.mini h4{margin:0 0 4px;font-size:14px;color:var(--navy)}
.mini .why{font-size:13px;color:var(--mute);margin:0 0 8px}
.tag{font-size:11px;background:#f0f2f5;color:var(--mute);padding:2px 8px;border-radius:999px}
.evi{font-size:12.5px;color:var(--mute);background:#f7f8fa;border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;margin-top:12px}
.evi b{color:var(--navy)}
/* 궁리노트 — 이 효를 왜 그렇게 읽는지 */
.gungli{margin-top:12px;font-size:14.5px;line-height:1.8;color:var(--ink);
  background:#fbfaf5;border:1px solid #ece5cf;border-radius:14px;padding:13px 16px}
.gungli .ghead{display:block;font-size:11px;letter-spacing:.16em;color:var(--gold);
  font-weight:700;margin-bottom:6px}
.posline{margin:10px 0 0;font-size:13px;color:var(--mute)}
ul.acts{margin:8px 0 0;padding-left:18px}
ul.acts li{margin:5px 0;font-size:14px}
.hist{font-size:13px;color:var(--mute)}
.hist b{color:var(--navy)}
.note{font-size:12px;color:var(--mute);background:#f3f4f6;padding:10px 12px;border-radius:10px;margin-top:14px}
.hidden{display:none}
.backbtn{background:none;border:none;color:var(--mute);font-family:inherit;font-size:14px;cursor:pointer;padding:0}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <!-- 로고. 원(O)이 심볼이고 나머지가 CST — OMST와 같은 뼈대.
       원 안의 효 막대는 OMST와 음양을 뒤집어, 한 획이 바뀐 것으로 읽히게 했다. -->
  <svg class="logo" viewBox="0 0 348 110" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="OCST · Oriental Change Scan Tool">
    <g transform="translate(2, 12)">
      <circle cx="47" cy="45" r="45" fill="none" stroke="#002366" stroke-width="10"/>
      <path d="M47,0 A22.5,22.5 0 0,0 47,45 A22.5,22.5 0 0,1 47,90"
            fill="none" stroke="#002366" stroke-width="1.2" stroke-linecap="round"/>
      <g stroke="#002366" stroke-width="3.5" stroke-linecap="round">
        <line x1="24" y1="58" x2="30" y2="58"/>
        <line x1="37" y1="58" x2="43" y2="58"/>
        <line x1="53" y1="32" x2="80" y2="32"/>
      </g>
      <text x="105" y="68" fill="#002366" textLength="185" lengthAdjust="spacing"
            style="font-family:'Playfair Display',Georgia,serif;font-size:80px;font-weight:200;letter-spacing:12px;">CST</text>
      <text x="85" y="96" fill="#546E7A" textLength="235" lengthAdjust="spacing"
            style="font-family:Arial,Helvetica,sans-serif;font-size:7.5px;font-weight:300;letter-spacing:0.5px;">ORIENTAL CHANGE SCAN TOOL</text>
    </g>
  </svg>
  <p class="lead">지금 이 일이 어디쯤 왔고,<br>무엇을 건드리면 달라지는지</p>
  <p class="sub">주역 64괘를 점이 아니라 진단 도구로 씁니다</p>
</header>

<section id="input">
  <div class="card hero">
    <div class="sec-label">S I T U A T I O N</div>
    <input class="title" id="title" placeholder="어떤 상황인가요? (예: 개원 3년차 확장 결정)">
    <p style="font-size:13px;color:var(--mute);margin:10px 0 0">
      아래 6개는 <b>여섯 효</b>입니다. 답하시는 순간 괘가 하나로 정해집니다.</p>
  </div>

  <div class="card">
    <div class="sec-label">하괘 · 내가 딛고 선 쪽</div>
    <div id="qLower"></div>
  </div>

  <div class="card">
    <div class="sec-label">상괘 · 내가 통제 못 하는 쪽</div>
    <div id="qUpper"></div>
  </div>

  <div class="card">
    <div class="sec-label">국면 · 이 일은 어디쯤 와 있나</div>
    <div class="stage-grid" id="qStage"></div>
  </div>

  <button class="go" id="go" disabled>변화도 읽기</button>
</section>

<section id="result" class="hidden"></section>
</div>

<script>

const HEX64 = [{"b":"111111","n":1,"ko":"중천건","hj":"重天乾"},{"b":"000000","n":2,"ko":"중지곤","hj":"重地坤"},{"b":"010001","n":3,"ko":"수뢰둔","hj":"水雷屯"},{"b":"100010","n":4,"ko":"산수몽","hj":"山水蒙"},{"b":"010111","n":5,"ko":"수천수","hj":"水天需"},{"b":"111010","n":6,"ko":"천수송","hj":"天水訟"},{"b":"000010","n":7,"ko":"지수사","hj":"地水師"},{"b":"010000","n":8,"ko":"수지비","hj":"水地比"},{"b":"110111","n":9,"ko":"풍천소축","hj":"風天小畜"},{"b":"111011","n":10,"ko":"천택리","hj":"天澤履"},{"b":"000111","n":11,"ko":"지천태","hj":"地天泰"},{"b":"111000","n":12,"ko":"천지비","hj":"天地否"},{"b":"111101","n":13,"ko":"천화동인","hj":"天火同人"},{"b":"101111","n":14,"ko":"화천대유","hj":"火天大유"},{"b":"000100","n":15,"ko":"지산겸","hj":"地山謙"},{"b":"001000","n":16,"ko":"뇌지예","hj":"雷地豫"},{"b":"011001","n":17,"ko":"택뢰수","hj":"澤雷隨"},{"b":"100110","n":18,"ko":"산풍고","hj":"山風蠱"},{"b":"000011","n":19,"ko":"지택림","hj":"地澤臨"},{"b":"110000","n":20,"ko":"풍지관","hj":"風地觀"},{"b":"101001","n":21,"ko":"화뢰서합","hj":"火雷噬嗑"},{"b":"100101","n":22,"ko":"산화비","hj":"山火賁"},{"b":"100000","n":23,"ko":"산지박","hj":"山地剝"},{"b":"000001","n":24,"ko":"지뢰복","hj":"地雷復"},{"b":"111001","n":25,"ko":"천뢰무망","hj":"天雷无妄"},{"b":"100111","n":26,"ko":"산천대축","hj":"山天大畜"},{"b":"100001","n":27,"ko":"산뢰이","hj":"山雷頤"},{"b":"011110","n":28,"ko":"택풍대과","hj":"澤風大過"},{"b":"010010","n":29,"ko":"중수감","hj":"重水坎"},{"b":"101101","n":30,"ko":"중화리","hj":"重火離"},{"b":"011100","n":31,"ko":"택산함","hj":"澤山咸"},{"b":"001110","n":32,"ko":"뇌풍항","hj":"雷風恒"},{"b":"111100","n":33,"ko":"천산둔","hj":"天山遁"},{"b":"001111","n":34,"ko":"뇌천대장","hj":"雷天大壯"},{"b":"101000","n":35,"ko":"화지진","hj":"火地晉"},{"b":"000101","n":36,"ko":"지화명이","hj":"地火明夷"},{"b":"110101","n":37,"ko":"풍화가인","hj":"風火家人"},{"b":"101011","n":38,"ko":"화택규","hj":"火澤睽"},{"b":"010100","n":39,"ko":"수산건","hj":"水山蹇"},{"b":"001010","n":40,"ko":"뇌수해","hj":"雷水解"},{"b":"100011","n":41,"ko":"산택손","hj":"山澤損"},{"b":"110001","n":42,"ko":"풍뢰익","hj":"風雷益"},{"b":"011111","n":43,"ko":"택천쾌","hj":"澤天夬"},{"b":"111110","n":44,"ko":"천풍구","hj":"天風姤"},{"b":"011000","n":45,"ko":"택지췌","hj":" HEX64.forEach(function(h){ BYBIN[h.b]=h; BYNUM[h.n]=h; });

 '001':{t:'판만 술렁이고 아직 아무것도',d:'때는 나쁘지 않은데 열쇠 쥔 쪽은 미지근하고 끝도 안 보입니다. 우레처럼 기척만 먼저 온 자리예요.'},

다",""],["有命无咎, 疇離祉","천명이 있으면 허물없고, 무리가 복에 걸린다","无咎"],["休否, 大人吉, 其亡其亡, 繫于苞桑","막힘을 그치게 하니 대인이 길하고, 망할까 망할까 하며 뽕나무 뿌리에 매듯 한다","吉"],["傾否, 先否後喜","막힘을 기울여 엎으니, 먼저는 막히나 나중은 기쁘다",""]],"13":[["同人于門, 无咎","문에서 남과 함께하니, 허물없다","无咎"],["同人于宗, 吝","종족끼리 함께하니, 인색하다","吝"],["伏戎于莽, 升其高陵, 三歲不興","수풀에 군사를 매복하고 높은 언덕에 올라 엿보나, 삼 년이 되어도 일어나지 못한다",""],["乘其墉, 弗克攻, 吉","그 담에 올라타나 공격하지 못하니, 길하다","吉"],["同人, 先號咷而後笑, 大師克相遇","남과 함께하려다 먼저 울부짖고 뒤에 웃으니, 큰 군대로 이겨야 서로 만난다",""],["同人于郊, 无悔","들에서 남과 함께하니, 후회가 없다",""]],"14":[["无交害, 匪咎, 艱則无咎","해로운 사귐이 없으니 허물이 아니요, 어렵게 여기면 허물없다","无咎"],["大車以載, 有攸往, 无咎","큰 수레로 실으니, 갈 바가 있어도 허물없다","无咎"],["公用亨于天子, 小人弗克","공이 천자께 향연을 올리니, 소인은 감당하지 못한다",""],["匪其彭, 无咎","그 성함을 (과시하지) 않으니, 허물없다","无咎"],["厥孚交如, 威如, 吉","그 믿음으로 사귀고 위엄이 있으니, 길하다","吉"],["自天祐之, 吉无不利","하늘이 도우니, 길하여 이롭지 않음이 없다","吉"]],"15":[["謙謙君子, 用涉大川, 吉","겸손하고 겸손한 군자이니, 큰 내를 건너도 길하다","吉"],["鳴謙, 貞吉","겸손이 소리로 드러나니, 바르면 길하다","吉"],["勞謙, 君子有終, 吉","공로가 있어도 겸손하니, 군자가 끝맺음이 있어 길하다","吉"],["无不利, 撝謙","이롭지 않음이 없으니, 겸손을 발휘한다",""],["不富以其鄰, 利用侵伐, 无不利","부하지 않아도 이웃과 함께하니, 침벌함이 이로워 이롭지 않음이 없다",""],["鳴謙, 利用行師, 征邑國","겸손이 드러나니, 군사를 씀이 이로워 고을과 나라를 바로잡는다",""]],"16":[["鳴豫, 凶","즐거움을 드러내 떠벌리니, 흉하다","凶"],["介于石, 不終日, 貞吉","절개가 돌처럼 굳어 하루를 마치지 않으니, 바르면 길하다","吉"],["盱豫, 悔, 遲有悔","위를 쳐다보며 즐기니 후회하고, 늦으면 더 후회가 있다","悔"],["由豫, 大有得, 勿疑, 朋盍簪","즐거움이 말미암는 바이니, 크게 얻음이 있고, 의심하지 않으면 벗이 모여든다",""],["貞疾, 恒不死","바르되 병드나, 늘 앓아도 죽지는 않는다",""],["冥豫, 成有渝, 无咎","어두운 즐거움이니, 이루어졌어도 고치면 허물없다","无咎"]],"17":[["官有渝, 貞吉, 出門交有功","주관하는 바가 바뀌니 바르면 길하고, 문을 나가 사귀면 공이 있다","吉"],["係小子, 失丈夫","소자에 매이면, 장부를 잃는다",""],["係丈夫, 失小子, 隨有求得, 利居貞","장부에 매이면 소자를 잃으니, 따라서 구하면 얻으나 머물러 바름이 이롭다",""],["隨有獲, 貞凶, 有孚在道, 以明, 何咎","따름에 얻음이 있으니 바르더라도 흉하나, 믿음이 도에 있고 밝으면 무슨 허물이랴","凶"],["孚于嘉, 吉","아름다움에 믿음을 두니, 길하다","吉"],["拘係之, 乃從維之, 王用亨于西山","붙잡아 매고 또 얽어매니, 왕이 서산에서 제사를 올린다",""]],"18":[["幹父之蠱, 有子, 考无咎, 厲終吉","아버지의 일을 바로잡으니 아들이 있는 것이라, 죽은 아비가 허물없고, 위태로우나 마침내 길하다","厲 吉"],["幹母之蠱, 不可貞","어머니의 일을 바로잡되, 곧게만 밀어붙여선 안 된다",""],["幹父之蠱, 小有悔, 无大咎","아버지의 일을 바로잡되, 약간 후회는 있으나 큰 허물은 없다","悔"],["裕父之蠱, 往見吝","아버지의 일을 느슨히 하니, 가면 인색함을 본다","吝"],["幹父之蠱, 用譽","아버지의 일을 바로잡아, 명예를 얻는다",""],["不事王侯, 高尚其事","왕후를 섬기지 않고, 자기 일을 고상히 한다",""]],"19":[["咸臨, 貞吉","느낌으로 임하니, 바르면 길하다","吉"],["咸臨, 吉无不利","느낌으로 임하니, 길하여 이롭지 않음이 없다","吉"],["甘臨, 无攸利. 既憂之, 无咎","달콤하게 임하니 이로울 바 없으나, 이미 근심하면 허물없다","无攸利 无咎"],["至臨, 无咎","지극히 임하니, 허물없다","无咎"],["知臨, 大君之宜, 吉","지혜로 임하니, 대군의 마땅함이라 길하다","吉"],["敦臨, 吉无咎","도탑게 임하니, 길하고 허물없다","吉 无咎"]],"20":[["童觀, 小人无咎, 君子吝","어린아이의 봄이니, 소인은 허물없고 군자는 인색하다","无咎 吝"],["闚觀, 利女貞","엿보니, 여자의 바름에 이롭다",""],["觀我生, 進退","내 삶을 살펴, 나아갈지 물러날지 한다",""],["觀國之光, 利用賓于王","나라의 빛을 보니, 왕의 손님이 됨이 이롭다",""],["觀我生, 君子无咎","내 삶을 살피니, 군자면 허물없다","无咎"],["觀其生, 君子无咎","그 삶을 살피니, 군자면 허물없다","无咎"]],"21":[["屨校滅趾, 无咎","발에 차꼬를 채워 발꿈치를 상하나, 허물없다","无咎"],["噬膚滅鼻, 无咎","살을 씹다 코가 빠지나, 허물없다","无咎"],["噬腊肉, 遇毒, 小吝, 无咎","마른 고기를 씹다 독을 만나니, 조금 인색하나 허물없다","吝 无咎"],["噬乾胏, 得金矢, 利艱貞, 吉","뼈 붙은 마른 고기를 씹어 쇠화살을 얻으니, 어렵되 바름이 이로워 길하다","吉"],["噬乾肉, 得黃金, 貞厲, 无咎","마른 고기를 씹어 황금을 얻으니, 바르되 위태로우나 허물없다","厲 无咎"],["何校滅耳, 凶","목에 큰 칼을 써 귀를 없애니, 흉하다","凶"]],"22":[["賁其趾, 舍車而徒","그 발을 꾸미니, 수레를 버리고 걷는다",""],["賁其須","그 수염을 꾸민다",""],["賁如濡如, 永貞吉","꾸미고 윤택하니, 오래도록 바르면 길하다","吉"],["賁如皤如, 白馬翰如, 匪寇婚媾","꾸밈이 희고 흰 말이 나는 듯하니, 도적이 아니라 혼인 상대다",""],["賁于丘園, 束帛戔戔, 吝, 終吉","언덕 동산을 꾸미니 묶은 비단이 적어 인색하나, 마침내 길하다","吝 吉"],["白賁, 无咎","흰 꾸밈이니, 허물없다","无咎"]],"23":[["剝床以足, 蔑貞凶","평상을 깎되 다리부터 하니, 바름을 멸하여 흉하다","凶"],["剝床以辨, 蔑貞凶","평상을 깎되 상판 받침까지 하니, 바름을 멸하여 흉하다","凶"],["剝之无咎","깎되, 허물없다","无咎"],["剝床以膚, 凶","평상을 깎아 살갗에 이르니, 흉하다","凶"],["貫魚, 以宮人寵, 无不利","물고기를 꿰듯 궁인을 거느려 총애를 받으니, 이롭지 않음이 없다",""],["碩果不食, 君子得輿, 小人剝廬","큰 열매가 먹히지 않으니, 군자는 수레를 얻고 소인은 제 집을 허문다",""]],"24":[["不遠復, 无祗悔, 元吉","멀리 가지 않아 돌아오니, 큰 후회에 이르지 않아 크게 길하다","元吉"],["休復, 吉","아름답게 돌아오니, 길하다","吉"],["頻復, 厲无咎","자주 (잃었다) 돌아오니, 위태로우나 허물없다","厲 无咎"],["中行獨復","무리 가운데서 홀로 돌아온다",""],["敦復, 无悔","도탑게 돌아오니, 후회가 없다",""],["迷復, 凶, 有災眚, 用行師, 終有大敗, 以其國君凶, 至于十年不克征","미혹되어 돌아오지 못하니 흉하고 재앙이 있으며, 군사를 쓰면 끝내 크게 패하고 나라 임금까지 흉하여 십 년이 되도록 정벌하지 못한다","凶"]],"25":[["无妄, 往吉","거짓 없으니, 나아가면 길하다","吉"],["不耕獲, 不菑畬, 則利有攸往","밭 갈지 않고 수확을 바라지 않으며 개간 않고 옥토를 바라지 않으니, 나아감이 이롭다",""],["无妄之災, 或繫之牛, 行人之得, 邑人之災","무망의 재앙이니, 소를 매어둔 것을 행인이 끌고 가 고을 사람이 재앙을 입는다",""],["可貞, 无咎","곧게 지킬 수 있으면, 허물없다","无咎"],["无妄之疾, 勿藥有喜","무망의 병이니, 약을 쓰지 않아도 기쁨이 있다",""],["无妄, 行有眚, 无攸利","무망이니, 나아가면 재앙이 있어 이로울 바 없다","无攸利"]],"26":[["有厲, 利已","위태로움이 있으니, 그침이 이롭다","厲"],["輿說輹","수레의 바퀴통을 벗긴다",""],["良馬逐, 利艱貞, 曰閑輿衛, 利有攸往","좋은 말로 달리니, 어렵되 바름이 이롭고, 수레와 호위를 익히면 나아감이 이롭다",""],["童牛之牿, 元吉","어린 소의 뿔막이이니, 크게 길하다","元吉"],["豶豕之牙, 吉","거세한 돼지의 어금니이니, 길하다","吉"],["何天之衢, 亨","하늘의 큰 길이 열리니, 형통하다",""]],"27":[["舍爾靈龜, 觀我朵頤, 凶","네 신령한 거북(자족)을 버리고 나를 보며 턱을 늘어뜨리니, 흉하다","凶"],["顛頤, 拂經于丘頤, 征凶","거꾸로 아래에 기름을 구하고 언덕에 구하려는 정도를 거스르니, 나아가면 흉","凶"],["拂頤, 貞凶, 十年勿用, 无攸利","기름의 도리를 거스르니 바르게 해도 흉. 십 년을 쓰지 말라, 이로울 바 없다","凶 无攸利"],["顛頤吉, 虎視眈眈, 其欲逐逐, 无咎","거꾸로 아래에 구해도 길하다. 범이 노려보듯 뚫어지게, 욕구가 이어지듯 하면 허물없다","吉 无咎"],["拂經, 居貞吉, 不可涉大川","정도를 거스르나 바름에 머물면 길하다. 큰 내를 건너선 안 된다","吉"],["由頤, 厲吉, 利涉大川","천하가 이로 말미암아 길러진다. 위태롭게 삼가면 길하고, 큰 내를 건너면 이롭다","吉 厲"]],"28":[["藉用白茅, 无咎","흰 띠풀을 깔개로 쓰니, 허물이 없다","无咎"],["枯楊生稊, 老夫得其女妻, 无不利","마른 버들에 새싹이 나고, 늙은 남자가 젊은 아내를 얻으니, 이롭지 않음이 없다","吉"],["棟橈, 凶","마룻대(들보)가 휘니, 흉하다","凶"],["棟隆, 吉, 有它吝","마룻대가 높이 솟으니 길하나, 딴 마음이 있으면 인색하다","吉 吝"],["枯楊生華, 老婦得其士夫, 无咎无譽","마른 버들에 꽃이 피고, 늙은 부인이 젊은 남편을 얻으니, 허물도 명예도 없다","无咎"],["過涉滅頂, 凶, 无咎","지나치게 건너다 이마까지 잠기니, 흉하나 허물은 없다","凶 无咎"]],"29":[["習坎, 入于坎窞, 凶","거듭된 구덩이에서 다시 구덩이 굴로 들어간다. 흉하다","凶"],["坎有險, 求小得","구덩이에 험함이 있으나, 구하면 조금 얻는다",""],["來之坎坎, 險且枕, 入于坎窞, 勿用","오나 가나 구덩이요 구덩이, 험한 데다 험에 기대어 있다. 구덩이 굴로 들어가니 쓰지 말라",""],["樽酒簋貳, 用缶, 納約自牖, 終无咎","동이 술 하나에 밥그릇 둘, 질그릇을 쓰고, 묶은 것을 들창으로 들인다. 끝내 허물이 없다","无咎"],["坎不盈, 祗既平, 无咎","구덩이가 아직 차지 않았으나 다만 이미 평평해졌다. 허물이 없다","无咎"],["係用徽纆, 寘于叢棘, 三歲不得, 凶","세 겹 두 겹 노끈으로 묶어 가시덤불 속에 두니, 세 해가 지나도 얻지 못한다. 흉하다","凶"]],"30":[["履錯然, 敬之, 无咎","밟는 것이 어지러운 듯하니, 공경하면 허물이 없다","无咎"],["黃離, 元吉","누런 빛에 걸리니 크게 길하다","元吉"],["日昃之離, 不鼓缶而歌, 則大耋之嗟, 凶","해가 기울어 걸린 빛이다. 질그릇을 두드리며 노래하지 않으면 늙음을 탄식하게 되니 흉하다","凶"],["突如其來如, 焚如, 死如, 棄如","갑자기 오는 듯, 타는 듯, 죽는 듯, 버려지는 듯하다",""],["出涕沱若, 戚嗟若, 吉","눈물이 줄줄 흐르고 슬퍼 탄식한다. 길하다","吉"],["王用出征, 有嘉折首, 獲匪其醜, 无咎","왕이 나가 정벌하니 아름다움이 있어 우두머리를 베고, 그 무리는 잡지 않는다. 허물이 없다","无咎"]],"31":[["咸其拇","그 엄지발가락에 느낀다",""],["咸其腓, 凶, 居吉","그 장딴지에 느낀다. 흉하다. 머물면 길하다","凶 吉"],["咸其股, 執其隨, 往吝","그 넓적다리에 느낀다. 따르는 것을 붙잡으니 가면 부끄럽다","吝"],["貞吉悔亡, 憧憧往來, 朋從爾思","곧으면 길하여 뉘우침이 없어진다. 오락가락 마음이 분주하면 벗이 네 생각만 따른다","吉"],["咸其脢, 无悔","그 등살에 느낀다. 뉘우침이 없다",""],["咸其輔頰舌","그 광대뼈와 뺨과 혀에 느낀다",""]],"32":[["浚恒, 貞凶, 无攸利","깊이 파고들어 항상하려 한다. 곧게 해도 흉하고 이로울 바가 없다","凶 无攸利"],["悔亡","뉘우침이 없어진다",""],["不恒其德, 或承之羞, 貞吝","그 덕을 항상하게 하지 못하니 혹 부끄러움을 받는다. 곧게 해도 부끄럽다","吝"],["田无禽","사냥해도 짐승이 없다",""],["恒其德, 貞, 婦人吉, 夫子凶","그 덕을 항상하게 하고 곧게 하니, 부인은 길하고 남자는 흉하다","吉 凶"],["振恒, 凶","흔들리면서 항상하려 한다. 흉하다","凶"]],"33":[["遯尾, 厲, 勿用有攸往","물러나는 데 꼬리가 된다. 위태롭다. 갈 바를 두지 말라","厲"],["執之用黃牛之革, 莫之勝說","누런 소가죽으로 묶으니 아무도 풀지 못한다",""],["係遯, 有疾厲, 畜臣妾吉","얽매인 채 물러난다. 병이 있어 위태롭다. 종과 첩을 기르면 길하다","厲 吉"],["好遯, 君子吉, 小人否","좋아하면서도 물러난다. 군자는 길하고 소인은 그러지 못한다","吉"],["嘉遯, 貞吉","아름다운 물러남이다. 곧게 하면 길하다","吉"],["肥遯, 无不利","여유 있는 물러남이다. 이롭지 않은 것이 없다",""]],"34":[["壯于趾, 征凶, 有孚","발가락에 씩씩함이 있다. 나아가면 흉하다. 믿음이 있다","凶"],["貞吉","곧게 하면 길하다","吉"],["小人用壯, 君子用罔, 貞厲. 羝羊觸藩, 羸其角","소인은 힘을 쓰고 군자는 그물(없는 것처럼 여김)을 쓴다. 곧게 해도 위태롭다. 숫양이 울타리를 받으니 그 뿔이 얽힌다","厲"],["貞吉悔亡, 藩決不羸, 壯于大輿之輹","곧게 하면 길하여 뉘우침이 없어진다. 울타리가 터져 얽히지 않는다. 큰 수레의 바퀴통에 씩씩함이 있다","吉"],["喪羊于易, 无悔","지경에서 양을 잃는다. 뉘우침이 없다",""],["羝羊觸藩, 不能退, 不能遂, 无攸利, 艱則吉","숫양이 울타리를 받아 물러설 수도 나아갈 수도 없다. 이로울 바가 없다. 어렵게 여기면 길하다","无攸利 吉"]],"35":[["晉如摧如, 貞吉. 罔孚, 裕无咎","나아가는 듯 꺾이는 듯하다. 곧게 하면 길하다. 믿음을 얻지 못해도 너그러이 하면 허물이 없다","吉 无咎"],["晉如愁如, 貞吉. 受茲介福, 于其王母","나아가는 듯 근심하는 듯하다. 곧게 하면 길하다. 이 큰 복을 그 할머니에게서 받는다","吉"],["眾允, 悔亡","무리가 믿어준다. 뉘우침이 없어진다",""],["晉如鼫鼠, 貞厲","나아가는 것이 들쥐 같다. 곧게 해도 위태롭다","厲"],["悔亡, 失得勿恤, 往吉, 无不利","뉘우침이 없어진다. 잃고 얻음을 근심하지 말라. 가면 길하고 이롭지 않은 것이 없다","吉"],["晉其角, 維用伐邑, 厲吉无咎, 貞吝","나아감이 뿔에 이른다. 오직 고을을 치는 데 쓰면 위태로우나 길하여 허물이 없다. 곧게 해도 부끄럽다","厲 吉 无咎 吝"]],"36":[["明夷于飛, 垂其翼. 君子于行, 三日不食, 有攸往, 主人有言","밝음이 상하여 날면서 그 날개를 드리운다. 군자가 길을 가면서 사흘을 먹지 못한다. 갈 바를 두면 주인이 말을 한다",""],["明夷, 夷于左股, 用拯馬壯, 吉","밝음이 상하되 왼쪽 넓적다리를 다친다. 건장한 말로 구하면 길하다","吉"],["明夷于南狩, 得其大首, 不可疾貞","밝음이 상한 때 남쪽으로 사냥하여 그 우두머리를 얻는다. 급하게 바로잡으려 해서는 안 된다",""],["入于左腹, 獲明夷之心, 于出門庭","왼쪽 배로 들어가 밝음을 상하게 하는 자의 마음을 알아내고, 문과 뜰을 나선다",""],["箕子之明夷, 利貞","기자의 밝음 상함이다. 곧게 함이 이롭다",""],["不明晦, 初登于天, 後入于地","밝지 않아 어둡다. 처음엔 하늘에 오르고 나중에는 땅으로 들어간다",""]],"37":[["閑有家, 悔亡","집에 막을 두어 단속하니 뉘우침이 없어진다",""],["无攸遂, 在中饋, 貞吉","제 뜻대로 이루는 바가 없고 안에서 먹을 것을 장만한다. 곧게 하면 길하다","吉"],["家人嗃嗃, 悔厲吉. 婦子嘻嘻, 終吝","집안 사람들에게 뚝뚝거리며 엄하게 하니, 뉘우치고 위태로우나 길하다. 부녀와 자식이 희희덕거리면 끝내 부끄럽다","悔 厲 吉 吝"],["富家, 大吉","집을 부유하게 한다. 크게 길하다","吉"],["王假有家, 勿恤, 吉","왕이 집에 이르렀다. 근심하지 말라. 길하다","吉"],["有孚威如, 終吉","믿음이 있고 위엄이 있으니 끝내 길하다","吉"]],"38":[["悔亡, 喪馬勿逐自復, 見惡人无咎","뉘우침이 없어진다. 말을 잃어도 쫓지 말라, 저절로 돌아온다. 미운 사람을 보아도 허물이 없다","无咎"],["遇主于巷, 无咎","골목에서 임금을 만난다. 허물이 없다","无咎"],["見輿曳, 其牛掣, 其人天且劓, 无初有終","수레가 뒤로 끌리고 그 소가 막히는 것을 본다. 그 사람은 이마가 깎이고 코가 베인다. 처음은 없으나 끝은 있다",""],["睽孤, 遇元夫, 交孚, 厲无咎","어긋나 외롭다. 큰 사내를 만나 서로 믿으니, 위태로우나 허물이 없다","厲 无咎"],["悔亡, 厥宗噬膚, 往何咎","뉘우침이 없어진다. 그 집안이 살을 깨물듯 하니, 간들 무슨 허물이 있겠는가",""],["睽孤, 見豕負塗, 載鬼一車, 先張之弧, 後說之弧, 匪寇婚媾, 往遇雨則吉","어긋나 외롭다. 돼지가 진흙을 지고 있고 귀신이 한 수레 실려 있는 것을 본다. 먼저 활을 당겼다가 나중에 활을 내려놓는다. 도적이 아니라 혼인할 사이다. 가서 비를 만나면 길하다","吉"]],"39":[["往蹇, 來譽","가면 절고, 돌아오면 기림이 있다",""],["王臣蹇蹇, 匪躬之故","왕의 신하가 절고 또 절다. 제 몸을 위한 까닭이 아니다",""],["往蹇, 來反","가면 절고, 돌아오면 제자리로 돌아간다",""],["往蹇, 來連","가면 절고, 돌아오면 이어진다",""],["大蹇, 朋來","큰 절임이다. 벗이 온다",""],["往蹇, 來碩, 吉. 利見大人","가면 절고, 돌아오면 크다. 길하다. 큰 사람을 보는 것이 이롭다","吉"]],"40":[["无咎","허물이 없다","无咎"],["田獲三狐, 得黃矢, 貞吉","사냥하여 세 마리 여우를 잡고 누런 화살을 얻는다. 곧게 하면 길하다","吉"],["負且乘, 致寇至, 貞吝","짐을 지고서 수레에 탄다. 도적을 불러들인다. 곧게 해도 부끄럽다","吝"],["解而拇, 朋至斯孚","네 엄지발가락을 풀어라. 그러면 벗이 이르러 믿게 된다",""],["君子維有解, 吉. 有孚于小人","군자가 오직 푸는 바가 있으면 길하다. 소인에게서 믿음이 드러난다","吉"],["公用射隼于高墉之上, 獲之, 无不利","제후가 높은 담 위에서 송골매를 쏘아 잡는다. 이롭지 않은 것이 없다",""]],"41":[["已事遄往, 无咎, 酌損之","제 일을 마치고 빨리 가면 허물이 없다. 헤아려서 덜어내야 한다","无咎"],["利貞, 征凶, 弗損益之","곧게 함이 이롭다. 나아가면 흉하다. 덜지 않는 것이 보태는 것이다","凶"],["三人行則損一人, 一人行則得其友","세 사람이 가면 한 사람을 덜고, 한 사람이 가면 그 벗을 얻는다",""],["損其疾, 使遄有喜, 无咎","그 병을 던다. 빨리 하게 하면 기쁨이 있고 허물이 없다","无咎"],["或益之十朋之龜, 弗克違, 元吉","혹 열 붕짜리 값의 거북을 보태주면 사양할 수 없다. 크게 길하다","元吉"],["弗損益之, 无咎, 貞吉, 利有攸往, 得臣无家","덜지 않고 보태준다. 허물이 없고 곧게 하면 길하다. 갈 바를 두는 것이 이롭다. 신하를 얻되 집이 따로 없다","无咎 吉"]],"42":[["利用為大作, 元吉, 无咎","큰 일을 하는 데 쓰는 것이 이롭다. 크게 길해야 허물이 없다","元吉 无咎"],["或益之十朋之龜, 弗克違, 永貞吉. 王用享于帝, 吉","혹 열 붕짜리 값의 거북을 보태주면 사양할 수 없다. 오래 곧게 하면 길하다. 왕이 상제께 제사 올리는 데 써도 길하다","吉"],["益之用凶事, 无咎. 有孚中行, 告公用圭","보태는 것을 흉한 일에 쓴다. 허물이 없다. 믿음을 가지고 가운데로 행하며, 공에게 고할 때 규(圭)를 쓴다","无咎"],["中行, 告公從. 利用為依遷國","가운데로 행하여 공에게 고하니 따른다. 의지하여 나라를 옮기는 데 쓰는 것이 이롭다",""],["有孚惠心, 勿問元吉. 有孚惠我德","믿음으로 은혜를 베푸는 마음이 있으니 묻지 않아도 크게 길하다. 믿음으로 내 덕을 은혜롭게 여긴다","元吉"],["莫益之, 或擊之, 立心勿恆, 凶","보태주는 이가 없고 혹 치는 이가 있다. 마음을 세움이 한결같지 않으니 흉하다","凶"]],"43":[["壯于前趾, 往不勝為咎","앞발가락에 씩씩함이 있다. 가서 이기지 못하면 허물이 된다",""],["惕號, 莫夜有戎, 勿恤","두려워하며 외친다. 한밤중에 군사가 있어도 근심하지 말라",""],["壯于頄, 有凶. 君子夬夬獨行, 遇雨若濡, 有慍, 无咎","광대뼈에 씩씩함이 드러난다. 흉함이 있다. 군자는 결단할 것을 결단하여 혼자 가다가 비를 만나 젖는 듯하여 노여움을 사지만, 허물은 없다","凶 无咎"],["臀无膚, 其行次且. 牽羊悔亡, 聞言不信","볼기에 살이 없어 걸음이 멈칫거린다. 양을 끌듯 하면 뉘우침이 없어지련만, 말을 들어도 믿지 않는다",""],["莧陸夬夬, 中行无咎","비름을 끊듯 결단할 것을 결단한다. 가운데로 행하면 허물이 없다","无咎"],["无號, 終有凶","외칠 곳이 없다. 끝내 흉함이 있다","凶"]],"44":[["繫于金柅, 貞吉, 有攸往見凶. 羸豕孚蹢躅","쇠 굄목에 매어 둔다. 곧게 하면 길하고, 갈 바를 두면 흉함을 본다. 야윈 돼지가 정말로 이리저리 뛰어다닌다","吉 凶"],["包有魚, 无咎, 不利賓","꾸러미에 물고기가 있다. 허물이 없으나 손님에게는 이롭지 않다","无咎"],["臀无膚, 其行次且, 厲, 无大咎","볼기에 살이 없어 걸음이 멈칫거린다. 위태롭지만 큰 허물은 없다","厲 无咎"],["包无魚, 起凶","꾸러미에 물고기가 없다. 일어나면 흉하다","凶"],["以杞包瓜, 含章, 有隕自天","구기자나무 잎으로 참외를 싼다. 아름다움을 머금고 있으니, 하늘로부터 떨어지는 것이 있다",""],["姤其角, 吝, 无咎","그 뿔에서 만난다. 부끄럽지만 허물은 없다","吝 无咎"]],"45":[["有孚不終, 乃亂乃萃, 若號一握為笑, 勿恤, 往无咎","믿음이 있으나 끝까지 가지 못하여, 어지러웠다가 모이기도 한다. 부르면 한줌 사이에 웃음이 된다. 근심하지 말고 가면 허물이 없다","无咎"],["引吉, 无咎, 孚乃利用禴","끌어주면 길하고 허물이 없다. 믿음이 있으면 변변치 않은 봄제사를 올려도 이롭다","吉 无咎"],["萃如嗟如, 无攸利, 往无咎, 小吝","모이려는 듯 탄식하는 듯하다. 이로울 바가 없다. 가면 허물이 없으나 조금 부끄럽다","无攸利 无咎 吝"],["大吉, 无咎","크게 길해야 허물이 없다","吉 无咎"],["萃有位, 无咎. 匪孚, 元永貞, 悔亡","모으되 자리가 있다. 허물이 없다. 믿지 않는 이가 있으면, 크고 오래고 곧게 하면 뉘우침이 없어진다","无咎"],["齎咨涕洟, 无咎","탄식하고 한탄하며 눈물과 콧물을 흘린다. 허물이 없다","无咎"]],"46":[["允升, 大吉","믿음을 얻어 오른다. 크게 길하다","吉"],["孚乃利用禴, 无咎","믿음이 있으면 변변치 않은 봄제사를 올려도 이롭다. 허물이 없다","无咎"],["升虛邑","빈 고을로 오른다",""],["王用亨于岐山, 吉, 无咎","왕이 기산에서 제사 올리는 데 쓴다. 길하고 허물이 없다","吉 无咎"],["貞吉, 升階","곧게 하면 길하다. 섬돌을 밟고 오른다","吉"],["冥升, 利于不息之貞","어둠 속에서도 오른다. 쉬지 않는 곧음이라야 이롭다",""]],"47":[["臀困于株木, 入于幽谷, 三歲不覿","볼기가 그루터기에 지친다. 깊은 골짝으로 들어가 세 해가 지나도 보지 못한다",""],["困于酒食, 朱紱方來, 利用享祀, 征凶, 无咎","술과 음식에 곤경을 치른다. 붉은 무릎가리개가 바야흐로 오려 한다. 제사 올리는 데 쓰면 이롭다. 나아가면 흉하나 허물은 없다","凶 无咎"],["困于石, 據于蒺藜, 入于其宮, 不見其妻, 凶","돌에 가로막혀 곤경을 치르고 가시덩굴 위에 앉는다. 제 집에 들어가도 아내를 보지 못한다. 흉하다","凶"],["來徐徐, 困于金車, 吝, 有終","오기를 느리게 한다. 쇠수레에 곤경을 치른다. 부끄러우나 끝은 있다","吝"],["劓刖, 困于赤紱, 乃徐有說, 利用祭祀","코가 베이고 발이 떨린다. 붉은 무릎가리개에 곤경을 치른다. 느리나마 풀림이 있다. 제사 올리는 데 쓰면 이롭다",""],["困于葛藟, 于臲卼, 曰動悔有悔, 征吉","칡덩굴에 얽혀 곤경을 치르고 흔들거리는 자리에 있다. 움직이면 뉘우친다고 말하며 뉘우침이 있으니, 나아가면 길하다","悔 吉"]],"48":[["井泥不食, 舊井无禽","우물이 진흙물이라 먹지 못한다. 낡은 우물에는 짐승도 오지 않는다",""],["井谷射鮒, 甕敝漏","우물 곁구멍의 붕어에게나 물을 흘려보낸다. 독이 깨져 샌다",""],["井渫不食, 為我心惻, 可用汲, 王明並受其福","우물을 치워 맑았는데도 먹지 않는다. 내 마음을 아프게 한다. 길어 쓸 수 있으니, 왕이 밝으면 함께 그 복을 받는다",""],["井甃, 无咎","우물을 벽돌로 쌓는다. 허물이 없다","无咎"],["井洌, 寒泉食","우물이 맑다. 차가운 샘물을 먹는다",""],["井收勿幕, 有孚元吉","우물을 길어 올리고 덮지 말라. 믿음이 있어 크게 길하다","元吉"]],"49":[["鞏用黃牛之革","누런 소가죽으로 단단히 묶는다",""],["巳日乃革之, 征吉, 无咎","때가 차야 비로소 고친다. 나아가면 길하고 허물이 없다","吉 无咎"],["征凶, 貞厲. 革言三就, 有孚","나아가면 흉하고 곧게 해도 위태롭다. 고치자는 말이 세 번 이루어지면 믿음이 있다","凶 厲"],["悔亡, 有孚改命, 吉","뉘우침이 없어진다. 믿음을 가지고 명을 고치니 길하다","吉"],["大人虎變, 未占有孚","큰 사람이 범처럼 변한다. 점을 치기 전에 이미 믿음이 있다",""],["君子豹變, 小人革面. 征凶, 居貞吉","군자는 표범처럼 변하고 소인은 얼굴만 고친다. 나아가면 흉하고, 머물러 곧게 하면 길하다","凶 吉"]],"50":[["鼎顛趾, 利出否, 得妾以其子, 无咎","솥의 발이 뒤집힌다. 묵은 것을 내버리는 데 이롭다. 첩을 얻어 그 자식을 본다. 허물이 없다","无咎"],["鼎有實, 我仇有疾, 不我能即, 吉","솥에 알맹이가 차 있다. 내 짝이 병이 있어 나에게 다가오지 못하니 길하다","吉"],["鼎耳革, 其行塞, 雉膏不食, 方雨虧悔, 終吉","솥의 귀가 바뀌어 옮기지 못한다. 꿩 기름을 먹지 못한다. 바야흐로 비가 내려 뉘우침이 줄어드니, 끝내 길하다","悔 吉"],["鼎折足, 覆公餗, 其形渥, 凶","솥의 다리가 부러져 임금의 음식을 엎는다. 그 모양이 범벅이 된다. 흉하다","凶"],["鼎黃耳金鉉, 利貞","솥의 누런 귀에 쇠로 된 손잡이다. 곧게 함이 이롭다",""],["鼎玉鉉, 大吉, 无不利","솥에 옥으로 된 손잡이다. 크게 길하고 이롭지 않은 것이 없다","吉"]],"51":[["震來虩虩, 後笑言啞啞, 吉","우레가 올 때 두려워 떤다. 뒤에는 웃음소리가 재재거린다. 길하다","吉"],["震來厲, 億喪貝, 躋于九陵, 勿逐, 七日得","우레가 오니 위태롭다. 재물을 잃을까 헤아려 높은 언덕으로 오른다. 쫓지 말라, 이레면 얻는다","厲"],["震蘇蘇, 震行无眚","우레에 놀라 정신이 아득하다. 우레 때문에 움직이면 재앙이 없다",""],["震遂泥","우레가 마침내 진흙에 빠진다",""],["震往來厲, 億无喪, 有事","우레가 오가니 위태롭다. 헤아려 잃지 않으면 할 일이 있다","厲"],["震索索, 視矍矍, 征凶. 震不于其躬, 于其鄰, 无咎. 婚媾有言","우레에 몸이 오그라들고 눈이 두리번거린다. 나아가면 흉하다. 우레가 제 몸에 이르지 않고 이웃에 이르니 허물이 없다. 혼인할 사람들이 말을 한다","凶 无咎"]],"52":[["艮其趾, 无咎, 利永貞","그 발가락에서 멈춘다. 허물이 없다. 오래 곧게 함이 이롭다","无咎"],["艮其腓, 不拯其隨, 其心不快","그 장딴지에서 멈춘다. 따르는 이를 건지지 못하니 그 마음이 편치 않다",""],["艮其限, 列其夤, 厲薰心","그 허리에서 멈춘다. 등살을 찢는다. 위태로움이 마음을 태운다","厲"],["艮其身, 无咎","그 몸에서 멈춘다. 허물이 없다","无咎"],["艮其輔, 言有序, 悔亡","그 광대뼈에서 멈춘다. 말에 순서가 있으니 뉘우침이 없어진다",""],["敦艮, 吉","도탑게 멈춘다. 길하다","吉"]],"53":[["鴻漸于干, 小子厲, 有言, 无咎","기러기가 물가로 나아간다. 어린아이가 위태롭고 말이 있으나 허물은 없다","厲 无咎"],["鴻漸于磐, 飲食衎衎, 吉","기러기가 너럭바위로 나아간다. 먹고 마시는 것이 화기롭다. 길하다","吉"],["鴻漸于陸, 夫征不復, 婦孕不育, 凶. 利禦寇","기러기가 뭍으로 나아간다. 남편은 가서 돌아오지 않고 아내는 임신하여도 기르지 못한다. 흉하다. 도적을 막는 데는 이롭다","凶"],["鴻漸于木, 或得其桷, 无咎","기러기가 나무로 나아간다. 혹 평평한 가지를 얻으면 허물이 없다","无咎"],["鴻漸于陵, 婦三歲不孕, 終莫之勝, 吉","기러기가 언덕으로 나아간다. 아내가 세 해를 임신하지 못하나, 끝내 아무도 이기지 못한다. 길하다","吉"],["鴻漸于陸, 其羽可用為儀, 吉","기러기가 큰 하늘길로 나아간다. 그 깃털을 의식의 장식으로 쓸 수 있다. 길하다","吉"]],"54":[["歸妹以娣, 跛能履, 征吉","누이를 시집보내되 딸려보낸다. 절뚝발이라도 밟고 갈 수 있다. 나아가면 길하다","吉"],["眇能視, 利幽人之貞","애꾸눈이라도 볼 수 있다. 숨어 사는 이의 곧음이 이롭다",""],["歸妹以須, 反歸以娣","누이를 시집보내려다 기다리게 된다. 돌아와 딸려보낸다",""],["歸妹愆期, 遲歸有時","누이를 시집보내는 데 때를 놓친다. 늦게 가는 데도 때가 있다",""],["帝乙歸妹, 其君之袂不如其娣之袂良, 月幾望, 吉","제을이 누이를 시집보낸다. 그 본처의 소매가 딸려간 이의 소매만 못하다. 달이 거의 보름이니 길하다","吉"],["女承筐无實, 士刲羊无血, 无攸利","여자가 든 광주리에 알맹이가 없고, 남자가 양을 베어도 피가 없다. 이로울 바가 없다","无攸利"]],"55":[["遇其配主, 雖旬无咎, 往有尚","짝이 되는 주인을 만난다. 같더라도 허물이 없으니, 가면 상찬이 있다","无咎"],["豐其蔀, 日中見斗, 往得疑疾, 有孚發若, 吉","차양을 크게 드리우니 한낮에도 북두칠성을 본다. 가면 의심을 산다. 믿음을 가지고 움직이면 길하다","吉"],["豐其沛, 日中見沬, 折其右肱, 无咎","휘장을 크게 드리우니 한낮에도 작은 별을 본다. 그 오른팔을 부러뜨린다. 허물이 없다","无咎"],["豐其蔀, 日中見斗, 遇其夷主, 吉","차양을 크게 드리우니 한낮에도 북두칠성을 본다. 동등한 주인을 만나니 길하다","吉"],["來章, 有慶譽, 吉","빛나는 이를 오게 한다. 경사와 기림이 있으니 길하다","吉"],["豐其屋, 蔀其家, 闚其戶, 闃其无人, 三歲不覿, 凶","그 집을 크게 하고 그 집안을 덮는다. 문틈으로 엿보니 고요하여 사람이 없다. 세 해가 지나도 보지 못한다. 흉하다","凶"]],"56":[["旅瑣瑣, 斯其所取災","나그네가 사소하게 군다. 그것이 재앙을 불러들이는 까닭이다",""],["旅即次, 懷其資, 得童僕貞","나그네가 숙소에 든다. 노잣돈을 품에 지니고, 곧은 종을 얻는다",""],["旅焚其次, 喪其童僕, 貞厲","나그네가 그 숙소를 태우고 그 종을 잃는다. 곧게 해도 위태롭다","厲"],["旅于處, 得其資斧, 我心不快","나그네가 머물 곳을 얻고 노잣돈과 도끼를 얻는다. 내 마음은 편치 않다",""],["射雉一矢亡, 終以譽命","꿩을 쏘아 화살 하나를 잃는다. 끝내 기림과 벼슬을 얻는다",""],["鳥焚其巢, 旅人先笑後號咷, 喪牛于易, 凶","새가 그 둥지를 태운다. 나그네가 먼저 웃다가 나중에 울부짖는다. 지경에서 소를 잃는다. 흉하다","凶"]],"57":[["進退, 利武人之貞","나아갈까 물러날까 망설인다. 무인의 곧음이 이롭다",""],["巽在床下, 用史巫紛若, 吉, 无咎","평상 아래까지 엎드린다. 사관과 무당을 널리 쓰면 길하고 허물이 없다","吉 无咎"],["頻巽, 吝","자주 엎드린다. 부끄럽다","吝"],["悔亡, 田獲三品","뉘우침이 없어진다. 사냥하여 세 가지 사냥감을 얻는다",""],["貞吉悔亡, 无不利, 无初有終. 先庚三日, 後庚三日, 吉","곧게 하면 길하여 뉘우침이 없어진다. 이롭지 않은 것이 없다. 처음은 없으나 끝은 있다. 경일 사흘 전, 경일 사흘 뒤이면 길하다","吉"],["巽在床下, 喪其資斧, 貞凶","평상 아래까지 엎드린다. 그 노잣돈과 도끼를 잃는다. 곧게 해도 흉하다","凶"]],"58":[["和兌, 吉","화합하여 기뻐한다. 길하다","吉"],["孚兌, 吉, 悔亡","믿음으로 기뻐한다. 길하고 뉘우침이 없어진다","吉"],["來兌, 凶","와서 기뻐하게 한다. 흉하다","凶"],["商兌未寧, 介疾有喜","기쁨을 저울질하느라 편안하지 못하다. 경계를 지어 병든 것을 끊으면 기쁨이 있다",""],["孚于剝, 有厲","깎아내는 자를 믿는다. 위태로움이 있다","厲"],["引兌","끌어당겨 기뻐하게 한다",""]],"59":[["用拯馬壯, 吉","건장한 말로 구하니 길하다","吉"],["渙奔其机, 悔亡","흩어질 때 그 기대는 것으로 달려간다. 뉘우침이 없어진다",""],["渙其躬, 无悔","그 제 몸을 흩트린다. 뉘우침이 없다",""],["渙其群, 元吉. 渙有丘, 匪夷所思","그 무리를 흩트린다. 크게 길하다. 흩어진 것이 언덕을 이룬다. 보통 사람이 생각할 바가 아니다","元吉"],["渙汗其大號, 渙王居, 无咎","땀이 배어나듯 큰 호령을 흩는다. 왕의 쌓은 것을 흩는다. 허물이 없다","无咎"],["渙其血去逖出, 无咎","그 피를 흩어 멀리 벗어난다. 허물이 없다","无咎"]],"60":[["不出戶庭, 无咎","집 뜰을 나가지 않는다. 허물이 없다","无咎"],["不出門庭, 凶","대문 뜰을 나가지 않는다. 흉하다","凶"],["不節若, 則嗟若, 无咎","마디를 짓지 않으면 탄식하게 된다. 허물할 곳이 없다","无咎"],["安節, 亨","편안하게 마디를 짓는다. 형통하다",""],["甘節, 吉, 往有尚","달게 마디를 짓는다. 길하고 가면 상찬이 있다","吉"],["苦節, 貞凶, 悔亡","쓰게 마디를 짓는다. 곧게 해도 흉하나 뉘우침은 없어진다","凶"]],"61":[["虞吉, 有它不燕","헤아려 정하면 길하다. 따로 다른 마음을 두면 편안하지 못하다","吉"],["鳴鶴在陰, 其子和之. 我有好爵, 吾與爾靡之","우는 학이 그늘진 곳에 있으니 그 새끼가 화답한다. 내게 좋은 술잔이 있으니 너와 함께 나누겠다",""],["得敵, 或鼓或罷, 或泣或歌","짝을 만난다. 북을 울리기도 하고 그치기도 하며, 울기도 하고 노래하기도 한다",""],["月幾望, 馬匹亡, 无咎","달이 거의 보름이다. 말의 짝이 없어진다. 허물이 없다","无咎"],["有孚攣如, 无咎","믿음으로 어울려 매듯 한다. 허물이 없다","无咎"],["翰音登于天, 貞凶","닭 울음이 하늘에 오른다. 곧게 해도 흉하다","凶"]],"62":[["飛鳥以凶","나는 새라서 흉하다","凶"],["過其祖, 遇其妣, 不及其君, 遇其臣, 无咎","할아버지를 지나쳐 할머니를 만난다. 임금에게는 미치지 못하고 그 신하를 만난다. 허물이 없다","无咎"],["弗過防之, 從或戕之, 凶","지나치게 막지 않으면 뒤따라와 혹 해치니 흉하다","凶"],["无咎, 弗過遇之, 往厲必戒, 勿用永貞","허물이 없다. 지나치지 않고 알맞게 만난다. 가면 위태로우니 반드시 경계하라. 오래 곧게 하려 들지 말라","无咎 厲"],["密雲不雨, 自我西郊, 公弋取彼在穴","구름이 빽빽하나 비가 오지 않는다. 내 서쪽 들에서 온다. 공이 주살로 굴에 있는 저것을 잡는다",""],["弗遇過之, 飛鳥離之, 凶, /* y[0..5] = 初爻→上爻. binary = 상괘3(上五四) + 하괘3(三二初) */
function bin(y){ return ''+y[5]+y[4]+y[3]+y[2]+y[1]+y[0]; }
function toY(b){ return [+b[5],+b[4],+b[3],+b[2],+b[1],+b[0]]; }
function upper3(b){ return b.slice(0,3); }
function lower3(b){ return b.slice(3); }

function jiGua(y,i){ var z=y.slice(); z[i]=z[i]?0:1; return bin(z); }   // 之卦 — 한 획을 바꾸면
function jongGua(y){ return bin(y.slice().reverse()); }                 // 綜卦 — 상대 시선
function chakGua(y){ return bin(y.map(function(v){return v?0:1})); }    // 錯卦 — 정반대 조건
function hoGua(y){ return bin([y[1],y[2],y[3],y[2],y[3],y[4]]); }       // 互卦 — 2·3·4 / 3·4·5

/* 효사에 명시된 점사어에서 판정을 읽는다. 통계보다 이쪽이 우선.
   吉과 凶이 함께 있는 효(屯 五 小貞吉大貞凶 등)는 조건에 따라 갈리는 자리다. */
function verdictFromYao(v){
  if(!v) return null;
  var good = /吉/.test(v);              // 吉 · 元吉
  var bad  = /凶|无攸利/.test(v);
  var caut = /悔|吝|厲/.test(v);
  var ok   = /无咎/.test(v);
  if(good && bad) return 'split';
  if(bad)  return 'hyung';
  if(good) return 'ji';
  if(caut) return 'ryeo';
  if(ok)   return 'mu';
  return null;
}

/* 자리문법 판정 — 位正 · 得中 · 應을 읽고, 판정은 실측 셀에서 가져온다 */

  var jeong   = ((i%2===0) === !!y[i]);            // 初三五=陽자리, 二四上=陰자리
  var jung    = (i===1 || i===4);                  // 하괘中 · 상괘中
  var eung    = (partner !== self);
  var v       = VERDICT[cell.v];
  return {jeong:jeong, jung:jung, eung:eung, cell:cell, label:v.n, cls:v.c,
    reason:[jung?'得中':'', jeong?'位正':'不正',
            eung?'正應':(self?'敵應':'無應')].filter(Boolean).join(' · ')};
}
function guaSVG(y,mark){
  return '<div class="gua">'+y.map(function(v,i){
    return '<div class="ln '+(v?'':'yin')+' '+(i===mark?'mark':'')+'">'+
      (v?'<i></i>':'<i></i><i></i>')+'</div>';
  }).join('')+'</div>';
}
function label(b){
  var h=BYBIN[b];
  return h ? h.ko+' <span style="font-size:12px;color:var(--mute)">'+h.hj+'</span>' : b;
}

/* 괘별 상황 서술 — GUA[괘번호] = [라벨, 서술].
   ①본괘는 라벨+서술을, ③互 ④綜 ⑤之 ⑥序卦·錯은 라벨만 받는다.
   아직 안 쓴 괘는 비워두고 그 자리는 예전처럼 괘 이름만 나온다. */
const GUA = {"1":["막힘없이 밀어붙이는 판","여섯 자리가 다 강해서 걸릴 것이 없는 판입니다. 밀면 밀리기 때문에, 위험은 바깥이 아니라 과속에서 옵니다. 이 괘에서 국면이 갈리는 것은 오직 얼마나 왔느냐 하나예요 — 잠긴 용에서 끝까지 오른 용까지."],"2":["받아서 이루는 판","내가 시작하는 판이 아니라, 오는 것을 받아 완성하는 판입니다. 버티고 따르는 것이 일이라 앞질러 나서면 어그러집니다. 다만 서리를 밟으면 얼음이 오듯, 조짐은 미리 읽어두어야 해요."],"3":["시작의 진통","무언가 막 시작됐는데 앞이 험한 자리입니다. 밀고 나갈 힘은 아래에서 치미는데 위가 막혀 있어, 나아가려 할수록 엉킵니다. 지금은 뚫을 때가 아니라 자리를 잡고 사람을 얻을 때예요."],"4":["몰라서 멈춰 선 판","앞은 험한데 위가 막혀 있어, 모르니까 발이 안 떨어지는 자리입니다. 무지와 정체가 한 몸이에요. 답을 쥔 쪽이 따로 있어 내가 물어야 풀리는데, 억지로 깨우치려 들면 되레 반발이 옵니다."],"5":["기다려야 하는 판","힘은 충분한데 앞에 험한 것이 놓여 아직 못 건너는 자리입니다. 실력이 모자란 게 아니라 때가 안 된 것이라, 조급하면 진흙에 빠집니다. 먹고 마시며 기다리는 것이 이 괘의 일이에요."],"6":["다투게 되는 판","위는 위대로 아래는 아래대로 등을 돌린 자리입니다. 서로 어긋나 다툼이 생기는데, 이겨도 남는 것이 없습니다. 오래 끌지 않고 일찍 물러나는 쪽이 실속을 챙깁니다."],"7":["사람을 써서 치르는 판","혼자 감당 못 할 일을 사람을 써서 치르는 자리입니다. 땅속에 물이 모이듯 힘은 이미 모여 있고, 문제는 그걸 누구에게 맡기고 무엇으로 묶느냐예요. 명분과 규율이 서지 않으면 이겨도 시체를 싣고 돌아옵니다."],"8":["붙어야 사는 판","혼자 서는 자리가 아니라 어디에 붙느냐로 갈리는 자리입니다. 중심이 분명하면 사람이 모이고, 늦게 붙으면 남는 자리가 없습니다. 다만 아무에게나 붙으면 사람 같지 않은 이를 따르게 돼요."]};

/* 효별 궁리노트 — NOTE[괘번호] = [初..上] 6개.
   "이 효가 왜 이렇게 읽히는가"를 位·中·應·承乘으로 풀어놓은 글.
   있으면 ②국면 카드의 해설이 되고, 없으면 자리문법 일반론으로 폴백한다. */
const NOTE = {"1":["잠룡. 양강하나 맨 아래(初)라 아직 때가 아님 → 감추고 쓰지 않음(潛). 得位(正)이나 부중. 純陽이라 應은 전부 敵應.","不正이나 得中 → 세상에 나와 이로움. 中>正 교과서(자리는 어긋나도 中이라 좋음). 利見大人=길함.","得正이나 過剛不中, 하괘 끝의 위태(厲). 종일 근면·저녁 삼감으로 无咎. 3효 多凶의 전형 — 자리 맞아도 中 없어 위태.","뛸까 못에 있을까 망설임 — 4효(근군)의 의심·근신. 나아갈지 물러날지 재량으로 판단하니 无咎.","中正 + 君位 = 절정. 飛龍在天 — 대인이 뜻을 펴는 최고의 자리. 乾의 主爻·최길효.","극에 오른 용, 넘쳐서 후회(亢=넘침). 上효 극·과잉 = 물극필반. ※用九 見群龍无首吉(乾 전효 변시)."],"2":["서리를 밟으면 곧 굳은 얼음 — 음의 시작에서 조짐을 살펴 경계. 初효 잠재. 純陰이라 應은 전부 無應.","中正 → 坤의 이상적 효. 곧고(直) 방정하고(方) 큰(大) 땅의 덕이 자연스러워 无不利. 二多譽의 자리.","빛남을 안으로 머금음(含章). 왕의 일을 좇아도 공을 내세우지 않고(无成) 끝맺음(有終) — 신하의 겸손. 不正이나 유순히 감춤.","주머니 묶듯 입을 다물고 삼가 감춤 → 허물도 명예도 없다. 4효 근신(多懼)의 전형. 得位한 유순의 신중.","黃(중앙색)裳(아래옷·겸손) → 중용의 덕을 안으로 지킴 → 元吉. 음유가 君位이나 得中+겸손이라 크게 길. 坤 主爻.","음이 극성해 양과 충돌(龍戰) — 물극필반의 흉조. 上효 극. ※用六 利永貞(坤 전효 변시)."],"3":["양강·득위·정응이나 험난 시국의 초입(初+屯) → 함부로 안 나아가고 머물러 바름 지키며(居貞) 사람·기반 세움(建侯). 以貴下賤 大得民. 나아감 아닌 지킴.","中正이나 乘剛(初九 올라탐) + 정응 九五가 멀어 → 머뭇대다 십 년 뒤에야 맺음(十年乃字). 험난+乘剛의 지연.","안내(虞) 없이 사슴 쫓아 숲에 빠짐 — 무모. 不正不中+무응이라 도울 이 없어, 그칠 줄 알아야. 가면 吝.","머뭇대다 정응 初九(양강)에게 혼인 구해 나아가면 길. 屯 六四는 정응을 살려 吉 — 六二(乘剛·지연)와 대조. 承(九五 받듦).","中正 君位이나 屯의 험난 → 은택이 막힘(屯其膏). 작은 일엔 길, 큰일엔 흉. 中正君位라도 괘 맥락(屯)이 발목 잡는 사례.","屯의 극에서 음유가 갈 곳 없어 곤궁의 절정(泣血). 上효 극+乘剛(九五 올라탐)+무응 — 사방이 막힘."],"4":["몽매를 깨우는 시작 — 벌로 다스려 질곡을 벗김이 이로움. 다만 엄함만으로 방임하면 吝. 承(九二 스승 받듦).","강중한 스승, 뭇 몽매를 감싸 가르침(包蒙) → 吉. 六五(君)와 정응 → 실무 위임받는 재상(子克家). 剛柔接. 不正이나 得中이 구함.","不正+乘剛(九二 올라탐) → 돈 있는 남자(金夫) 보고 절개 못 지킴. 응(上九) 있어도 자기가 부정·탐욕이라 无攸利.","몽매에 갇힘(困蒙) → 吝. 두 양(九二 스승·上九)에서 가장 멀고 정응(初六)도 음이라, 어리석음에 고립. 應 부재의 그늘.","어린아이처럼 순한 배움(童蒙) → 吉. 음유 君位이나 得中 + 아래 九二(강중 스승)에 응해 겸손히 맡김. 유약한 임금의 이상적 배움. 承(上九 받듦).","몽매를 쳐서 깨움(擊蒙). 지나친 폭압(爲寇)은 불리, 해악을 막는 정도(禦寇)면 이롭다. 上효 극 = 엄한 교정, 단 넘치지 말 것."],"5":["험(坎)에서 먼 들(郊)에서 기다림. 조급 말고 항상됨을 지키면 无咎. 得位한 강건의 절제된 기다림.","험에 다가선 모래밭. 약간 구설 있으나 得中으로 너그러이 대처 → 終吉. 敵應(九五)이라 위 도움은 없음.","험(坎) 바로 앞 진흙. 過剛으로 다가서 스스로 도적을 부름(致寇至). 3효 위태 — 敬慎해야 패하지 않음.","험(坎)에 들어 피를 봄. 그러나 得位+유순히 순응해 구덩이에서 벗어남(出自穴). 乘剛(九三 올라탐)이나 順으로 면함.","中正 君位, 여유롭게 술·음식으로 때를 기다림 → 貞吉. 기다림(需)의 완성 — 조급 없이 바름을 지킴.","험의 극(구덩이). 청하지 않은 세 손님(아래 三陽)이 오니, 공경히 맞으면 終吉. 극에서 순응·공경으로 반전. 乘剛(九五 올라탐)."],"6":["다툼을 오래 끌지 않음 → 약간 구설 있으나 終吉. 음유가 그칠 줄 알아 다툼을 안 키움. 承(九二 받듦).","아래(2)에서 위 임금(九五)과 敵應으로 다투나 못 이김(自下訟上, 患至掇也). 得中이라 물러나 숨어 화 면함(无眚). 敵應=맞섬의 흉.","옛 분수(舊德)를 지켜 다투지 않음. 위태로우나(貞厲) 마침내 吉. 왕의 일 좇아도 이룸 없이(无成) 겸손. 음유가 다툼을 피함. 乘剛(九二).","다툼을 못 이겨(不克訟) 돌이켜 천명에 나아가 마음 고치고(渝) 편안히 바름 지키면 吉. 강하나 부정위 — 다툼 접고 순리로.","中正 君位가 다툼을 공정히 판결 → 元吉. 訟의 이상 — 물러나 다투는 자가 아니라 다툼을 다스리는 최고 자리.","다툼을 끝까지 이겨 관대(鞶帶)를 받아도 하루아침에 세 번 빼앗김. 上효 극 = 쟁송을 극단까지 밀어붙여 얻은 영예의 무상함."],"7":["군대를 낼 땐 규율(律)이 근본 — 기강이 무너지면(否臧) 흉. 出師의 시작. 承(九二 장수 받듦).","유일한 양효=장수, 군중의 중심(在師中). 得中 + 六五(君) 정응해 신임(王三錫命) → 吉无咎. 조건부 리더십의 핵. 不正이나 得中이 구함.","패전해 시체를 실어옴(輿尸) → 凶. 不正不中+乘剛(九二 장수 올라탐) — 무능이 지휘를 넘봄. 無應이라 도울 이 없음.","군대가 후퇴해 주둔(左次) → 无咎. 得位한 유순이 이길 수 없을 때 물러남의 지혜. 무리한 전진 아님.","침입(田有禽)에 토벌 명분(執言) → 无咎. 맏이(長子=九二)에게 군을 맡기면 되나 소인(弟子)이 지휘하면 흉. 得中 君이 정응 九二(장수)에 위임.","전쟁이 끝나 대군(大君)이 공신을 봉함(開國承家). 단 소인은 쓰지 말 것. 上효 극=논공행상, 소인 경계."],"8":["믿음으로 따름(有孚比之) → 无咎. 질그릇에 가득 찬 믿음 → 뜻밖의 길(有它吉). 比의 시작 = 진실한 믿음.","안에서 따름(自內), 中正이 정응 九五(中正君)에 응 → 貞吉. 안으로부터 바르게 임금을 따름.","잘못된 대상(匪人)을 따름. 不正不中+무응이라 바른 짝 없이 그릇된 이를 좇음. 象: 不亦傷乎 — 슬픈 자리.","밖으로 임금(九五)을 따름(外比), 承으로 어진 이 좇음 → 貞吉. 無應이나 承이 구원. 上六(乘→凶)과 정반대.","드러난 친함(顯比), 앞 짐승 놓아줌(失前禽=억지로 안 잡음), 백성이 두려워 않음 → 吉. 만민이 따르는 中正君의 관대함 — 끌어모음 아닌 놓아줌.","따름에 머리가 없음(无首), 象: 无所終也 → 凶. 乘剛(九五 임금 올라탐)으로 질서 무너짐. 六四(承→吉)와 정반대."]};
function guaOf(b){ var h=BYBIN[b]; return (h && GUA[h.n]) || null; }
function labelFull(b){
  var g=guaOf(b);
  return label(b)+(g?'<span class="glabel">'+g[0]+'</span>':'');
}
/* 받침 유무에 따른 조사 — 괘 이름이 문장에 박히므로 필요 */
function batchim(w){
  var c=w.charCodeAt(w.length-1)-0xAC00;
  return (c>=0 && c<11172) ? (c%28) : 0;
}

var ans=[null,null,null,null,null,null], stage=null;

    return '<div class="q"><div class="yao">'+q.y+'</div><div class="txt">'+q.t+'</div>'+
     '<div class="opts" data-i="'+(off+k)+'">'+
     '<button data-v="1">'+q.a+'</button><button data-v="0">'+q.b+'</button></div>'+

}
renderQ(document.getElementById('qLower'),QL,0);
renderQ(document.getElementById('qUpper'),QU,3);

document.querySelectorAll('.opts').forEach(function(box){
  box.addEventListener('click',function(e){
    var btn=e.target.closest('button'); if(!btn) return;
    box.querySelectorAll('button').forEach(function(b){b.classList.remove('on')});

  document.querySelectorAll('#qStage button').forEach(function(b){b.classList.remove('on')});

});

    ans.some(function(v){return v===null}) || stage===null;

document.getElementById('go').onclick = function(){ run(); };

function run(){
  var y=ans.slice(), b=bin(y), h=BYBIN[b], i=stage;
  var up=upper3(b), lo=lower3(b);
  var J=judge(y,i);
  var jb=jiGua(y,i), zb=jongGua(y), cb=chakGua(y), hb=hoGua(y);
  var nx=BYNUM[h.n===64?1:h.n+1];
  var yao   = YAO[h.n] ? YAO[h.n][i] : null;          // [효사원문, 직역, 판정어]
  var vKey  = yao ? verdictFromYao(yao[2]) : null;    // 효사에 점사어가 있으면 그쪽이 우선
  var V     = vKey ? VERDICT[vKey] : {n:J.label, c:J.cls};
  var G     = guaOf(b);                                // 본괘 상황 서술 [라벨, 서술]
  var note  = NOTE[h.n] ? NOTE[h.n][i] : null;         // 이 효의 궁리노트
  var title = document.getElementById('title').value.trim() || '이름 없는 상황';

  var R=document.getElementById('result');
  R.innerHTML =
  '<div class="card hero">'+
    '<div class="sec-label">① 지 금  판</div>'+
    '<div class="guarow">'+guaSVG(y,i)+
      '<div><div class="num">제 '+h.n+' 괘</div>'+
        '<h2 class="name">'+h.ko+' <span style="font-size:15px;color:var(--gold)">'+h.hj+'</span></h2>'+
        (G?'<div class="gtag">'+G[0]+'</div>':'')+
        '<div class="struct">위 '+TRI[up].sym+' '+TRI[up].ko+'('+TRI[up].im+') · 아래 '+TRI[lo].sym+' '+TRI[lo].ko+'('+TRI[lo].im+')</div>'+
      '</div></div>'+
    (G?'<p class="gdesc">'+G[1]+'</p>':'')+
    '<div class="grid2" style="margin-top:16px">'+
      '<div class="mini" style="background:#fff"><h4>바깥 판 — '+UPPER[up].t+'</h4><p class="why" style="margin:0">'+UPPER[up].d+'</p></div>'+
      '<div class="mini" style="background:#fff"><h4>내 기반 — '+LOWER[lo].t+'</h4><p class="why" style="margin:0">'+LOWER[lo].d+'</p></div>'+
    '</div></div>'+

  '<div class="card">'+
    '<div class="sec-label">② 국 면 &nbsp;·&nbsp; '+POSGRAM[i].n+'爻 · '+STAGES[i].n+'</div>'+
    '<span class="verdict '+V.c+'">'+V.n+'</span>'+
    (yao && yao[2] ? '<span class="pansa">'+yao[2].split(' ').join(' · ')+'</span>' : '')+
    '<span class="tag" style="margin-left:8px">'+J.reason+'</span>'+
    (yao ? '<div class="yaotext">'+yao[0]+'<span class="tr">'+yao[1]+'</span></div>' : '')+
    '<div class="evi">'+
      (vKey
        ? '이 효에 <b>점사어가 명시</b>되어 판정은 효사에서 왔습니다. 참고로 같은 자리 조건 16효는 — '
        : '이 효에는 점사어가 없어 <b>같은 자리 조건 16효</b>의 분포로 읽습니다 — ')+
      '吉 '+J.cell.g+' · 无咎 '+J.cell.o+' · 悔吝厲 '+J.cell.c+' · 凶 '+J.cell.b+
      (J.cell.n?' <span style="opacity:.6">(점사어 없음 '+J.cell.n+')</span>':'')+'</div>'+
    (vKey==='split'
      ? '<p style="margin:10px 0 0;font-size:14px"><b>조건에 따라 갈리는 자리입니다.</b> '+
        '효사가 길과 흉을 함께 말합니다 — 무엇을 어떻게 하느냐가 결과를 가릅니다.</p>' : '')+
    (note
      ? '<div class="gungli"><span class="ghead">왜 이렇게 읽나</span>'+note+'</div>'+
        '<p class="posline">'+POSGRAM[i].n+'爻 — '+POSGRAM[i].g+'</p>'
      : '<p style="margin:10px 0 0;font-size:14px">'+POSGRAM[i].g+'</p>'+
        '<p style="margin:6px 0 0;font-size:14px;color:var(--mute)">'+
          (J.jung?'이 자리는 <b>가운데</b>를 얻어 치우치지 않습니다. ':'')+
          (J.eung?'짝하는 효와 <b>응(應)</b>이 서 있어 밖에서 받쳐주는 손이 있습니다.'
                 :'짝하는 효와 <b>응이 없어</b> 혼자 감당해야 하는 국면입니다.')+
          (J.jeong?'':' 자리와 성질이 어긋나(不正) 무리가 따릅니다.')+
        '</p>')+
    '</div>'+

  '<div class="card">'+
    '<div class="sec-label">③ 속 사 정 &nbsp;·&nbsp; 互卦</div>'+
    '<div class="guarow">'+guaSVG(toY(hb),-1)+'<div>'+
      '<h3 style="margin:0;font-size:18px;color:var(--navy)">'+labelFull(hb)+'</h3>'+
      '<p class="why" style="margin:4px 0 0">겉으로 드러난 판 아래에서 실제로 굴러가는 동력입니다. '+
      '본괘와 다르게 읽힌다면, 지금 보이는 문제가 진짜 문제가 아닙니다.</p></div></div></div>'+

  '<div class="card">'+
    '<div class="sec-label">④ 상 대 의  판 &nbsp;·&nbsp; 綜卦(도전)</div>'+
    '<div class="guarow">'+guaSVG(toY(zb),-1)+'<div>'+
      '<h3 style="margin:0;font-size:18px;color:var(--navy)">'+labelFull(zb)+'</h3>'+
      '<p class="why" style="margin:4px 0 0">같은 상황을 통째로 뒤집어 저쪽에서 본 그림입니다. '+
      '나에게 <b>'+h.ko+'</b>인 판이, 상대에게는 <b>'+BYBIN[zb].ko+'</b>'+
      (batchim(BYBIN[zb].ko)?'으로':'로')+' 보입니다.'+
      (zb===nx.b?' 이 괘는 序卦가 놓은 다음 마디와 같습니다 — 판이 저쪽으로 넘어가면서 국면이 바뀌는 자리예요.':'')+
      '</p></div></div></div>'+

  '<div class="card" style="border:1.5px solid var(--gold)">'+
    '<div class="sec-label">⑤ 이 렇 게  하 면 &nbsp;·&nbsp; 之卦</div>'+
    '<div class="guarow">'+guaSVG(toY(jb),i)+'<div>'+
      '<div class="num">'+POSGRAM[i].n+'爻 한 획을 바꾸면</div>'+
      '<h3 style="margin:2px 0 0;font-size:20px;color:var(--navy)">'+labelFull(jb)+'</h3></div></div>'+
    '<ul class="acts">'+
      '<li><b>손댈 지점:</b> '+LEVER[i]+'</li>'+
      '<li><b>바뀌는 방향:</b> '+(y[i]?'양(陽)에서 음(陰)으로 — 밀던 것을 놓습니다.'
                                    :'음(陰)에서 양(陽)으로 — 놓았던 것을 잡습니다.')+'</li>'+
      '<li><b>도달점:</b> '+BYBIN[jb].ko+' — '+UPPER[upper3(jb)].t+' / '+LOWER[lower3(jb)].t+'</li>'+
    '</ul></div>'+

  '<div class="grid2">'+
    '<div class="card"><div class="sec-label">⑥ 다 음  국 면 · 序卦</div>'+
      '<h3 style="margin:0;font-size:17px;color:var(--navy)">'+labelFull(nx.b)+'</h3>'+
      '<p class="why">序卦傳이 놓은 다음 마디입니다.</p></div>'+
    '<div class="card"><div class="sec-label">뒤 집 힌  판 · 錯卦</div>'+
      '<h3 style="margin:0;font-size:17px;color:var(--navy)">'+labelFull(cb)+'</h3>'+
      '<p class="why">모든 조건이 정반대였을 때. 리스크 점검용입니다.</p></div></div>'+

  '<div class="card"><div class="sec-label">궤 적</div><div class="hist" id="hist"></div></div>'+

  '<div class="note">이 도구는 앞일을 맞히지 않습니다. 지금 답하신 여섯 가지가 만드는 <b>구조</b>와, '+
   '그 구조가 통상 어디로 풀리는지를 읽습니다. 조건이 바뀌면 다시 스캔해서 괘가 어디로 옮겨갔는지 보세요.</div>'+

  '<p style="text-align:center;margin-top:20px"><button class="backbtn" onclick="location.reload()">← 다시 스캔</button></p>';

  saveTrace(title,h,i);
  document.getElementById('input').classList.add('hidden');
  R.classList.remove('hidden');
  scrollTo(0,0);
}

function saveTrace(title,h,i){
  var k='ocst_trace';
  var all=JSON.parse(localStorage.getItem(k)||'{}');
  var arr=all[title]||[];
  arr.push({n:h.n,ko:h.ko,i:i,d:new Date().toISOString().slice(0,10)});
  all[title]=arr; localStorage.setItem(k,JSON.stringify(all));
  document.getElementById('hist').innerHTML = arr.length<2
    ? '<b>'+title+'</b> — 첫 스캔입니다. 상황이 움직인 뒤 다시 스캔하면 괘의 이동 경로가 여기 쌓입니다.'
    : '<b>'+title+'</b><br>'+arr.map(function(r){
        return r.d+' · '+r.ko+'('+STAGES[r.i].n+')'; }).join(' &nbsp;→&nbsp; ');
}
</script>
</body>
</html>
