<?xml version="1.0" encoding="UTF-8"?>
<!-- 카카오톡·트위터 등 링크 미리보기 카드용 원본. sharp로 og-image.png를 굽는다.
     1200x630은 OG 권장 비율(1.91:1). 배경은 앱 히어로와 같은 그라데이션. -->
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFCE5"/>
      <stop offset="50%"  stop-color="#F5EFFF"/>
      <stop offset="100%" stop-color="#E5F0FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 로고. 원본 viewBox 348x110을 2배로 키워 가운데 위쪽에 앉힌다 -->
  <g transform="translate(252, 120) scale(2)">
    <g transform="translate(2, 12)">
      <circle cx="47" cy="45" r="45" fill="none" stroke="#002366" stroke-width="10"/>
      <path d="M47,0 A22.5,22.5 0 0,0 47,45 A22.5,22.5 0 0,1 47,90"
            fill="none" stroke="#002366" stroke-width="1.2" stroke-linecap="round"/>
      <g stroke="#002366" stroke-width="3.5" stroke-linecap="round">
        <line x1="24" y1="58" x2="30" y2="58"/>
        <line x1="37" y1="58" x2="43" y2="58"/>
        <line x1="53" y1="32" x2="80" y2="32"/>
      </g>
      <text x="105" y="68" fill="#002366" textLength="185" lengthAdjust="spacing"
            font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="200"
            letter-spacing="12">CST</text>
      <text x="85" y="96" fill="#546E7A" textLength="235" lengthAdjust="spacing"
            font-family="Arial, Helvetica, sans-serif" font-size="7.5" font-weight="300"
            letter-spacing="0.5">ORIENTAL CHANGE SCAN TOOL</text>
    </g>
  </g>

  <text x="600" y="452" text-anchor="middle" fill="#002D62"
        font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
        font-size="42" font-weight="700">지금 이 일이 어디쯤 왔고,</text>
  <text x="600" y="508" text-anchor="middle" fill="#002D62"
        font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
        font-size="42" font-weight="700">무엇을 건드리면 달라지는지</text>

  <text x="600" y="565" text-anchor="middle" fill="#6b7280"
        font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
        font-size="24" font-weight="400">주역 64괘를 점이 아니라 진단 도구로 씁니다</text>
</svg>
